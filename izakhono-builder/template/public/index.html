<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__APP_NAME__</title><meta name="description" content="__APP_NAME__ — built on the IZAKHONO free-first platform engine."><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#071019;color:#fff}.wrap{max-width:1040px;margin:auto;padding:7vw 5vw}.tag{font-size:12px;letter-spacing:.16em;font-weight:900;color:#7cf7c9}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center}.card{background:#0d1722;border:1px solid #203245;border-radius:22px;padding:24px}h1{font-size:clamp(48px,8vw,88px);line-height:.94;letter-spacing:-.055em;margin:14px 0}p{color:#a8bac8;line-height:1.65}.accent{color:#7cf7c9}input,textarea,button{width:100%;font:inherit;border-radius:12px;padding:13px;margin:6px 0;border:1px solid #294258;background:#071019;color:#fff}textarea{min-height:110px;resize:vertical}button{background:#7cf7c9;color:#03110d;border:0;font-weight:900;cursor:pointer}.status{min-height:22px;margin-top:8px;font-size:13px}.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}@media(max-width:800px){.hero{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><div><div class="tag">BUILT ON IZAKHONO BUILDER</div><h1>__APP_NAME__</h1><p>Fast, secure and free-first by design. This launch foundation already includes its website, API, database, storage binding, lead capture, anti-abuse controls and automated deployment.</p><p class="accent"><b>Built in Africa for real-world growth.</b></p></div><form class="card" id="lead"><div class="tag">GET STARTED</div><h2>Contact us</h2><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email address" required><input name="phone" placeholder="Phone (optional)"><textarea name="message" placeholder="How can we help?"></textarea><div class="hp"><input name="website" tabindex="-1" autocomplete="off"></div><button type="submit">Send enquiry</button><div class="status"></div></form></section></main><script>const f=document.querySelector('#lead'),s=f.querySelector('.status');f.onsubmit=async e=>{e.preventDefault();s.textContent='Sending…';const d=new FormData(f);try{const r=await fetch('/api/leads',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:d.get('name'),email:d.get('email'),phone:d.get('phone'),message:d.get('message'),website:d.get('website')})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not submit');s.textContent='Received. Thank you.';f.reset()}catch(err){s.textContent=err.message||'Submission unavailable.'}}</script></body></html>
