<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIDEONOMY Shorts</title><style>
:root{--bg:#03070a;--t:#fff;--m:#a6b3bd;--a:#7cf7c9;--l:#263744}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif;height:100%}header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 18px;background:linear-gradient(#000c,transparent)}header a{color:white;text-decoration:none}.brand{font-weight:950;letter-spacing:.12em;margin-right:auto}.feed{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory}.short{height:100vh;scroll-snap-align:start;position:relative;display:grid;place-items:center;background:#000}.short video{width:100%;height:100%;object-fit:contain;background:#000}.shade{position:absolute;inset:auto 0 0;padding:110px 90px 28px 20px;background:linear-gradient(transparent,#000d)}.meta{max-width:680px}.meta h2{margin:6px 0}.meta p{color:#d3dde4}.actions{position:absolute;right:14px;bottom:90px;display:grid;gap:10px}.bubble{width:58px;height:58px;border-radius:50%;border:1px solid #ffffff42;background:#071019cc;color:white;font-weight:900;cursor:pointer}.count{font-size:11px;text-align:center;color:white}.empty{height:100vh;display:grid;place-items:center;color:var(--m);padding:30px;text-align:center}.panel{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);z-index:40;background:#0b141c;border-left:1px solid var(--l);padding:20px;transform:translateX(100%);transition:.2s;overflow:auto}.panel.on{transform:translateX(0)}.panel button,.panel input,.panel textarea{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid var(--l);background:#061018;color:white}.comment{padding:10px 0;border-bottom:1px solid var(--l)}.comment small{color:var(--m)}.close{width:auto!important;float:right}.tipbox{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tipbox button{margin:0}@media(max-width:700px){.shade{padding-right:78px}.actions{right:9px}.bubble{width:52px;height:52px}}</style></head><body>
<header><div class="brand">VIDEONOMY</div><a href="/">Home</a><a href="/creator/">Create</a></header><main id="feed" class="feed"><div class="empty">Loading Shorts…</div></main>
<aside id="panel" class="panel"><button class="close" onclick="closePanel()">✕</button><h2>Comments</h2><div id="comments"></div><input id="commentName" placeholder="Your display name"><textarea id="commentBody" placeholder="Write a comment"></textarea><button onclick="postComment()">Post comment</button></aside>
<script>
let shorts=[],active=null;const feed=document.querySelector('#feed'),panel=document.querySelector('#panel'),nameEl=document.querySelector('#commentName');nameEl.value=localStorage.getItem('vz_comment_name')||'';
async function api(path,opt={}){const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{await fetch('/api/viewer/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({platform:'videonomy'})});const d=await api('/api/videos?platform=videonomy&format=short&sort=trending');shorts=d.videos||[];render()}catch(e){feed.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function render(){if(!shorts.length){feed.innerHTML='<div class="empty"><div><h2>No Shorts yet</h2><p>The first creator who publishes a Short will appear here.</p></div></div>';return}feed.innerHTML='';shorts.forEach((v,i)=>{const s=document.createElement('section');s.className='short';s.dataset.id=v.id;s.innerHTML=`<video src="${esc(v.media_url)}" loop playsinline preload="${i<2?'metadata':'none'}"></video><div class="shade"><div class="meta"><b>@${esc(v.handle)}</b><h2>${esc(v.title)}</h2><p>${esc(v.description||'')}</p><small>${Number(v.qualified_views||0).toLocaleString()} qualified views · ${Number(v.followers||0).toLocaleString()} followers</small></div></div><div class="actions"><div><button class="bubble like">♥</button><div class="count likes">${Number(v.likes||0).toLocaleString()}</div></div><div><button class="bubble follow">＋</button><div class="count">Follow</div></div><div><button class="bubble comment">💬</button><div class="count comments">${Number(v.comments||0).toLocaleString()}</div></div><div><button class="bubble tip">R</button><div class="count">Tip</div></div></div>`;s.querySelector('.like').onclick=()=>like(v,s);s.querySelector('.follow').onclick=()=>follow(v,s);s.querySelector('.comment').onclick=()=>openComments(v,s);s.querySelector('.tip').onclick=()=>tip(v);feed.append(s)});observe()}
function observe(){const io=new IntersectionObserver(es=>es.forEach(e=>{const video=e.target.querySelector('video');if(e.isIntersecting&&e.intersectionRatio>.65){active=shorts.find(x=>x.id===e.target.dataset.id);video.play().catch(()=>{});startBeat(video,active)}else video.pause()}),{threshold:[.65]});document.querySelectorAll('.short').forEach(x=>io.observe(x))}
let beatTimer=null;function startBeat(video,v){clearInterval(beatTimer);beatTimer=setInterval(()=>{if(!video.paused&&v)fetch('/api/views/heartbeat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({video_id:v.id,seconds:10})}).catch(()=>{})},10000)}
async function like(v,s){try{const d=await api(`/api/videos/${v.id}/like`,{method:'POST'});s.querySelector('.likes').textContent=Number(d.likes||0).toLocaleString();s.querySelector('.like').textContent=d.liked?'♥':'♡'}catch(e){alert(e.message)}}
async function follow(v,s){try{const d=await api(`/api/creators/${v.creator_id}/follow`,{method:'POST'});s.querySelector('.follow').textContent=d.following?'✓':'＋'}catch(e){alert(e.message)}}
async function openComments(v,s){active=v;panel.classList.add('on');panel.dataset.video=v.id;panel.dataset.countEl='';try{const d=await api(`/api/videos/${v.id}/comments`);comments.innerHTML=(d.comments||[]).map(x=>`<div class="comment"><b>${esc(x.display_name)}</b><br>${esc(x.body)}<br><small>${esc(x.created_at)}</small></div>`).join('')||'<p>No comments yet.</p>'}catch(e){comments.textContent=e.message}}
function closePanel(){panel.classList.remove('on')}
async function postComment(){if(!active)return;const display_name=commentName.value.trim()||'Viewer',body=commentBody.value.trim();if(!body)return;localStorage.setItem('vz_comment_name',display_name);try{await api(`/api/videos/${active.id}/comments`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({display_name,body})});commentBody.value='';openComments(active);const card=document.querySelector(`.short[data-id="${active.id}"]`);if(card){const n=card.querySelector('.comments');n.textContent=Number(String(n.textContent).replace(/,/g,'' )||0)+1}}catch(e){alert(e.message)}}
async function tip(v){const raw=prompt('Tip amount in ZAR (R10 – R10,000)','25');if(raw===null)return;const amount=Math.round(Number(raw)*100);if(!Number.isFinite(amount))return;try{const d=await api('/api/tips',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({platform:'videonomy',creator_id:v.creator_id,video_id:v.id,amount_minor:amount})});location.href=d.checkout_url}catch(e){alert(e.message)}}
load();
</script></body></html>
