<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIDEONOMY Admin</title><style>:root{--bg:#071019;--c:#0d1722;--l:#203245;--t:#f6fbff;--m:#9db0bf;--a:#7cf7c9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px 4vw}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar h1{margin-right:auto}.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat span{display:block;color:var(--m);font-size:12px}.stat strong{font-size:28px}.btn,input,select,textarea{font:inherit;border:1px solid var(--l);background:#071019;color:white;border-radius:9px;padding:9px}.btn{cursor:pointer}.primary{background:var(--a);color:#04110e;border:0;font-weight:800}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--l);vertical-align:top}th{color:var(--m)}td small{color:var(--m)}.status{min-height:18px;color:var(--m);margin:8px 0}.secret{max-width:330px}.invite{word-break:break-all;color:var(--a)}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><div class="bar"><h1>VIDEONOMY Admin</h1><input class="secret" id="secret" type="password" placeholder="Admin secret"><button class="btn primary" id="connect">Connect</button><button class="btn" id="export">Export CSV</button><a class="btn" href="/">Public site</a></div><div id="status" class="status">Enter the admin secret generated during deployment. It is not embedded in this page.</div><section class="stats"><div class="card stat"><span>New leads</span><strong id="snew">—</strong></div><div class="card stat"><span>Active creators</span><strong id="screators">—</strong></div><div class="card stat"><span>Published videos</span><strong id="svideos">—</strong></div><div class="card stat"><span>Qualified views</span><strong id="sviews">—</strong></div></section><section class="card"><div class="bar"><h2>Leads</h2><select id="kind"><option value="">All types</option><option>creator</option><option>advertiser</option><option>partner</option></select><select id="filter"><option value="">All statuses</option><option>new</option><option>contacted</option><option>qualified</option><option>converted</option><option>closed</option></select><button class="btn" id="refresh">Refresh</button></div><div class="tablewrap"><table><thead><tr><th>Lead</th><th>Contact</th><th>Message / offer</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="5">Connect to load leads.</td></tr></tbody></table></div></section><section class="card" style="margin-top:14px"><h2>Latest creator invite</h2><div id="invite" class="invite">No invite created yet.</div></section></main><script>
const secret=document.querySelector('#secret'),msg=document.querySelector('#status'),rows=document.querySelector('#rows');secret.value=sessionStorage.getItem('vz_admin')||'';function headers(){return {'x-admin-secret':secret.value}}function remember(){sessionStorage.setItem('vz_admin',secret.value)}async function api(path,opt={}){opt.headers={...(opt.headers||{}),...headers()};const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}async function refresh(){try{remember();msg.textContent='Connected.';const q=new URLSearchParams({platform:'videonomy'});if(filter.value)q.set('status',filter.value);if(kind.value)q.set('kind',kind.value);const [leadData,stats]=await Promise.all([api('/api/admin/leads?'+q),api('/api/admin/stats?platform=videonomy')]);render(leadData.leads);document.querySelector('#screators').textContent=stats.active_creators;document.querySelector('#svideos').textContent=stats.published_videos;document.querySelector('#sviews').textContent=stats.qualified_views;document.querySelector('#snew').textContent=(stats.leads||[]).filter(x=>x.status==='new').reduce((a,x)=>a+Number(x.total||0),0)}catch(e){msg.textContent='Admin access failed: '+e.message;rows.innerHTML='<tr><td colspan="5">Unable to load.</td></tr>'}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(list){rows.innerHTML='';if(!list.length){rows.innerHTML='<tr><td colspan="5">No matching leads.</td></tr>';return}list.forEach(l=>{const tr=document.createElement('tr');tr.innerHTML=`<td><b>${esc(l.name)}</b><br><small>${esc(l.kind)} · ${esc(l.created_at)}</small></td><td>${esc(l.email)}<br><small>${esc(l.phone||'')}</small></td><td>${esc(l.message||'')}<br><small>${esc(l.offer_code||'')}</small></td><td><select class="st"><option>new</option><option>contacted</option><option>qualified</option><option>converted</option><option>closed</option></select><textarea class="notes" placeholder="Private notes">${esc(l.admin_notes||'')}</textarea></td><td><button class="btn save">Save</button>${l.kind==='creator'?'<button class="btn invitebtn">Invite</button>':''}</td>`;tr.querySelector('.st').value=l.status;tr.querySelector('.save').onclick=async()=>{try{await api('/api/admin/leads/'+encodeURIComponent(l.id)+'/status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status:tr.querySelector('.st').value,notes:tr.querySelector('.notes').value})});msg.textContent='Lead updated.'}catch(e){msg.textContent=e.message}};const ib=tr.querySelector('.invitebtn');if(ib)ib.onclick=async()=>{try{const d=await api('/api/admin/invites',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({platform:'videonomy',email:l.email})});document.querySelector('#invite').textContent=d.redeem_url;await navigator.clipboard?.writeText(d.redeem_url);msg.textContent='Creator invite created and copied.'}catch(e){msg.textContent=e.message}};rows.append(tr)})}document.querySelector('#connect').onclick=refresh;document.querySelector('#refresh').onclick=refresh;filter.onchange=refresh;kind.onchange=refresh;document.querySelector('#export').onclick=async()=>{try{remember();const r=await fetch('/api/admin/leads.csv?platform=videonomy',{headers:headers()});if(!r.ok)throw new Error('Export failed');const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='videonomy-leads.csv';a.click();URL.revokeObjectURL(a.href)}catch(e){msg.textContent=e.message}};
</script></body></html>
