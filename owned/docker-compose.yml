services:
  videonomy:
    build:
      context: ..
      dockerfile: owned/Dockerfile
    container_name: videonomy-engine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:18081:18081"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18081/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
