plugins {
    id 'com.android.application'
}

def apiBase = System.getenv("AUTO_AI_API_BASE") ?: "https://auto-ai-eosin.vercel.app/"
def keystorePath = System.getenv("AUTO_AI_KEYSTORE_PATH")
def keystorePassword = System.getenv("AUTO_AI_KEYSTORE_PASSWORD")
def keyAlias = System.getenv("AUTO_AI_KEY_ALIAS")
def keyPassword = System.getenv("AUTO_AI_KEY_PASSWORD")
def hasReleaseSigning = keystorePath && keystorePassword && keyAlias && keyPassword

android {
    namespace 'za.co.autoai.app'
    compileSdk 36

    defaultConfig {
        applicationId "za.co.autoai.app"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "API_BASE", "\"" + apiBase + "\""
        buildConfigField "String", "PUBLIC_SITE", "\"https://auto-ai-eosin.vercel.app/\""
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        warningsAsErrors false
    }
}
