<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IZAKHONO Portfolio</title><meta name="description" content="Explore Izakhono platforms across business, education, automotive, media, employment and technology."><style>:root{--b:#071019;--p:#0d1b26;--l:#29495a;--t:#f6fbff;--m:#a1b2bc;--g:#6cf3a5;--c:#59dce9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#173b53,#071019 42%);color:var(--t);font:15px/1.5 system-ui}.w{max-width:1120px;margin:auto;padding:0 20px}.hero{padding:70px 0 35px}.ey{font-size:10px;letter-spacing:.13em;color:var(--c);font-weight:950}h1{font-size:clamp(52px,8vw,82px);line-height:.93;letter-spacing:-.055em;margin:10px 0}.lead{font-size:20px;color:var(--m);max-width:760px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-bottom:60px}.card{display:flex;flex-direction:column;min-height:230px;background:linear-gradient(180deg,#10202c,#0a151e);border:1px solid var(--l);border-radius:18px;padding:19px;text-decoration:none;color:inherit}.card b{font-size:22px}.card p{color:var(--m);flex:1}.badge{width:max-content;border:1px solid #315164;border-radius:99px;padding:5px 8px;font-size:10px;text-transform:uppercase}.cta{color:var(--g);font-weight:950}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters button{border:1px solid #315164;background:#102332;color:#fff;border-radius:99px;padding:8px 11px;cursor:pointer}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:570px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><section class="hero"><div class="ey">IZAKHONO PORTFOLIO</div><h1>One portfolio. Different problems. Measurable growth.</h1><p class="lead">Choose the platform that matches what you need. Public products open directly; pilot-stage products capture your interest without pretending unfinished functionality is live.</p><div id="filters" class="filters"></div></section><section id="grid" class="grid"></section></div><script>
const API="https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-portfolio-growth-api",$=x=>document.getElementById(x);let all=[];function render(cat='all'){let rows=cat==='all'?all:all.filter(p=>p.category===cat);$('grid').innerHTML=rows.map(p=>'<a class="card" href="launch/?platform='+encodeURIComponent(p.slug)+'&utm_source=portfolio_directory&utm_medium=web&utm_campaign=portfolio_discovery"><span class="badge">'+p.launch_stage+'</span><b>'+p.display_name+'</b><p>'+p.primary_goal+'</p><span class="cta">'+p.primary_cta+' →</span></a>').join('')}fetch(API+'?list=1').then(r=>r.json()).then(d=>{all=(d.platforms||[]).filter(p=>p.launch_stage!=='internal');let cats=[...new Set(all.map(p=>p.category))];$('filters').innerHTML='<button onclick="render(\'all\')">All</button>'+cats.map(c=>'<button onclick="render('+JSON.stringify(c).replaceAll('"','&quot;')+')">'+c+'</button>').join('');render()}).catch(()=>{$('grid').innerHTML='<p>Portfolio registry is temporarily unavailable.</p>'});</script></body></html>
