<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAISReady — Career & Workforce Platform</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#05070b}iframe{display:block}</style></head><body><iframe id="app" src="../index.html" title="FAISReady"></iframe><script>
const f=document.getElementById('app');f.onload=()=>{const d=f.contentDocument,h=d.head,s=d.createElement('style');s.textContent=`
@keyframes silverShine{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}@keyframes textSpin{0%{transform:perspective(500px) rotateY(0)}100%{transform:perspective(500px) rotateY(360deg)}}@keyframes logoSpin{to{transform:rotate(360deg)}}@keyframes headerSweep{0%{transform:translateX(-160%) skewX(-20deg)}100%{transform:translateX(360%) skewX(-20deg)}}

background:#081c27;border:1px solid #31586a;min-height:90px}.stepNo{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:999px;background:linear-gradient(135deg,#dce6ec,#fff,#7e8b94);color:#111;font-weight:900;margin-bottom:7px}.journey b{display:block}.journey span:not(.stepNo){font-size:11px;color:#a9c5d0}.featureMatrix{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.kpiRow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{padding:18px;border-radius:18px;background:linear-gradient(180deg,#102e3f,#0b1e2a);border:1px solid #34586b}.kpi strong{display:block;font-size:28px;color:#f3fbff}.kpi small{color:#9fbac5}.passportCard{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center}.passportAvatar{width:110px;height:110px;border-radius:22px;background:linear-gradient(145deg,#dfe7ec,#6d7880 48%,#1a2126);display:grid;place-items:center;color:#fff;font-size:30px;font-weight:1000;border:1px solid #98a5ae}.statusPill,.jobBadge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:900;background:#14394a;color:#9ff5e1}.progressLine{height:9px;border-radius:999px;background:#102b38;overflow:hidden;margin:7px 0 14px}.progressLine i{display:block;height:100%;background:linear-gradient(90deg,#44e0c8,#5ca9ff);border-radius:999px}.institutionTags{display:flex;gap:8px;flex-wrap:wrap}.institutionTags span{padding:7px 10px;border-radius:999px;background:#0e2d3d;border:1px solid #315a6d;color:#cce1ea;font-size:11px}.employerDash{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.talentTable{width:100%;border-collapse:collapse}.talentTable th,.talentTable td{padding:11px 8px;border-bottom:1px solid #244657;text-align:left;font-size:12px}.talentTable th{color:#8fb1bf}.riskHigh{color:#ff8b8b}.riskMed{color:#ffd35a}.riskLow{color:#7df0a2}.academyTiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.academyTiles .card{min-height:160px}.ctaBand{margin:26px 0;padding:26px;border-radius:22px;background:linear-gradient(135deg,#0f3f52,#10212f 48%,#25313a);border:1px solid #54707f;display:flex;justify-content:space-between;gap:18px;align-items:center}.legalGuard{border-left:3px solid #74d5f0;background:#0b2634;padding:14px;border-radius:10px;color:#c9dce4;margin:14px 0}.micro{font-size:11px;color:#9bb2bc}@media(max-width:900px){.journey{grid-template-columns:repeat(3,1fr)}.featureMatrix,.academyTiles{grid-template-columns:1fr 1fr}.employerDash{grid-template-columns:1fr}.kpiRow{grid-template-columns:1fr 1fr}}@media(max-width:560px){.journey,.featureMatrix,.academyTiles,.kpiRow{grid-template-columns:1fr}.passportCard{grid-template-columns:1fr}.ctaBand{display:block}.brand b{font-size:25px!important}.logo{width:52px!important;height:52px!important}}
`;h.appendChild(s);
const q=x=>d.querySelector(x),qa=x=>[...d.querySelectorAll(x)];
const brand=q('.brand span');if(brand)brand.textContent='South Africa’s Financial-Services Career & Workforce Platform';
const eyebrow=q('.hero .eyebrow');if(eyebrow)eyebrow.textContent='PREPARE • PASS • PROVE • GET HIRED • PROGRESS';
const heroH=q('.hero h1');if(heroH)heroH.innerHTML='Build your future.<br><em>Become FAISReady.</em>';
const heroP=q('.hero p');if(heroP)heroP.textContent='One platform for regulatory-exam preparation, competence readiness, verified career profiles, employer talent discovery and continuous workforce development — designed for people entering and progressing through South African financial services.';
const nav=q('nav');if(!nav)return;
const addNav=(id,label)=>{if(!q('[data-view="'+id+'"]')){const b=d.createElement('button');b.dataset.view=id;b.textContent=label;b.onclick=()=>d.defaultView.show(id);nav.appendChild(b)}};
addNav('passport','FAISReady ID');addNav('careers','Jobs');addNav('workforce','Workforce Intel');addNav('academy','Academy');
const home=q('#home');if(home&&!q('.ecosystemHero'))home.insertAdjacentHTML('afterbegin',`<div class="ecosystemHero"><div class="eyebrow">THE FINANCIAL-SERVICES CAREER OPERATING SYSTEM</div><h2 class="silverTitle">Prepare. Pass. Prove. Get hired. Progress.</h2><p>FAISReady connects preparation, competence evidence, workforce intelligence and career opportunity in one place. Individuals build readiness. Employers discover, assess, develop and track talent.</p><div class="journey"><div class="step"><span class="stepNo">1</span><b>Assess</b><span>Find gaps.</span></div><div class="step"><span class="stepNo">2</span><b>Prepare</b><span>Learn law and application.</span></div><div class="step"><span class="stepNo">3</span><b>Pass</b><span>Build exam readiness.</span></div><div class="step"><span class="stepNo">4</span><b>Prove</b><span>Build your FAISReady ID.</span></div><div class="step"><span class="stepNo">5</span><b>Get hired</b><span>Match to opportunities.</span></div><div class="step"><span class="stepNo">6</span><b>Progress</b><span>Develop continuously.</span></div></div></div>`);
const mk=(id,html)=>{if(!q('#'+id)){const el=d.createElement('section');el.id=id;el.className='view';el.innerHTML=html;q('#pricing').before(el)}};
mk('passport',`<div class="heading"><div><div class="eyebrow">FAISREADY ID</div><h2>Your competence passport for financial services</h2></div></div><div class="passportCard card"><div class="passportAvatar">FR</div><div><span class="statusPill">DEMO PROFILE</span><h3>One professional identity that grows with your career</h3><p>Track exam readiness, verified RE status, qualifications, experience, training, competence assessments, CPD and employment availability — with official credentials clearly distinguished from platform readiness scores.</p><div class="progressLine"><i style="width:78%"></i></div><div class="institutionTags"><span>RE5 readiness 82%</span><span>Ethics 91%</span><span>Client conduct 86%</span><span>Available for work</span></div></div></div><div class="featureMatrix" style="margin-top:14px"><article class="card"><span class="tag">VERIFY</span><h3>Credential Vault</h3><p>Controlled evidence sharing for employer review.</p></article><article class="card"><span class="tag">DEVELOP</span><h3>Gap-to-Goal Plan</h3><p>Turn weak areas into a personal remediation path.</p></article><article class="card"><span class="tag">SHARE</span><h3>Employer-ready profile</h3><p>Candidate-controlled career and readiness sharing.</p></article></div>`);
mk('careers',`<div class="heading"><div><div class="eyebrow">FAISREADY CAREERS</div><h2>Pass the exam. Then open the next door.</h2></div></div><div class="grid g2"><article class="card"><span class="tag">TALENT MARKETPLACE</span><h3>Jobs for FAIS-ready people</h3><p>Employers can advertise roles and search candidates by verified RE status, readiness, experience, province and availability.</p><p><b>Financial Adviser</b><br><span class="micro">Gauteng • RE5 preferred • Demo opening</span></p><p><b>Service Consultant</b><br><span class="micro">National • Financial-services experience • Demo opening</span></p></article><article class="card"><span class="tag">CAREER TOOLS</span><h3>Become employable, not merely exam-ready</h3><p>CV builder, role explorer, interview simulator, employer-facing profile and job matching bridge preparation to employment.</p><button class="primary" onclick="alert('Career matching activates with live accounts and verified credentials.')">Build career profile</button></article></div><div class="legalGuard"><b>Integrity rule:</b> “RE Passed” is shown only when acceptable evidence of an official result/certificate is provided. Internal readiness scores are never presented as official qualifications.</div>`);
mk('workforce',`<div class="heading"><div><div class="eyebrow">FAISREADY WORKFORCE INTELLIGENCE</div><h2>Recruit. Assess. Train. Verify. Develop.</h2></div></div><div class="kpiRow"><div class="kpi"><small>Team readiness</small><strong>78%</strong><small>Demo cohort</small></div><div class="kpi"><small>Exam-ready</small><strong>62</strong><small>of 80 staff</small></div><div class="kpi"><small>Needs intervention</small><strong>11</strong><small>targeted remediation</small></div><div class="kpi"><small>Credentials due</small><strong>7</strong><small>review / renewal</small></div></div><div class="employerDash" style="margin-top:14px"><article class="card"><h3>Talent & competence dashboard</h3><table class="talentTable"><thead><tr><th>Employee</th><th>Track</th><th>Readiness</th><th>Status</th></tr></thead><tbody><tr><td>Candidate A</td><td>RE5</td><td>91%</td><td class="riskLow">Ready</td></tr><tr><td>Candidate B</td><td>RE1</td><td>68%</td><td class="riskMed">Develop</td></tr><tr><td>Candidate C</td><td>RE5</td><td>49%</td><td class="riskHigh">Intervention</td></tr><tr><td>Candidate D</td><td>RE5</td><td>83%</td><td class="riskLow">Ready</td></tr></tbody></table></article><article class="card"><span class="tag">SMART REMEDIATION</span><h3>From risk signal to action</h3><p>Identify where a person or team is weak, assign targeted learning, reassess and retain a development trail.</p><p class="micro">Psychometric testing, where used, should operate under appropriate South African professional and legal governance. Platform assessments are positioned as job-related knowledge and competence-readiness tools.</p></article></div>`);
mk('academy',`<div class="heading"><div><div class="eyebrow">FAISREADY ACADEMY</div><h2>The learning layer after the exam</h2></div></div><div class="academyTiles"><article class="card"><span class="tag">CPD</span><h3>CPD tracker</h3><p>Track development activity, evidence and upcoming requirements.</p></article><article class="card"><span class="tag">TRAINING</span><h3>Class-of-business pathways</h3><p>Partner-led training can be assigned and evidenced.</p></article><article class="card"><span class="tag">PRODUCT</span><h3>Product training</h3><p>Record product-specific learning where applicable.</p></article><article class="card"><span class="tag">ALERTS</span><h3>Regulatory change alerts</h3><p>Flag official changes and affected learning content.</p></article></div><div class="ctaBand"><div><h3>Give every employee a development pathway.</h3><p>Move from once-off exam prep toward continuous competence and career growth.</p></div><button class="primary" onclick="d.defaultView.show('companies')">Explore company platform</button></div>`);
const comp=q('#companies');if(comp&&!q('#companies .ecosystemHero')){const hd=comp.querySelector('.heading');hd.insertAdjacentHTML('afterend',`<div class="ecosystemHero"><div class="eyebrow">INSTITUTIONAL VALUE PROPOSITION</div><h2>Train your people. Assess your people. Find your people — in one place.</h2><p>For banks, insurers, brokerages, dealerships, contact centres, compliance practices and financial-services employers that need a clearer view of workforce readiness.</p><div class="institutionTags"><span>Bulk onboarding</span><span>Role-based assessments</span><span>Readiness dashboards</span><span>Talent search</span><span>Remediation plans</span><span>Credential evidence</span><span>Career marketplace</span></div></div>`)}
qa('nav button').forEach(b=>b.onclick=()=>d.defaultView.show(b.dataset.view));
};</script></body></html>
