<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAISReady Command Centre</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Arial,sans-serif;background:#05070b;color:#eef6fa}body{display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;background:linear-gradient(180deg,#11161d,#080b10);border-bottom:1px solid #7c8791;box-shadow:0 10px 30px #0008}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:1000;background:linear-gradient(135deg,#111,#dce4e9 55%,#555f67);color:#080b10;border:1px solid #aab4bc}.brand b{font-size:20px}.brand small{display:block;color:#9fb2bc;margin-top:2px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:1px solid #355364;background:#0b1c27;color:#cfe0e8;border-radius:999px;padding:9px 14px;font-weight:800;cursor:pointer}.tabs button.active{background:linear-gradient(135deg,#dce6ec,#7f8b94);color:#081017;border-color:#dce6ec}.frame{width:100%;height:100%;border:0;background:#05070b}.status{font-size:11px;color:#8fa5af;text-align:right}.status strong{display:block;color:#8ff2d4;font-size:11px}@media(max-width:720px){.top{align-items:flex-start;flex-direction:column}.status{text-align:left}.tabs{width:100%}.tabs button{flex:1}}</style></head><body><header class="top"><div class="brand"><div class="mark">FR</div><div><b>FAISReady Command Centre</b><small>South African workforce, learning, talent & contact-centre operations</small></div></div><nav class="tabs"><button id="platformBtn" class="active" onclick="loadView('platform')">Core Platform</button><button id="callBtn" onclick="loadView('callcentre')">Call Centre</button></nav><div class="status"><strong>PUBLIC BETA</strong>Backend connectivity staged next</div></header><iframe id="workspace" class="frame" src="../luxury/" title="FAISReady workspace"></iframe><script>const frame=document.getElementById('workspace'),p=document.getElementById('platformBtn'),c=document.getElementById('callBtn');function loadView(v){const isCall=v==='callcentre';frame.src=isCall?'../callcentre/':'../luxury/';p.classList.toggle('active',!isCall);c.classList.toggle('active',isCall);history.replaceState(null,'','#'+v)}const initial=location.hash.replace('#','');if(initial==='callcentre')loadView('callcentre');</script></body></html>
