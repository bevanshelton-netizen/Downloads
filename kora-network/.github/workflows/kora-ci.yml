name: KORA TV CI

on:
  push:
    paths:
      - 'kora-network/**'
  pull_request:
    paths:
      - 'kora-network/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kora-network
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kora-network/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate release policy
        run: npm run validate:release-policy
      - name: Validate money integrity
        run: npm run validate:money-integrity
      - name: Validate public experience
        run: npm run validate:public-experience
      - name: Build
        run: npm run build
