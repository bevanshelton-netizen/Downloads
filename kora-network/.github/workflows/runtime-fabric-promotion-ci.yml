name: Runtime Fabric Promotion CI

on:
  push:
    paths:
      - 'kora-network/infra/runtime-fabric/**'
      - 'kora-network/.github/workflows/runtime-fabric-promotion-ci.yml'
  pull_request:
    paths:
      - 'kora-network/infra/runtime-fabric/**'
      - 'kora-network/.github/workflows/runtime-fabric-promotion-ci.yml'

jobs:
  promotion-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kora-network/infra/runtime-fabric/controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile controller modules
        run: python -m compileall -q .
      - name: Promotion gate tests
        run: python test_promotion_gate.py
      - name: Promotion orchestrator tests
        run: python test_promotion_orchestrator.py
      - name: Durable promotion transaction tests
        run: python test_promotion_transaction.py
      - name: PostgreSQL deployment store tests
        run: python test_postgres_deployment_store.py
