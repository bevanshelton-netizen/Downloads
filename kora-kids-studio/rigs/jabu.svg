<g id="shadow" opacity=".16"><ellipse cx="330" cy="505" rx="190" ry="24" fill="#173453"/></g>
<g id="body"><ellipse cx="320" cy="330" rx="183" ry="135" fill="url(#skin)" stroke="#fff" stroke-width="10"/></g>
