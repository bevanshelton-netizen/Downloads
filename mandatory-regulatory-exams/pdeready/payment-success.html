<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Confirming payment — PDEReady</title><style>body{margin:0;background:#07131d;color:#f7fbff;font:16px/1.6 Inter,system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}.box{width:min(680px,92vw);background:#0d2939;border:1px solid #2d5b70;border-radius:22px;padding:28px;text-align:center}.spin{width:38px;height:38px;margin:18px auto;border:4px solid #31586b;border-top-color:#f1cb66;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}a,button{color:#07131d;background:#f1cb66;border:0;border-radius:11px;padding:11px 14px;font-weight:900;text-decoration:none;cursor:pointer}.muted{color:#b8cbd5}</style></head><body><main class="box"><h1>Confirming your payment</h1><div class="spin" id="spin"></div><p id="message" class="muted">We are checking the transaction directly with iKhokha before activating access.</p><div id="actions"></div></main><script>
const p=new URLSearchParams(location.search);const ref=p.get('ref')||localStorage.getItem('pdeready.lastPaymentRef')||'';let tries=0;
async function verify(){tries++;if(!ref){fail('Payment reference is missing. Return to checkout and use the same browser.');return}try{const r=await fetch('/api/ikhokha/verify?externalReference='+encodeURIComponent(ref),{cache:'no-store',credentials:'same-origin'});const d=await r.json();if(r.ok&&d.paid){document.getElementById('message').textContent='Payment verified. Activating your PDEReady Premium room…';localStorage.removeItem('pdeready.lastPaymentRef');setTimeout(()=>location.replace(d.accessUrl||'/api/pdeready/access'),450);return}if(r.status===503){fail('The payment provider connection is not configured on this deployment yet. Your payment reference has been preserved: '+ref);return}if(tries<6){document.getElementById('message').textContent='Payment received. Waiting for final provider confirmation…';setTimeout(verify,1600);return}fail('We could not confirm a paid status yet. Do not pay again. Retry verification using the button below.');}catch(e){if(tries<6){setTimeout(verify,1600)}else fail('We could not reach the verification service. Do not pay again; retry verification.') }}
function fail(msg){document.getElementById('spin').style.display='none';document.getElementById('message').textContent=msg;document.getElementById('actions').innerHTML='<button onclick="tries=0;document.getElementById(\'spin\').style.display=\'block\';verify()">Retry verification</button> &nbsp; <a href="./premium">Back to packages</a>'}
verify();
</script></body></html>
