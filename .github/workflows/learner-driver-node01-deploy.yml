name: Learner Driver Infrastructure Deployment

on:
  push:
    branches: [main]
    paths:
      - 'learner-driver-sa-v6-live/**'
      - 'izakhono-owned-cloud/deploy-learner-driver-sa.sh'
      - 'infrastructure/control/portfolio-desired-state.json'
      - 'izakhono-infrastructure-executor/targets.json'
      - 'owner-host/platforms.json'
      - '.github/workflows/learner-driver-node01-deploy.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'learner-driver-sa-v6-live/**'
      - 'izakhono-owned-cloud/deploy-learner-driver-sa.sh'
      - 'infrastructure/control/portfolio-desired-state.json'
      - 'izakhono-infrastructure-executor/targets.json'
      - 'owner-host/platforms.json'
      - '.github/workflows/learner-driver-node01-deploy.yml'

permissions:
  contents: read

concurrency:
  group: learner-driver-infrastructure-deploy
  cancel-in-progress: true

jobs:
  contract:
    name: Verify Learner Driver infrastructure contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Validate engine, deployer, request and platform registration
        shell: bash
        run: |
          set -euo pipefail
          node --check learner-driver-sa-v6-live/server.mjs
          bash -n izakhono-owned-cloud/deploy-learner-driver-sa.sh
          node - <<'NODE'
          const fs=require('fs');
          const authority=JSON.parse(fs.readFileSync('IZAKHONO-INFRASTRUCTURE-AUTHORITY.json','utf8'));
          if(authority.execution_policy?.production_scheduler!=='IZAKHONO_INFRASTRUCTURE_EXECUTOR') throw new Error('native executor is not production scheduler');
          if(authority.execution_policy?.github_self_hosted_runner_required_for_production!==false) throw new Error('GitHub runner still required');
          const catalog=JSON.parse(fs.readFileSync('owner-host/platforms.json','utf8'));
          const p=(catalog.platforms||[]).find(p=>p.id==='learner-driver-sa');
          if(!p) throw new Error('Learner Driver platform registration missing');
          if(p.defaultHostname!=='learnerdriver.domains.izakhonoafrica.co.za') throw new Error('owned hostname mismatch');
          if(p.deploy!=='izakhono-owned-cloud/deploy-learner-driver-sa.sh') throw new Error('deployer mismatch');
          if(p.runtimeAuthority!=='IZAKHONO_INFRASTRUCTURE'||p.laptopRuntimeDependency!==false||p.platformToLaptopTraffic!=='DENY') throw new Error('platform authority mismatch');
          const control=JSON.parse(fs.readFileSync('infrastructure/control/portfolio-desired-state.json','utf8'));
          const r=(control.requests||[]).find(x=>x.id==='learner-driver-infrastructure-20260926-01');
          if(!r||r.enabled!==true||r.action!=='deploy-platform'||r.platform_id!=='learner-driver-sa') throw new Error('native deployment request missing');
          if(r.laptop_target!==false||r.public_live_claim!==false||r.external_resilience_preserve!==true) throw new Error('request safety contract mismatch');
          const targets=JSON.parse(fs.readFileSync('izakhono-infrastructure-executor/targets.json','utf8'));
          if(targets.targets?.['learner-driver-sa']?.command?.[1]!==p.deploy) throw new Error('executor target mismatch');
          console.log('LEARNER_DRIVER_NATIVE_EXECUTOR_REQUEST=VERIFIED');
          console.log('GITHUB_PRODUCTION_EXECUTION=false');
          NODE

  external-resilience:
    name: Verify Learner Driver external resilience
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify tracked GitHub Pages build
        shell: bash
        run: |
          set -euo pipefail
          URL='https://bevanshelton-netizen.github.io/Downloads/learner-driver-sa-v6-live/'
          OK=0
          for i in {1..6}; do
            if PAGE="$(curl -LfsS --connect-timeout 5 --max-time 20 "$URL" 2>/dev/null)"; then
              if grep -Fqi 'Learner Driver SA' <<<"$PAGE"; then OK=1; break; fi
            fi
            sleep 5
          done
          test "$OK" = "1"
          echo 'LEARNER_DRIVER_RESILIENCE=VERIFIED'

  observe-owned-public:
    name: Observe Learner Driver owned public HTTPS
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Observe without creating a live claim
        shell: bash
        run: |
          set -euo pipefail
          HOST='learnerdriver.domains.izakhonoafrica.co.za'
          set +e
          curl -fsS --connect-timeout 5 --max-time 20 "https://$HOST/health" -o /tmp/health.json
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo 'LEARNER_DRIVER_OWNED_PUBLIC_HTTPS=NOT_VERIFIED'
            echo 'PUBLIC_LIVE_CLAIM=false'
            exit 0
          fi
          if node - <<'NODE'
          const x=require('/tmp/health.json');
          if(x.ok!==true||x.service!=='learner-driver-sa'||x.runtime!=='izakhono-owned') process.exit(2);
          NODE
          then
            echo 'LEARNER_DRIVER_OWNED_PUBLIC_HTTPS=VERIFIED'
          else
            echo 'LEARNER_DRIVER_OWNED_PUBLIC_HTTPS=IDENTITY_MISMATCH'
          fi
          echo 'PUBLIC_LIVE_CLAIM=false'
