name: KORA Disable Vercel Protection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kora-disable-vercel-protection.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kora-disable-vercel-protection
  cancel-in-progress: false

jobs:
  unlock:
    runs-on: ubuntu-latest
    environment: kora-production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      KORA_PUBLIC_URL: https://kora-network-bevan2.vercel.app
    steps:
      - name: Require protected Vercel credentials
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID"; exit 1; }

      - name: Link exact KORA project locally
        shell: bash
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Disable Vercel SSO protection
        shell: bash
        run: |
          npx --yes vercel@59.11.7 project protection disable --sso --token="$VERCEL_TOKEN"

      - name: Verify public alias is no longer behind Vercel Authentication
        shell: bash
        run: |
          headers="$RUNNER_TEMP/kora-headers.txt"
          curl -sS -D "$headers" -o /dev/null --max-redirs 0 "$KORA_PUBLIC_URL/" || true
          if grep -Eiq '^location:[[:space:]]*https://vercel\.com/sso-api' "$headers"; then
            echo "KORA is still behind Vercel Authentication"
            cat "$headers"
            exit 1
          fi
          status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' "$headers")"
          echo "KORA_PUBLIC_HTTP_STATUS=$status"
          test -n "$status"
          echo "KORA_VERCEL_SSO_PROTECTION=DISABLED" >> "$GITHUB_STEP_SUMMARY"
          echo "Public alias: $KORA_PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
