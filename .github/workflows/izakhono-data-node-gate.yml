name: IZAKHONO DATA NODE Gate

on:
  push:
    branches: [build/izakhono-data-node]
    paths:
      - "izakhono-data-node/**"
      - ".github/workflows/izakhono-data-node-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "izakhono-data-node/**"
      - "izakhono-growth-os/**"
      - ".github/workflows/izakhono-data-node-gate.yml"

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: izakhono-data-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Verify no external runtime dependencies
        run: |
          test "$(node -e 'console.log(Object.keys(require("./package.json").dependencies||{}).length)')" = "0"
      - name: Run owned data-node self test
        run: npm run check
      - name: Verify service safety defaults
        run: |
          grep -q '127.0.0.1' server.mjs
          grep -q 'IZAKHONO_DATA_KEY' server.mjs
          grep -q 'journal_mode=WAL' server.mjs
