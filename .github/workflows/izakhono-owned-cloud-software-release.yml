name: IZAKHONO OWNED CLOUD Software Release Gate

on:
  push:
    branches: [release/izakhono-owned-cloud-software-complete]
    paths:
      - "izakhono-*-node/**"
      - "izakhono-mail-relay-adapter/**"
      - "izakhono-owned-cloud/**"
      - "izakhono-growth-os/**"
      - ".github/workflows/izakhono-owned-cloud-software-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "izakhono-*-node/**"
      - "izakhono-owned-cloud/**"
      - "izakhono-growth-os/**"
      - ".github/workflows/izakhono-owned-cloud-software-release.yml"

permissions:
  contents: read

jobs:
  static-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Run static software acceptance
        run: bash izakhono-owned-cloud/software-acceptance.sh
      - name: Prove reversible standby state promotion transaction
        run: |
          bash -n izakhono-owned-cloud/promote-standby-state.sh
          node --check izakhono-owned-cloud/standby-state-swap.mjs
          node izakhono-owned-cloud/tests/standby-state-swap.mjs
          grep -q 'PROMOTE-STAGED-STATE' izakhono-owned-cloud/promote-standby-state.sh
          grep -q 'public_route_changed:false' izakhono-owned-cloud/promote-standby-state.sh
          grep -q 'dns_changed:false' izakhono-owned-cloud/promote-standby-state.sh
          grep -q 'receiptVerified' izakhono-owned-cloud/promote-standby-state.sh
          grep -q 'ROLLED_BACK' izakhono-owned-cloud/standby-state-swap.mjs
      - name: Prove data-safe failback reconciliation contract
        run: |
          bash -n izakhono-owned-cloud/reconcile-failback-state.sh
          bash -n izakhono-owned-cloud/controlled-failback.sh
          bash izakhono-owned-cloud/tests/failback-reconciliation-plan.sh
          grep -q 'RUN-DATA-SAFE-FAILBACK' izakhono-owned-cloud/reconcile-failback-state.sh
          grep -q 'Backup encryption-key lineage mismatch' izakhono-owned-cloud/reconcile-failback-state.sh
          grep -q 'data_reconciled:true' izakhono-owned-cloud/reconcile-failback-state.sh
          grep -q 'reconcile-failback-state.sh execute instead' izakhono-owned-cloud/controlled-failback.sh
      - name: Prove passive standby background-worker fencing contract
        run: |
          bash -n izakhono-owned-cloud/set-standby-role.sh
          grep -q 'ACTIVATE-WITH-WITNESS' izakhono-owned-cloud/set-standby-role.sh
          grep -q 'automatic_activation:false' izakhono-owned-cloud/set-standby-role.sh
          grep -q 'background_mutators_stopped:true' izakhono-owned-cloud/prove-physical-ha.sh
          grep -q 'STANDBY_MUTATORS' izakhono-owned-cloud/prove-physical-ha.sh
          grep -q 'standby_background_role_active_before_route:true' izakhono-owned-cloud/controlled-failover-drill.sh
          grep -q 'standby_service_role:"PASSIVE"' izakhono-owned-cloud/reconcile-failback-state.sh

  node-self-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Run all owned-cloud service self-tests concurrently
        shell: bash
        run: |
          set -u
          services=(
            izakhono-data-node
            izakhono-runtime-node
            izakhono-edge-node
            izakhono-object-node
            izakhono-queue-node
            izakhono-auth-node
            izakhono-analytics-node
            izakhono-notify-node
            izakhono-ai-gateway-node
            izakhono-gpu-compute-node
            izakhono-model-worker-node
            izakhono-mail-relay-adapter
            izakhono-code-node
            izakhono-backup-node
            izakhono-ci-worker-node
            izakhono-replica-node
            izakhono-dns-node
            izakhono-package-node
            izakhono-failover-node
            izakhono-witness-node
          )

          declare -A pids
          mkdir -p /tmp/izakhono-self-tests

          for service in "${services[@]}"; do
            (
              set -euo pipefail
              cd "$service"
              test "$(node -e 'console.log(Object.keys(require("./package.json").dependencies||{}).length)')" = "0"
              npm run check
            ) >"/tmp/izakhono-self-tests/$service.log" 2>&1 &
            pids["$service"]=$!
            echo "STARTED $service pid=${pids[$service]}"
          done

          failed=0
          for service in "${services[@]}"; do
            if wait "${pids[$service]}"; then
              echo "PASS $service"
            else
              echo "::error title=$service self-test failed::See grouped log below"
              echo "::group::$service failure log"
              cat "/tmp/izakhono-self-tests/$service.log"
              echo "::endgroup::"
              failed=1
            fi
          done

          echo "TOTAL_SERVICES=${#services[@]}"
          echo "FAILED=$failed"
          exit "$failed"

  growth-os-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: izakhono-growth-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Preserve owned-v2 and safe-write contract
        run: |
          grep -q 'liveAdWrites:false' app/api/status/route.ts
          grep -q 'runtime:"IZAKHONO OWNED CLOUD"' app/api/status/route.ts
          grep -qi 'campaigns paused' app/api/plan/route.ts
          grep -q 'service:"growth-os-v2"' app/api/health/route.ts
          grep -q 'GROWTH_OS_PUBLIC_BASE_URL' 'app/api/oauth/[provider]/readiness/route.ts'
          ! grep -R -n 'izakhono-growth-os.vercel.app' app lib
          grep -q 'growth.write' app/api/approvals/route.ts
          grep -q 'growth.write' 'app/api/approvals/[id]/decision/route.ts'
          grep -q 'growth.read' app/api/stats/route.ts
          grep -q 'httpOnly:true' app/api/auth/login/route.ts

  release-status:
    if: always()
    runs-on: ubuntu-latest
    needs: [static-acceptance,node-self-tests,growth-os-build]
    env:
      STATIC_RESULT: ${{ needs.static-acceptance.result }}
      NODE_TEST_RESULT: ${{ needs.node-self-tests.result }}
      GROWTH_RESULT: ${{ needs.growth-os-build.result }}
    steps:
      - name: Report complete release-gate status
        run: |
          echo "IZAKHONO OWNED CLOUD"
          echo "STATIC_ACCEPTANCE=$STATIC_RESULT"
          echo "NODE_SELF_TESTS=$NODE_TEST_RESULT"
          echo "GROWTH_OS_BUILD=$GROWTH_RESULT"
          if [ "$STATIC_RESULT" = "success" ] && [ "$NODE_TEST_RESULT" = "success" ] && [ "$GROWTH_RESULT" = "success" ]; then
            echo "SOFTWARE_COMPLETE_PHYSICAL_ACTIVATION_PENDING"
            echo "No claim of physical HA, DNS delegation or public cutover is made by this CI gate."
          else
            echo "SOFTWARE_INCOMPLETE"
            echo "All parallel jobs were allowed to finish; one or more release checks still require correction."
            exit 1
          fi
