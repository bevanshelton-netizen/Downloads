name: Runtime Fabric Integrity

on:
  push:
    paths:
      - 'kora-network/infra/runtime-fabric/**'
      - '.github/workflows/runtime-fabric-integrity.yml'
  pull_request:
    paths:
      - 'kora-network/infra/runtime-fabric/**'
      - '.github/workflows/runtime-fabric-integrity.yml'

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run hash-chain tests
        working-directory: kora-network/infra/runtime-fabric/controller
        run: python test_event_hash_chain.py
      - name: Run PostgreSQL event-store tests
        working-directory: kora-network/infra/runtime-fabric/controller
        run: python test_postgres_event_store.py
