name: KORA TV Release Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kora-network/**'
      - '.github/workflows/kora-tv-release-gate.yml'
  pull_request:
    paths:
      - 'kora-network/**'
      - '.github/workflows/kora-tv-release-gate.yml'

permissions:
  contents: read

concurrency:
  group: kora-tv-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kora-network
    timeout-minutes: 15
    steps:
      - name: Checkout KORA TV
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kora-network/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Release policy
        run: npm run validate:release-policy

      - name: Money integrity
        run: npm run validate:money-integrity

      - name: Public experience
        run: npm run validate:public-experience

      - name: Activation orchestration
        run: npm run validate:activation

      - name: Independence readiness
        run: npm run validate:independence

      - name: Release readiness contract
        run: npm run validate:release-readiness

      - name: Partner gateway contract
        run: npm run validate:partner-gateway

      - name: Production build
        run: npm run build

      - name: Release summary
        if: always()
        run: |
          {
            echo '## KORA TV Release Gate'
            echo ''
            echo '- TypeScript validation: executed'
            echo '- Release policy: executed'
            echo '- Money integrity: executed'
            echo '- Public experience: executed'
            echo '- Activation orchestration: executed'
            echo '- Independence readiness contract: executed'
            echo '- Release readiness contract: executed'
            echo '- Partner gateway contract: executed'
            echo '- Next.js production build: executed'
            echo ''
            echo 'A passing workflow validates the application build and release contracts; it does not by itself claim public production deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
