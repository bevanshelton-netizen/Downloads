name: AUTO AI Google Play Internal Release

on:
  workflow_dispatch:
    inputs:
      release_status:
        description: Google Play release status
        required: true
        default: completed
        type: choice
        options:
          - completed
          - draft

permissions:
  contents: read

jobs:
  publish-internal:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Require Play publishing secrets
        env:
          KS: ${{ secrets.AUTO_AI_KEYSTORE_B64 }}
          SP: ${{ secrets.AUTO_AI_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.AUTO_AI_KEY_ALIAS }}
          KP: ${{ secrets.AUTO_AI_KEY_PASSWORD }}
          GP: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$KS"
          test -n "$SP"
          test -n "$KA"
          test -n "$KP"
          test -n "$GP"

      - name: Prepare upload keystore
        env:
          AUTO_AI_KEYSTORE_B64: ${{ secrets.AUTO_AI_KEYSTORE_B64 }}
        run: |
          printf '%s' "$AUTO_AI_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/auto-ai-upload.jks"
          chmod 600 "$RUNNER_TEMP/auto-ai-upload.jks"

      - name: Build signed Play bundle
        working-directory: auto-ai-android
        env:
          AUTO_AI_API_BASE: ${{ vars.AUTO_AI_API_BASE }}
          AUTO_AI_KEYSTORE_PATH: ${{ runner.temp }}/auto-ai-upload.jks
          AUTO_AI_KEYSTORE_PASSWORD: ${{ secrets.AUTO_AI_KEYSTORE_PASSWORD }}
          AUTO_AI_KEY_ALIAS: ${{ secrets.AUTO_AI_KEY_ALIAS }}
          AUTO_AI_KEY_PASSWORD: ${{ secrets.AUTO_AI_KEY_PASSWORD }}
        run: |
          gradle --no-daemon clean lintDebug bundleRelease
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-ai-signed-play-bundle
          path: auto-ai-android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload AUTO AI to Google Play internal testing
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: za.co.autoai.app
          releaseFiles: auto-ai-android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ inputs.release_status }}
          whatsNewDirectory: auto-ai-android/distribution/whatsnew