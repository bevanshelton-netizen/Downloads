name: KORA Production Environment Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/kora-production-environment-audit.yml'

permissions:
  contents: read

concurrency:
  group: kora-production-environment-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: kora-production
    defaults:
      run:
        working-directory: kora-network
    env:
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VIDEO_PROVIDER: ${{ vars.VIDEO_PROVIDER }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_STREAM_TOKEN: ${{ secrets.CLOUDFLARE_STREAM_TOKEN }}
      CLOUDFLARE_STREAM_CUSTOMER_CODE: ${{ vars.CLOUDFLARE_STREAM_CUSTOMER_CODE }}
      PAYFAST_MERCHANT_ID: ${{ secrets.PAYFAST_MERCHANT_ID }}
      PAYFAST_MERCHANT_KEY: ${{ secrets.PAYFAST_MERCHANT_KEY }}
      PAYFAST_PASSPHRASE: ${{ secrets.PAYFAST_PASSPHRASE }}
      PAYFAST_SANDBOX: ${{ vars.PAYFAST_SANDBOX }}
      KORA_INTERNAL_API_SECRET: ${{ secrets.KORA_INTERNAL_API_SECRET }}
      NEXT_PUBLIC_OPERATOR_NAME: ${{ vars.NEXT_PUBLIC_OPERATOR_NAME }}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
      NEXT_PUBLIC_PRIVACY_EMAIL: ${{ vars.NEXT_PUBLIC_PRIVACY_EMAIL }}
      NEXT_PUBLIC_RIGHTS_EMAIL: ${{ vars.NEXT_PUBLIC_RIGHTS_EMAIL }}
      KORA_LEGAL_APPROVED: ${{ vars.KORA_LEGAL_APPROVED }}
      KORA_REGULATORY_APPROVED: ${{ vars.KORA_REGULATORY_APPROVED }}
      KORA_CHILD_SAFETY_APPROVED: ${{ vars.KORA_CHILD_SAFETY_APPROVED }}
      KORA_PAYOUT_OPERATIONS_APPROVED: ${{ vars.KORA_PAYOUT_OPERATIONS_APPROVED }}
      KORA_BACKUP_OPERATIONS_APPROVED: ${{ vars.KORA_BACKUP_OPERATIONS_APPROVED }}
      KORA_INCIDENT_RESPONSE_APPROVED: ${{ vars.KORA_INCIDENT_RESPONSE_APPROVED }}
      KORA_PREFLIGHT_MODE: private_beta

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kora-network/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Read-only protected-environment preflight
        id: preflight
        shell: bash
        run: |
          set +e
          npm run preflight:production
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Read-only deployed readiness snapshot
        id: readiness
        shell: bash
        run: |
          if [[ -z "${NEXT_PUBLIC_APP_URL:-}" ]]; then
            echo "NEXT_PUBLIC_APP_URL is not configured; deployed readiness cannot be queried."
            echo "status=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node - <<'NODE'
          const base = String(process.env.NEXT_PUBLIC_APP_URL || '').replace(/\/$/, '');
          try {
            const response = await fetch(`${base}/api/readiness`, { cache: 'no-store' });
            const text = await response.text();
            console.log(`Readiness HTTP ${response.status}`);
            try {
              const data = JSON.parse(text);
              console.log(JSON.stringify(data, null, 2));
            } catch {
              console.log('Readiness endpoint did not return JSON.');
            }
          } catch (error) {
            console.log(`Readiness request failed: ${error instanceof Error ? error.message : 'unknown error'}`);
          }
          NODE
      - name: Audit summary
        shell: bash
        run: |
          {
            echo '# KORA production environment audit'
            echo
            echo 'This workflow is read-only. It does not print secret values or mutate KORA, Supabase, PayFast, Cloudflare, or Vercel.'
            echo
            if [[ '${{ steps.preflight.outputs.exit_code }}' == '0' ]]; then
              echo '- Protected-environment private-beta preflight: **PASS**'
            else
              echo '- Protected-environment private-beta preflight: **BLOCKED** — see the preflight step for the exact missing configuration names.'
            fi
            echo '- Deployed `/api/readiness`: queried when `NEXT_PUBLIC_APP_URL` is configured; output contains readiness booleans/counts only.'
            echo '- No public-launch switch is changed by this audit.'
          } >> "$GITHUB_STEP_SUMMARY"
