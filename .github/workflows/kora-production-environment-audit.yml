name: KORA Production Environment Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/kora-production-environment-audit.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: kora-production-environment-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: kora-production
    defaults:
      run:
        working-directory: kora-network
    env:
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VIDEO_PROVIDER: ${{ vars.VIDEO_PROVIDER }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_STREAM_TOKEN: ${{ secrets.CLOUDFLARE_STREAM_TOKEN }}
      CLOUDFLARE_STREAM_CUSTOMER_CODE: ${{ vars.CLOUDFLARE_STREAM_CUSTOMER_CODE }}
      PAYFAST_MERCHANT_ID: ${{ secrets.PAYFAST_MERCHANT_ID }}
      PAYFAST_MERCHANT_KEY: ${{ secrets.PAYFAST_MERCHANT_KEY }}
      PAYFAST_PASSPHRASE: ${{ secrets.PAYFAST_PASSPHRASE }}
      PAYFAST_SANDBOX: ${{ vars.PAYFAST_SANDBOX }}
      KORA_INTERNAL_API_SECRET: ${{ secrets.KORA_INTERNAL_API_SECRET }}
      NEXT_PUBLIC_OPERATOR_NAME: ${{ vars.NEXT_PUBLIC_OPERATOR_NAME }}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
      NEXT_PUBLIC_PRIVACY_EMAIL: ${{ vars.NEXT_PUBLIC_PRIVACY_EMAIL }}
      NEXT_PUBLIC_RIGHTS_EMAIL: ${{ vars.NEXT_PUBLIC_RIGHTS_EMAIL }}
      KORA_LEGAL_APPROVED: ${{ vars.KORA_LEGAL_APPROVED }}
      KORA_REGULATORY_APPROVED: ${{ vars.KORA_REGULATORY_APPROVED }}
      KORA_CHILD_SAFETY_APPROVED: ${{ vars.KORA_CHILD_SAFETY_APPROVED }}
      KORA_PAYOUT_OPERATIONS_APPROVED: ${{ vars.KORA_PAYOUT_OPERATIONS_APPROVED }}
      KORA_BACKUP_OPERATIONS_APPROVED: ${{ vars.KORA_BACKUP_OPERATIONS_APPROVED }}
      KORA_INCIDENT_RESPONSE_APPROVED: ${{ vars.KORA_INCIDENT_RESPONSE_APPROVED }}
      KORA_PREFLIGHT_MODE: private_beta

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kora-network/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Read-only protected-environment preflight
        id: preflight
        shell: bash
        run: |
          set +e
          npm run preflight:production 2>&1 | tee "$RUNNER_TEMP/kora-preflight.log"
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Read-only deployed readiness snapshot
        id: readiness
        shell: bash
        run: |
          if [[ -z "${NEXT_PUBLIC_APP_URL:-}" ]]; then
            echo "NEXT_PUBLIC_APP_URL is not configured; deployed readiness cannot be queried." | tee "$RUNNER_TEMP/kora-readiness.log"
            echo "status=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node - <<'NODE' | tee "$RUNNER_TEMP/kora-readiness.log"
          const base = String(process.env.NEXT_PUBLIC_APP_URL || '').replace(/\/$/, '');
          try {
            const response = await fetch(`${base}/api/readiness`, { cache: 'no-store' });
            const text = await response.text();
            let data = null;
            try { data = JSON.parse(text); } catch {}
            if (!data || typeof data !== 'object') {
              console.log(JSON.stringify({ httpStatus: response.status, readable: false }, null, 2));
            } else {
              const details = data.details && typeof data.details === 'object' ? data.details : {};
              const safe = {
                httpStatus: response.status,
                service: data.service,
                status: data.status,
                productionReady: data.productionReady === true,
                checks: data.checks && typeof data.checks === 'object' ? data.checks : {},
                details: {
                  payfastMode: details.payfastMode,
                  videoProvider: details.videoProvider,
                  schemaVersion: details.schemaVersion,
                  releaseName: details.releaseName,
                  adminCount: details.adminCount,
                  activeChannelCount: details.activeChannelCount,
                  maintenanceMode: details.maintenanceMode,
                  publicSignupsEnabled: details.publicSignupsEnabled,
                  creatorApplicationsEnabled: details.creatorApplicationsEnabled,
                  advertiserCampaignsEnabled: details.advertiserCampaignsEnabled,
                  supabaseProjectRef: details.supabaseProjectRef,
                },
                timestamp: data.timestamp,
              };
              console.log(JSON.stringify(safe, null, 2));
            }
          } catch (error) {
            console.log(JSON.stringify({ requestFailed: true, message: error instanceof Error ? error.message : 'unknown error' }, null, 2));
          }
          NODE
      - name: Audit summary
        shell: bash
        run: |
          {
            echo '# KORA production environment audit'
            echo
            echo 'This workflow is read-only against production systems. It never prints secret values.'
            echo
            if [[ '${{ steps.preflight.outputs.exit_code }}' == '0' ]]; then
              echo '- Protected-environment private-beta preflight: **PASS**'
            else
              echo '- Protected-environment private-beta preflight: **BLOCKED**'
            fi
            echo '- Deployed `/api/readiness`: queried when `NEXT_PUBLIC_APP_URL` is configured; output is reduced to the existing safe readiness fields.'
            echo '- No database, provider account, deployment, or public-launch switch is changed by this audit.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish safe audit result to one GitHub issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_EXIT: ${{ steps.preflight.outputs.exit_code }}
        run: |
          issue_file="$RUNNER_TEMP/kora-audit-issue.md"
          failures="$(grep -E '^(FAIL|WARN)  ' "$RUNNER_TEMP/kora-preflight.log" || true)"
          if [[ -z "$failures" ]]; then failures='No blocking or warning configuration lines.'; fi
          readiness="$(cat "$RUNNER_TEMP/kora-readiness.log" 2>/dev/null || echo '{"readiness":"unavailable"}')"
          {
            echo '# KORA production environment audit'
            echo
            echo '**Production systems are read-only in this audit. No secret values are included below.**'
            echo
            if [[ "$PREFLIGHT_EXIT" == '0' ]]; then
              echo '## Protected environment preflight: PASS'
            else
              echo '## Protected environment preflight: BLOCKED'
            fi
            echo
            echo '### Blocking / warning configuration names'
            echo '```text'
            printf '%s\n' "$failures"
            echo '```'
            echo
            echo '### Safe deployed readiness snapshot'
            echo '```json'
            printf '%s\n' "$readiness"
            echo '```'
            echo
            echo "Audit workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Updated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$issue_file"

          title='KORA production environment audit'
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'KORA production environment audit in:title' --json number,title --jq '.[] | select(.title == "KORA production environment audit") | .number' | head -n 1)"
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$issue_file"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$issue_file"
          fi
