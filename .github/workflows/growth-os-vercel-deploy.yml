name: Growth OS Build + Optional Vercel Fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'izakhono-growth-os/**'
      - '.github/workflows/growth-os-vercel-deploy.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: izakhono-growth-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: izakhono-growth-os/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build independently of deployment credentials
        run: npm run build
      - name: Build status
        run: |
          echo 'GROWTH OS BUILD: VERIFIED'
          echo 'Deployment credentials are not required to build or test the product.'

  vercel-fallback:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: kora-production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_XSHdQaQxmXGD1HlK2E4nehif
      VERCEL_PROJECT_ID: prj_TsPOifYY7wIxPK8gzyJy6nKwjTAb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect optional Vercel credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'External Vercel fallback credentials available.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Vercel fallback skipped because VERCEL_TOKEN is not configured. The Growth OS build remains verified and IZAKHONO-owned deployment remains primary.'
          fi

      - name: Link production project
        if: steps.credentials.outputs.ready == 'true'
        working-directory: izakhono-growth-os
        run: |
          mkdir -p .vercel
          node -e "require('fs').writeFileSync('.vercel/project.json', JSON.stringify({orgId:process.env.VERCEL_ORG_ID,projectId:process.env.VERCEL_PROJECT_ID,projectName:'izakhono-growth-os'}))"

      - name: Pull production settings
        if: steps.credentials.outputs.ready == 'true'
        working-directory: izakhono-growth-os
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel fallback artifact
        if: steps.credentials.outputs.ready == 'true'
        working-directory: izakhono-growth-os
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production fallback artifact
        if: steps.credentials.outputs.ready == 'true'
        id: deploy
        working-directory: izakhono-growth-os
        run: |
          set -euo pipefail
          URL="$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n 1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Growth OS fallback URL: $URL"

      - name: Verify public SEO routes
        if: steps.credentials.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl -fsS "$URL/" | grep -q "IZAKHONO GROWTH OS"
          curl -fsS "$URL/robots.txt" | grep -q "sitemap.xml"
          curl -fsS "$URL/sitemap.xml" | grep -q "<urlset"
          test "$(curl -fsS "$URL/dc98e762923b831ef7edbc2ff9cdd39a.txt" | tr -d '\r\n')" = "dc98e762923b831ef7edbc2ff9cdd39a"
          echo "Growth OS fallback SEO routes verified."
