name: KORA Bootstrap First Admin

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: Existing Supabase Auth email to promote as the first KORA admin
        required: true
        type: string
      confirmation:
        description: Type exactly BOOTSTRAP_FIRST_ADMIN
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: kora-production
    defaults:
      run:
        working-directory: kora-network
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KORA_BOOTSTRAP_CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kora-network/package.json
      - run: npm install --no-audit --no-fund
      - name: Bootstrap the first administrator only
        run: npm run bootstrap:admin -- "${{ inputs.admin_email }}"
