name: DOXA-SURE Bootstrap CI

on:
  push:
    paths:
      - 'doxa-sure/**'
      - '.github/workflows/doxa-sure-ci.yml'
  pull_request:
    paths:
      - 'doxa-sure/**'
      - '.github/workflows/doxa-sure-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check doxa-sure/app.js
          node --check doxa-sure/risk-check.js
          node --check doxa-sure/lead-capture.js
          node --check doxa-sure/leads-dashboard.js
      - name: Bootstrap safety gates
        shell: bash
        run: |
          set -euo pipefail
          test -f doxa-sure/index.html
          test -f doxa-sure/styles.css
          test -f doxa-sure/config.js
          test -f doxa-sure/risk-check.html
          test -f doxa-sure/risk-check.js
          test -f doxa-sure/first-customers.html
          test -f doxa-sure/pilot.html
          test -f doxa-sure/RESCUE_PACK_SOP.md
          test -f doxa-sure/FIRST_100_PLAYBOOK.md
          test -f doxa-sure/supabase/migrations/001_doxa_bootstrap_mvp.sql
          test -f doxa-sure/supabase/migrations/002_doxa_secure_leads.sql
          test -f doxa-sure/leads-dashboard.html
          grep -q "SAVE MY ASSET" doxa-sure/index.html
          grep -q "Free Asset Risk Check" doxa-sure/risk-check.html
          grep -q "R199" doxa-sure/first-customers.html
          grep -q "R99" doxa-sure/first-customers.html
          grep -q "R199" doxa-sure/pilot.html
          grep -q "R99/month" doxa-sure/pilot.html
          grep -q "doxa_ensure_member" doxa-sure/app.js
          grep -q "doxa_on_auth_user_created" doxa-sure/supabase/migrations/001_doxa_bootstrap_mvp.sql
          grep -q "doxa-vault-docs" doxa-sure/supabase/migrations/001_doxa_bootstrap_mvp.sql
          grep -q "doxa_submit_pilot_lead" doxa-sure/supabase/migrations/002_doxa_secure_leads.sql
          grep -q "doxa_leads_admin_select" doxa-sure/supabase/migrations/002_doxa_secure_leads.sql
          ! grep -Eq "for select to (anon|public)" doxa-sure/supabase/migrations/002_doxa_secure_leads.sql
          ! grep -Eq "service[_-]?role|SUPABASE_SERVICE_ROLE_KEY" doxa-sure/config.js
          ! grep -Eq "id_number|account_number|bank_password|pin_number" doxa-sure/index.html doxa-sure/app.js doxa-sure/risk-check.html doxa-sure/risk-check.js doxa-sure/pilot.html
      - name: Revenue-funnel compliance language
        shell: bash
        run: |
          set -euo pipefail
          grep -qi "not legal advice" doxa-sure/risk-check.html
          grep -qi "not an insurance policy" doxa-sure/first-customers.html
          grep -qi "not an insurance policy" doxa-sure/pilot.html
          grep -qi "not.*guarantee" doxa-sure/RESCUE_PACK_SOP.md
          ! grep -Eqi "we stop banks|guaranteed to save|guarantee.*save your|banks cannot repossess" doxa-sure/risk-check.html doxa-sure/first-customers.html doxa-sure/pilot.html
      - name: Verify shared-database isolation
        shell: bash
        run: |
          set -euo pipefail
          sql=doxa-sure/supabase/migrations/001_doxa_bootstrap_mvp.sql
          ! grep -Eq 'drop table.*(profiles|memberships|assets|documents|rescue_cases)' "$sql"
          ! grep -Eq 'drop trigger if exists on_auth_user_created' "$sql"
          grep -q 'public.doxa_profiles' "$sql"
          grep -q 'public.doxa_rescue_cases' "$sql"
