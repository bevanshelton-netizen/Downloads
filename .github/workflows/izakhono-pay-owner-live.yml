name: IZAKHONO PAY Owner-Host Go Live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'izakhono-pay/deploy/GO_LIVE'
      - 'izakhono-pay/runtime.mjs'
      - 'izakhono-owned-cloud/go-live-izakhono-pay.sh'
      - '.github/workflows/izakhono-pay-owner-live.yml'

permissions:
  contents: read

concurrency:
  group: izakhono-pay-owner-live
  cancel-in-progress: false

jobs:
  go-live:
    runs-on: [self-hosted, linux, x64, izakhono]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Activate FORTRESS-protected IZAKHONO PAY
        env:
          IZAKHONO_PAY_ENV_FILE: ${{ vars.IZAKHONO_PAY_ENV_FILE }}
        run: sudo -E bash izakhono-owned-cloud/go-live-izakhono-pay.sh
