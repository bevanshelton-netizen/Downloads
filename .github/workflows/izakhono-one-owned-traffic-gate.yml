name: IZAKHONO ONE Owned Traffic Distribution Gate

on:
  pull_request:
    paths:
      - ".github/workflows/izakhono-one-owned-traffic-gate.yml"
  workflow_dispatch:

jobs:
  verify-owned-surfaces:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        surface:
          - webstart-app
          - worknow-south-africa
          - allegro-vibez-live
          - legacymart-makers
          - bevan-shelton-shop
          - connecta-external
          - allegro-studios
    steps:
      - name: Verify public surface and ONE Founding CTA
        env:
          SURFACE: ${{ matrix.surface }}
        run: |
          URL="https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/$SURFACE"
          HTTP="$(curl -sS -L -o /tmp/page.html -w '%{http_code}' --max-time 20 "$URL")"
          echo "$SURFACE -> HTTP $HTTP"
          test "$HTTP" = "200"
          grep -q "izakhono-one-founding-promo" /tmp/page.html
          grep -q "Founding 1,000" /tmp/page.html
          grep -q "https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-public" /tmp/page.html
          ! grep -q "izakhono-one-public?campaign=" /tmp/page.html
          ! grep -q "izakhono-one-public?ref=" /tmp/page.html

  verify-growth-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Verify ONE public bridge remains reachable
        run: |
          PAGE="$(curl -fsSL --max-time 20 https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-public)"
          echo "$PAGE" | grep -q "IZAKHONO ONE"
          echo "$PAGE" | grep -q "Founding 1,000"
          STATUS="$(curl -fsSL --max-time 20 https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-interest)"
          echo "$STATUS"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.program!=="Founding 1,000"||x.tracking!==false||x.referralAttribution!==false||x.campaignAttribution!==false) process.exit(2)' "$STATUS"
          echo "$PAGE" | grep -q "No personal referral ID or campaign-attribution code is created"
          echo "$PAGE" | grep -q "No attribution machinery hiding behind the invitation"
