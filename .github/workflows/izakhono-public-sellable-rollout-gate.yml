name: IZAKHONO Public Sellable Rollout Gate

on:
  pull_request:
    paths:
      - "izakhono-one-ai/**"
      - "izakhono-auth-node/**"
      - "izakhono-notify-node/**"
      - "izakhono-ai-gateway-node/**"
      - "izakhono-gpu-compute-node/**"
      - "izakhono-model-worker-node/**"
      - "izakhono-mail-relay-adapter/**"
      - "IZAKHONO-SELLABLE-PUBLIC-PRODUCT-GATE.md"
      - "IZAKHONO-LOW-COST-GUARANTEE.md"
      - "IZAKHONO-ONE-CEO-GROWTH-STRATEGY.md"
      - "IZAKHONO-ONE-DEPLOYMENT-READINESS.md"
      - "IZAKHONO-STUDIO/IZAKHONO-ONE-LAUNCH-BRIEF.md"
      - "IZAKHONO-STUDIO/src/portfolio.js"
      - "izakhono-growth-os/**"
      - "owner-host/platforms.json"
      - "izakhono-owned-cloud/deploy-izakhono-one-ai.sh"
      - ".github/workflows/izakhono-public-sellable-rollout-gate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON and rollout invariants
        run: |
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('izakhono-one-ai/public-sellable-rollout.json','utf8'));
          const ids=new Set(), targets=new Set();
          const validPublic=new Set(r.statuses.public);
          const validCommercial=new Set(r.statuses.commercial);
          for(const p of r.products){
            if(!p.id||ids.has(p.id)) throw new Error('duplicate/missing product id: '+p.id);
            ids.add(p.id);
            if(!validPublic.has(p.public_status)) throw new Error('bad public status '+p.id);
            if(!validCommercial.has(p.commercial_status)) throw new Error('bad commercial status '+p.id);
            if(p.owned_target){
              const u=new URL(p.owned_target);
              if(u.protocol!=='https:') throw new Error('owned target must be https: '+p.id);
              if(targets.has(u.hostname)) throw new Error('duplicate owned hostname: '+u.hostname);
              targets.add(u.hostname);
            }
            if(p.fallback){
              const u=new URL(p.fallback);
              if(u.protocol!=='https:') throw new Error('fallback must be https: '+p.id);
            }
            if(['sellable','verified-live'].includes(p.commercial_status)){
              if(!p.owned_target && !p.fallback) throw new Error('sellable product lacks public address: '+p.id);
              if(['not-routed','target-defined'].includes(p.public_status)) throw new Error('sellable product lacks verified/temporary public route: '+p.id);
              if(/required|gated|not-cleared|not-required-for-technical-pilot/i.test(p.payment||'')) throw new Error('sellable product has unresolved payment gate: '+p.id);
            }
          }
          console.log('Public/sellable rollout registry valid:',r.products.length,'products');

          const growth=JSON.parse(fs.readFileSync('izakhono-one-ai/growth-strategy.json','utf8'));
          const benchmark=JSON.parse(fs.readFileSync('izakhono-one-ai/competitor-benchmark.json','utf8'));
          const campaign=JSON.parse(fs.readFileSync('izakhono-one-ai/launch-campaign.json','utf8'));
          if(growth.guardrails?.some(x=>/behavioural tracking/i.test(x))!==true) throw new Error('growth privacy guardrail missing');
          if(!growth.growth_loops?.some(x=>x.id==='referral')) throw new Error('referral growth loop missing');
          if(campaign.objective!=='activated_accounts') throw new Error('launch campaign objective must be activated accounts');
          const incumbentEntry=Math.min(...benchmark.sources.flatMap(s=>s.plans.map(p=>Number(p.usd_per_user_month))).filter(Number.isFinite));
          const target=Number(benchmark.izakhono_targets.business_entry_usd_user_month);
          if(!(target>0 && target<incumbentEntry)) throw new Error('business-entry target must undercut benchmark entry pricing');
          if(target>=5) throw new Error('business-entry target must remain below US$5 until strategy changes explicitly');
          console.log('Growth strategy valid: business entry target',target,'< incumbent entry',incumbentEntry);

          const deployment=JSON.parse(fs.readFileSync('izakhono-one-ai/deployment-plan.json','utf8'));
          if(deployment.target_hostname!=='one.domains.izakhonoafrica.co.za') throw new Error('ONE deployment hostname drifted');
          if(deployment.rules?.no_live_claim_before_independent_https_verification!==true) throw new Error('public verification rule missing');
          if(deployment.rules?.no_public_signup_without_verified_recovery_delivery!==true) throw new Error('signup/recovery gate missing');
          if(deployment.rules?.no_commercial_claim_before_payment_and_legal_gate!==true) throw new Error('commercial gate missing');
          const one=r.products.find(p=>p.id==='izakhono-one-ai');
          if(!one) throw new Error('ONE rollout entry missing');
          if(/account\/entitlement layer/i.test(one.next_blocker||'')) throw new Error('stale ONE blocker still references built account layer');
          if(!/SMTP/i.test(one.next_blocker||'')||!/public HTTPS/i.test(one.next_blocker||'')) throw new Error('ONE rollout blockers do not match deployment plan');
          console.log('Deployment plan valid:',deployment.release_states.join(' -> '));
          NODE
      - name: Validate ONE AI owned deployment
        run: |
          bash -n izakhono-owned-cloud/deploy-izakhono-one-ai.sh
          bash -n izakhono-owned-cloud/configure-izakhono-one-ai.sh
          bash -n izakhono-owned-cloud/preflight-izakhono-one.sh
          bash -n izakhono-gpu-compute-node/install-linux.sh
          bash -n izakhono-model-worker-node/install-linux.sh
          bash -n izakhono-mail-relay-adapter/install-linux.sh
          node --check izakhono-model-worker-node/server.mjs
          node --check izakhono-mail-relay-adapter/server.mjs
          node --check izakhono-one-ai/server.mjs
          node --check izakhono-auth-node/server.mjs
          node --check izakhono-notify-node/server.mjs
          node --check izakhono-ai-gateway-node/server.mjs
          node --check izakhono-gpu-compute-node/server.mjs
          node -e 'const x=JSON.parse(require("fs").readFileSync("owner-host/platforms.json","utf8")); const p=x.platforms.find(p=>p.id==="izakhono-one-ai"); if(!p||p.defaultHostname!=="one.domains.izakhonoafrica.co.za") process.exit(2)'
      - name: ONE AI launchpad self-test
        run: |
          cd izakhono-one-ai
          npm run check
