name: IZAKHONO ONE Public Resilience Verify

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  pull_request:
    paths:
      - 'izakhono-one/**'
      - 'one/**'
      - 'robots.txt'
      - 'ports/izakhono-one/**'
      - 'izakhono-one-ai/public-sellable-rollout.json'
      - 'IZAKHONO-ONE-EXTERNAL-BRIDGE.md'
      - '.github/workflows/izakhono-one-public-resilience-verify.yml'
  push:
    branches: [main]
    paths:
      - 'izakhono-one/**'
      - 'one/**'
      - 'robots.txt'
      - 'ports/izakhono-one/**'
      - 'izakhono-one-ai/public-sellable-rollout.json'
      - 'IZAKHONO-ONE-EXTERNAL-BRIDGE.md'
      - '.github/workflows/izakhono-one-public-resilience-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify static ONE entry contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'IZAKHONO ONE' one/index.html
          grep -qi 'no application analytics' one/index.html
          grep -q 'manifest.webmanifest' one/index.html
          grep -q 'serviceWorker' one/index.html
          grep -q 'application/ld+json' one/index.html
          grep -q 'izakhono-one-control' one/index.html
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('one/manifest.webmanifest','utf8')); if(m.name!=='IZAKHONO ONE'||m.display!=='standalone'||m.start_url!=='/Downloads/one/'||m.scope!=='/Downloads/one/'||!Array.isArray(m.icons)||!m.icons.length) process.exit(1)"
          grep -q "izakhono-one-shell-v1" one/sw.js
          grep -q "/Downloads/one/" one/sw.js
          ! grep -Eqi 'supabase|localStorage|sessionStorage|access[_-]?token|owner[_-]?token|workspace[_-]?key' one/sw.js
          grep -q 'No workspace credentials are cached' one/offline.html
          grep -q '<svg' one/icon.svg
          grep -q 'https://bevanshelton-netizen.github.io/Downloads/one/' one/sitemap.xml
          grep -q 'Sitemap: https://bevanshelton-netizen.github.io/Downloads/one/sitemap.xml' robots.txt
          ! grep -Eqi 'utm_|googletagmanager|google-analytics|facebook[^<]*(pixel|track)|hotjar|clarity\.ms|mixpanel|amplitude|plausible|matomo|portfolio-growth/bridge\.js' one/index.html
      - name: Verify HTTPS, ONE experience and zero-tracking contract
        shell: bash
        run: |
          set -euo pipefail
          CANON="https://bevanshelton-netizen.github.io/Downloads/izakhono-one/"
          SHORT="https://bevanshelton-netizen.github.io/Downloads/one/"
          PORT="https://bevanshelton-netizen.github.io/Downloads/ports/izakhono-one/"
          HEALTH="${PORT}health-check/"
          HUB="https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-hub"
          HUB_HEALTH="${HUB}?health=1"
          ok=0
          for i in $(seq 1 12); do
            rm -f /tmp/one-canon.html /tmp/one-short.html /tmp/one-port.html /tmp/one-health.html /tmp/one-canon.h /tmp/one-short.h /tmp/one-port.h
            canon_code="$(curl -sSL --max-time 12 -D /tmp/one-canon.h -o /tmp/one-canon.html -w '%{http_code}' "$CANON" || true)"
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              short_code="200"
              cp /tmp/one-canon.html /tmp/one-short.html
              cp /tmp/one-canon.h /tmp/one-short.h
            else
              short_code="$(curl -sSL --max-time 12 -D /tmp/one-short.h -o /tmp/one-short.html -w '%{http_code}' "$SHORT" || true)"
            fi
            port_code="$(curl -sSL --max-time 12 -D /tmp/one-port.h -o /tmp/one-port.html -w '%{http_code}' "$PORT" || true)"
            health_code="$(curl -sSL --max-time 12 -o /tmp/one-health.html -w '%{http_code}' "$HEALTH" || true)"
            if [ "$canon_code" = "200" ] &&
               [ "$short_code" = "200" ] &&
               [ "$port_code" = "200" ] &&
               [ "$health_code" = "200" ] &&
               grep -q 'IZAKHONO ONE' /tmp/one-canon.html &&
               grep -q 'IZAKHONO ONE' /tmp/one-short.html &&
               grep -q 'IZAKHONO ONE' /tmp/one-port.html &&
               grep -q 'FREE 3-MINUTE BUSINESS HEALTH CHECK' /tmp/one-health.html &&
               grep -qi '^content-type: text/html' /tmp/one-canon.h &&
               grep -qi '^content-type: text/html' /tmp/one-short.h &&
               grep -qi '^content-type: text/html' /tmp/one-port.h; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" -eq 1
          ! grep -Eqi 'utm_|googletagmanager|google-analytics|facebook[^<]*(pixel|track)|hotjar|clarity\.ms|mixpanel|amplitude|plausible|matomo|portfolio-growth/bridge\.js' /tmp/one-port.html
          ! grep -Eqi 'utm_|googletagmanager|google-analytics|facebook[^<]*(pixel|track)|hotjar|clarity\.ms|mixpanel|amplitude|plausible|matomo|portfolio-growth/bridge\.js' /tmp/one-short.html
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            MANIFEST_URL="${SHORT}manifest.webmanifest"
            SW_URL="${SHORT}sw.js"
            OFFLINE_URL="${SHORT}offline.html"
            manifest_code="$(curl -sSL --max-time 12 -D /tmp/one-manifest.h -o /tmp/one-manifest.json -w '%{http_code}' "$MANIFEST_URL" || true)"
            sw_code="$(curl -sSL --max-time 12 -D /tmp/one-sw.h -o /tmp/one-sw.js -w '%{http_code}' "$SW_URL" || true)"
            offline_code="$(curl -sSL --max-time 12 -D /tmp/one-offline.h -o /tmp/one-offline.html -w '%{http_code}' "$OFFLINE_URL" || true)"
            test "$manifest_code" = "200"
            test "$sw_code" = "200"
            test "$offline_code" = "200"
            node - <<'NODE'
            const fs=require('fs');
            const m=JSON.parse(fs.readFileSync('/tmp/one-manifest.json','utf8'));
            if(m.name!=='IZAKHONO ONE'||m.display!=='standalone'||m.start_url!=='/Downloads/one/'||m.scope!=='/Downloads/one/') process.exit(1);
            const sw=fs.readFileSync('/tmp/one-sw.js','utf8');
            if(!sw.includes("izakhono-one-shell-v1")||!sw.includes("/Downloads/one/")) process.exit(2);
            if(/supabase|localStorage|sessionStorage|access[_-]?token|owner[_-]?token|workspace[_-]?key/i.test(sw)) process.exit(3);
            const offline=fs.readFileSync('/tmp/one-offline.html','utf8');
            if(!offline.includes('No workspace credentials are cached')) process.exit(4);
            NODE
          fi
          echo "IZAKHONO ONE external static resilience route + PWA assets VERIFIED"

      - name: Verify Supabase external ONE bridge
        shell: bash
        run: |
          set -euo pipefail
          HUB="https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-hub"
          HUB_HEALTH="${HUB}?health=1"
          DEVICE="https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-device-ai"
          DEVICE_HEALTH="${DEVICE}?health=1"
          CONTROL="https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-control"
          CONTROL_HEALTH="${CONTROL}?health=1"
          hub_code="$(curl -sSL --max-time 20 -D /tmp/one-hub.h -o /tmp/one-hub.html -w '%{http_code}' "$HUB" || true)"
          health_code="$(curl -sSL --max-time 20 -o /tmp/one-hub-health.json -w '%{http_code}' "$HUB_HEALTH" || true)"
          device_code="$(curl -sSL --max-time 20 -D /tmp/one-device.h -o /tmp/one-device.html -w '%{http_code}' "$DEVICE" || true)"
          device_health_code="$(curl -sSL --max-time 20 -o /tmp/one-device-health.json -w '%{http_code}' "$DEVICE_HEALTH" || true)"
          control_code="$(curl -sSL --max-time 20 -D /tmp/one-control.h -o /tmp/one-control.html -w '%{http_code}' "$CONTROL" || true)"
          control_health_code="$(curl -sSL --max-time 20 -o /tmp/one-control-health.json -w '%{http_code}' "$CONTROL_HEALTH" || true)"
          echo "hub_code=$hub_code health_code=$health_code device_code=$device_code device_health_code=$device_health_code control_code=$control_code control_health_code=$control_health_code"
          test "$hub_code" = "200"
          test "$health_code" = "200"
          test "$device_code" = "200"
          test "$device_health_code" = "200"
          test "$control_code" = "200"
          test "$control_health_code" = "200"
          echo "health_json=$(cat /tmp/one-hub-health.json)"
          echo "device_health_json=$(cat /tmp/one-device-health.json)"
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('/tmp/one-hub.html','utf8');
          if(!/^<!doctype html>/i.test(html)) process.exit(10);
          if(!html.includes('IZAKHONO ONE')) process.exit(11);
          if(!html.includes('External hosting gets us online')) process.exit(12);
          const forbidden=/utm_|googletagmanager|google-analytics|facebook[^<]*(pixel|track)|hotjar|clarity\.ms|mixpanel|amplitude|plausible|matomo|portfolio-growth\/bridge\.js/i;
          if(forbidden.test(html)) process.exit(13);
          const x=JSON.parse(fs.readFileSync('/tmp/one-hub-health.json','utf8'));
          if(x.ok!==true||x.product!=='IZAKHONO ONE'||x.route!=='external-resilience') process.exit(2);
          if(x.public_hub!==true||x.one_ai_chat!==false||x.device_ai_beta!==true) process.exit(3);
          if(x.device_ai_url!=='https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-device-ai') process.exit(31);
          if(x.control_center!==true||x.control_center_url!=='https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-control') process.exit(32);
          if(x.tracking!==false||x.behavioural_profiling!==false||x.advertising_ids!==false||x.referral_attribution!==false) process.exit(4);
          if(x.owned_authority!=='NODE 01') process.exit(5);
          const deviceHtml=fs.readFileSync('/tmp/one-device.html','utf8');
          if(!/^<!doctype html>/i.test(deviceHtml)||!deviceHtml.includes('IZAKHONO ONE')||!deviceHtml.includes('Device AI')) process.exit(6);
          if(forbidden.test(deviceHtml)) process.exit(7);
          const d=JSON.parse(fs.readFileSync('/tmp/one-device-health.json','utf8'));
          if(d.ok!==true||d.product!=='IZAKHONO ONE Device AI'||d.route!=='external-device-ai') process.exit(8);
          if(d.model_runtime!=='webllm'||d.prompt_transport!=='device-local'||d.server_prompt_persistence!==false) process.exit(9);
          if(d.tracking!==false||d.behavioural_profiling!==false||d.advertising_ids!==false||d.owned_authority!=='NODE 01'||d.beta!==true) process.exit(10);
          const controlHtml=fs.readFileSync('/tmp/one-control.html','utf8');
          if(!/^<!doctype html>/i.test(controlHtml)||!controlHtml.includes('IZAKHONO ONE')||!controlHtml.includes('CONTROL')) process.exit(11);
          if(!controlHtml.includes('Download recovery key')||!controlHtml.includes('Reveal key')||!controlHtml.includes('Lock this device')) process.exit(12);
          if(forbidden.test(controlHtml)) process.exit(13);
          const c=JSON.parse(fs.readFileSync('/tmp/one-control-health.json','utf8'));
          if(c.ok!==true||c.product!=='IZAKHONO ONE Control Center'||c.route!=='external-resilience') process.exit(14);
          if(c.workspace_access!=='capability-key'||c.tracking!==false||c.behavioural_profiling!==false||c.advertising_ids!==false||c.referral_attribution!==false||c.owned_authority!=='NODE 01') process.exit(15);
          NODE
          echo "IZAKHONO ONE Supabase external bridge + Device AI + Control Center VERIFIED"
