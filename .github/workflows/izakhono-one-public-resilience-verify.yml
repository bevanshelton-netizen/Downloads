# verify Supabase ONE surfaces after R0 terminology alignment
# R0 strict resilience verifier v2
name: IZAKHONO ONE Public Resilience Verify

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  pull_request:
    paths:
      - 'izakhono-one/**'
      - 'one/**'
      - 'robots.txt'
      - 'ports/izakhono-one/**'
      - 'izakhono-one-ai/public-sellable-rollout.json'
      - 'IZAKHONO-ONE-EXTERNAL-BRIDGE.md'
      - '.github/workflows/izakhono-one-public-resilience-verify.yml'
  push:
    branches: [main]
    paths:
      - 'izakhono-one/**'
      - 'one/**'
      - 'robots.txt'
      - 'ports/izakhono-one/**'
      - 'izakhono-one-ai/public-sellable-rollout.json'
      - 'IZAKHONO-ONE-EXTERNAL-BRIDGE.md'
      - '.github/workflows/izakhono-one-public-resilience-verify.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify local ONE privacy and PWA contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'IZAKHONO ONE' one/index.html
          grep -qi 'no application analytics' one/index.html
          grep -q 'manifest.webmanifest' one/index.html
          grep -q 'serviceWorker' one/index.html
          grep -q 'application/ld+json' one/index.html
          grep -q 'izakhono-one-control' one/index.html
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('one/manifest.webmanifest','utf8')); if(m.name!=='IZAKHONO ONE'||m.display!=='standalone'||m.start_url!=='/Downloads/one/'||m.scope!=='/Downloads/one/'||!Array.isArray(m.icons)||!m.icons.length) process.exit(1)"
          grep -q "izakhono-one-shell-v1" one/sw.js
          grep -q "/Downloads/one/" one/sw.js
          ! grep -Eqi 'supabase|localStorage|sessionStorage|access[_-]?token|owner[_-]?token|workspace[_-]?key' one/sw.js
          grep -q 'No workspace credentials are cached' one/offline.html
          grep -q '<svg' one/icon.svg
          ! grep -Eqi 'utm_|googletagmanager|google-analytics|facebook[^<]*(pixel|track)|hotjar|clarity\.ms|mixpanel|amplitude|plausible|matomo|portfolio-growth/bridge\.js' one/index.html

  verify-external-resilience:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Independently verify Supabase resilience endpoints over HTTPS
        id: resilience
        shell: bash
        run: |
          set -euo pipefail
          HUB='https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-hub'
          HUB_HEALTH="${HUB}?health=1"
          DEVICE='https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-device-ai'
          DEVICE_HEALTH="${DEVICE}?health=1"
          CONTROL='https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-control'
          CONTROL_HEALTH="${CONTROL}?health=1"
          PUBLIC='https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-public'
          PUBLIC_HEALTH="${PUBLIC}?health=1"
          INTEREST='https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-interest'

          hub_code="$(curl -sSL --max-time 20 -D /tmp/one-hub.h -o /tmp/one-hub.html -w '%{http_code}' "$HUB" || true)"
          hub_health_code="$(curl -sSL --max-time 20 -o /tmp/one-hub-health.json -w '%{http_code}' "$HUB_HEALTH" || true)"
          device_code="$(curl -sSL --max-time 20 -D /tmp/one-device.h -o /tmp/one-device.html -w '%{http_code}' "$DEVICE" || true)"
          device_health_code="$(curl -sSL --max-time 20 -o /tmp/one-device-health.json -w '%{http_code}' "$DEVICE_HEALTH" || true)"
          control_code="$(curl -sSL --max-time 20 -D /tmp/one-control.h -o /tmp/one-control.html -w '%{http_code}' "$CONTROL" || true)"
          control_health_code="$(curl -sSL --max-time 20 -o /tmp/one-control-health.json -w '%{http_code}' "$CONTROL_HEALTH" || true)"
          public_code="$(curl -sSL --max-time 20 -D /tmp/one-public.h -o /tmp/one-public.html -w '%{http_code}' "$PUBLIC" || true)"
          public_health_code="$(curl -sSL --max-time 20 -o /tmp/one-public-health.json -w '%{http_code}' "$PUBLIC_HEALTH" || true)"
          interest_code="$(curl -sSL --max-time 20 -o /tmp/one-interest.json -w '%{http_code}' "$INTEREST" || true)"

          echo "hub=$hub_code hub_health=$hub_health_code device=$device_code device_health=$device_health_code control=$control_code control_health=$control_health_code public=$public_code public_health=$public_health_code interest=$interest_code"

          test "$hub_code" = '200'
          test "$hub_health_code" = '200'
          test "$device_code" = '200'
          test "$device_health_code" = '200'
          test "$control_code" = '200'
          test "$control_health_code" = '200'
          test "$public_code" = '200'
          test "$public_health_code" = '200'
          test "$interest_code" = '200'

          node - <<'NODE'
          const fs=require('fs');
          const forbidden=/utm_|googletagmanager|google-analytics|facebook[^<]*(pixel|track)|hotjar|clarity\.ms|mixpanel|amplitude|plausible|matomo|portfolio-growth\/bridge\.js/i;

          const hub=fs.readFileSync('/tmp/one-hub.html','utf8');
          if(!/^<!doctype html>/i.test(hub)||!hub.includes('IZAKHONO ONE')||!hub.includes('R0 public access gets us online')) process.exit(10);
          if(forbidden.test(hub)) process.exit(11);
          const h=JSON.parse(fs.readFileSync('/tmp/one-hub-health.json','utf8'));
          if(h.ok!==true||h.product!=='IZAKHONO ONE'||h.route!=='external-resilience'||h.public_hub!==true) process.exit(12);
          if(h.tracking!==false||h.behavioural_profiling!==false||h.advertising_ids!==false||h.referral_attribution!==false) process.exit(13);
          if(h.one_ai_chat!==true||h.one_ai_route!=='external-device-ai'||h.owned_server_ai!==false) process.exit(14);
          if(h.owned_authority!=='NODE 01') process.exit(15);
          if(h.owned_authority_role!=='NODE01'||h.owned_execution_class!=='IZAKHONO_SOVEREIGN_NODE') process.exit(16);
          if(h.zero_budget_mode!==true||h.custom_domain_required!==false) process.exit(17);
          if(h.live_claim!=='EXTERNAL_RESILIENCE_VERIFIED_R0') process.exit(18);

          const device=fs.readFileSync('/tmp/one-device.html','utf8');
          if(!/^<!doctype html>/i.test(device)||!device.includes('IZAKHONO ONE')||!device.includes('ONE AI is usable now.')) process.exit(20);
          if(!device.includes('@mlc-ai/web-llm@0.2.85')||!device.includes('SmolLM2-1.7B-Instruct-q4f16_1-MLC')||!device.includes('Llama-3.2-3B-Instruct-q4f16_1-MLC')) process.exit(21);
          if(forbidden.test(device)) process.exit(22);
          const d=JSON.parse(fs.readFileSync('/tmp/one-device-health.json','utf8'));
          if(d.ok!==true||d.product!=='IZAKHONO ONE AI'||d.route!=='external-device-ai'||d.runtime!=='webllm@0.2.85') process.exit(23);
          if(!Array.isArray(d.model_tiers)||d.model_tiers.length!==3) process.exit(24);
          if(d.prompt_transport!=='device-local'||d.server_prompt_persistence!==false||d.tracking!==false||d.referral_attribution!==false||d.owned_server_ai!==false||d.owned_authority!=='NODE 01') process.exit(25);

          const control=fs.readFileSync('/tmp/one-control.html','utf8');
          if(!/^<!doctype html>/i.test(control)||!control.includes('IZAKHONO ONE')||!control.includes('CONTROL')) process.exit(30);
          if(forbidden.test(control)) process.exit(31);
          const c=JSON.parse(fs.readFileSync('/tmp/one-control-health.json','utf8'));
          if(c.ok!==true||c.product!=='IZAKHONO ONE Control Center'||c.route!=='external-resilience') process.exit(32);
          if(c.tracking!==false||c.behavioural_profiling!==false||c.advertising_ids!==false||c.referral_attribution!==false||c.owned_authority!=='NODE 01') process.exit(33);

          const pub=fs.readFileSync('/tmp/one-public.html','utf8');
          if(!/^<!doctype html>/i.test(pub)||!pub.includes('IZAKHONO ONE')||!pub.includes('Founding 1,000')||!pub.includes('No personal referral ID or campaign-attribution code is created.')) process.exit(40);
          if(forbidden.test(pub)||/\?ref=|campaign=|referralCode|personalInvite/i.test(pub)) process.exit(41);
          const ph=JSON.parse(fs.readFileSync('/tmp/one-public-health.json','utf8'));
          if(ph.ok!==true||ph.tracking!==false||ph.referralAttribution!==false||ph.campaignAttribution!==false||ph.ownedAuthority!=='NODE 01') process.exit(42);
          const interest=JSON.parse(fs.readFileSync('/tmp/one-interest.json','utf8'));
          if(interest.tracking!==false||interest.referralAttribution!==false||interest.campaignAttribution!==false) process.exit(43);
          NODE

          echo 'IZAKHONO ONE EXTERNAL RESILIENCE ROUTE: VERIFIED LIVE'
          echo 'HTTPS=200'
          echo 'TRACKING=false'
          echo 'OWNED_AUTHORITY=NODE 01'

      - name: Report resilience status without blocking product builds
        if: failure()
        shell: bash
        run: |
          echo '::warning::The external ONE resilience route did not pass the strict independent verification in this run. Local build/contract work remains unblocked; do not claim EXTERNAL LIVE VERIFIED from this run.'
          {
            echo '### IZAKHONO ONE external resilience'
            echo ''
            echo '**STRICT VERIFICATION DID NOT PASS IN THIS RUN**'
            echo ''
            echo 'This availability monitor is non-blocking for builds. The last independently verified route may remain in service only if separately current and healthy.'
          } >> "$GITHUB_STEP_SUMMARY"

  monitor-github-pages-mirror:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Monitor optional GitHub Pages mirror without masking the verified resilience route
        shell: bash
        run: |
          set -euo pipefail
          CANON='https://bevanshelton-netizen.github.io/Downloads/izakhono-one/'
          SHORT='https://bevanshelton-netizen.github.io/Downloads/one/'
          PORT='https://bevanshelton-netizen.github.io/Downloads/ports/izakhono-one/'
          HEALTH="${PORT}health-check/"

          canon_code="$(curl -sSL --max-time 12 -D /tmp/one-canon.h -o /tmp/one-canon.html -w '%{http_code}' "$CANON" || true)"
          short_code="$(curl -sSL --max-time 12 -D /tmp/one-short.h -o /tmp/one-short.html -w '%{http_code}' "$SHORT" || true)"
          port_code="$(curl -sSL --max-time 12 -D /tmp/one-port.h -o /tmp/one-port.html -w '%{http_code}' "$PORT" || true)"
          health_code="$(curl -sSL --max-time 12 -o /tmp/one-health.html -w '%{http_code}' "$HEALTH" || true)"

          echo "canon=$canon_code short=$short_code port=$port_code health=$health_code"

          if [ "$canon_code" != '200' ] || [ "$short_code" != '200' ] || [ "$port_code" != '200' ] || [ "$health_code" != '200' ]; then
            echo "::warning::GitHub Pages mirror is not fully reachable. External Supabase resilience verification remains authoritative for this adapter."
            exit 0
          fi

          grep -q 'IZAKHONO ONE' /tmp/one-canon.html
          grep -q 'IZAKHONO ONE' /tmp/one-short.html
          grep -q 'IZAKHONO ONE' /tmp/one-port.html
          grep -q 'FREE 3-MINUTE BUSINESS HEALTH CHECK' /tmp/one-health.html
          ! grep -Eqi 'utm_|googletagmanager|google-analytics|facebook[^<]*(pixel|track)|hotjar|clarity\.ms|mixpanel|amplitude|plausible|matomo|portfolio-growth/bridge\.js' /tmp/one-port.html
          ! grep -Eqi 'utm_|googletagmanager|google-analytics|facebook[^<]*(pixel|track)|hotjar|clarity\.ms|mixpanel|amplitude|plausible|matomo|portfolio-growth/bridge\.js' /tmp/one-short.html
          echo 'GitHub Pages mirror: VERIFIED'
