name: IZAKHONO Domain Registry Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/izakhono-domain-registry-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query .co.za registry and DNS without exposing registrant contact data
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq whois dnsutils >/dev/null
          DOMAIN='izakhonoafrica.co.za'

          echo '=== REGISTRY SUMMARY ==='
          set +e
          whois -h whois.registry.net.za "$DOMAIN" >/tmp/whois.txt 2>/tmp/whois.err
          rc=$?
          set -e
          echo "WHOIS_EXIT=$rc"
          echo "WHOIS_LINES=$(wc -l < /tmp/whois.txt | tr -d ' ')"
          grep -Ei 'no match|not found|no information|available|not registered|does not exist|no entries|no object|domain unavailable' /tmp/whois.txt \
            | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[redacted-email]/g' \
            | head -n 40 || true

          # Emit only operational registry fields; deliberately exclude contact/person data.
          grep -Ei 'domain name|registrar|sponsor|reseller|provider|status|expir|name[ -]?server|nameserver|nsset|dnssec|updated|registered|creation' /tmp/whois.txt \
            | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[redacted-email]/g' \
            | sed -E 's/(\+?[0-9][0-9 ()-]{7,}[0-9])/[redacted-phone]/g' \
            | sed -E 's/[[:space:]]+$//' \
            | head -n 160 || true

          echo '=== DNS PARENT ==='
          printf 'NS_ROOT='; dig +short NS "$DOMAIN" | paste -sd, - || true
          printf 'A_ROOT='; dig +short A "$DOMAIN" | paste -sd, - || true
          printf 'NS_DELEGATED='; dig +short NS "domains.$DOMAIN" | paste -sd, - || true
          printf 'A_NS1='; dig +short A "ns1.$DOMAIN" | paste -sd, - || true
          printf 'A_NS2='; dig +short A "ns2.$DOMAIN" | paste -sd, - || true
          printf 'A_ONE='; dig +short A "one.domains.$DOMAIN" | paste -sd, - || true

          echo '=== TRACE TAIL ==='
          dig +trace NS "$DOMAIN" 2>/dev/null \
            | grep -E '(^|[[:space:]])(NS|SOA)[[:space:]]' \
            | tail -n 25 || true
