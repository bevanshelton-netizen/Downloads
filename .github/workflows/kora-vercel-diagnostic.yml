name: KORA Vercel Diagnostic

on:
  push:
    branches:
      - diagnose/kora-vercel-build

permissions:
  contents: read

jobs:
  build-without-production-secrets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kora-network
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Reproduce Vercel first-build environment
        run: npm run build
