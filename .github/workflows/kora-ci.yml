name: KORA CI

on:
  pull_request:
    paths:
      - 'kora-network/**'
      - '.github/workflows/kora-ci.yml'
  push:
    branches: [main]
    paths:
      - 'kora-network/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kora-network
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kora-network/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
