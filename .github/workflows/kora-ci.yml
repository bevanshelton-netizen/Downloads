name: KORA CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'kora-network/**'
      - '.github/workflows/kora-ci.yml'
      - '.github/workflows/kora-production-*.yml'
      - '.github/workflows/kora-bootstrap-first-admin.yml'

concurrency:
  group: kora-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kora-network
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kora-network/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run validate:migrations
      - run: npm run validate:release-policy
      - run: npm run build:bootstrap-sql
      - name: Upload one-shot Supabase bootstrap SQL
        uses: actions/upload-artifact@v4
        with:
          name: kora-production-bootstrap-schema14
          path: kora-network/artifacts/kora-production-bootstrap-schema14.sql
          if-no-files-found: error
          retention-days: 14
      - name: Validate deployment automation syntax
        run: |
          node --check scripts/preflight-production.mjs
          node --check scripts/postdeploy-smoke.mjs
          node --check scripts/bootstrap-admin.mjs
          node --check scripts/build-production-bootstrap.mjs
          node --check scripts/validate-release-policy.mjs
          bash -n scripts/bootstrap-production-db.sh
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_NAME: KORA
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          VIDEO_PROVIDER: mock
          PAYFAST_MERCHANT_ID: '10000100'
          PAYFAST_MERCHANT_KEY: ci-placeholder-merchant-key
          PAYFAST_PASSPHRASE: ci-placeholder-passphrase
          PAYFAST_SANDBOX: 'true'
          KORA_INTERNAL_API_SECRET: ci-placeholder-internal-secret-long-enough-for-build
