name: ALLEGRO Owner Pilot Handoff Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'START-ALLEGRO-ON-IZAKHONO.cmd'
      - 'izakhono-cloud/DEPLOY-ALLEGRO-ISN-01.ps1'
      - 'izakhono-cloud/RUN-IZAKHONO-FLEET-ISN-01.ps1'
      - '.github/workflows/allegro-owner-pilot-handoff.yml'
  push:
    branches: [main]
    paths:
      - 'START-ALLEGRO-ON-IZAKHONO.cmd'
      - 'izakhono-cloud/DEPLOY-ALLEGRO-ISN-01.ps1'
      - 'izakhono-cloud/RUN-IZAKHONO-FLEET-ISN-01.ps1'
      - '.github/workflows/allegro-owner-pilot-handoff.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse PowerShell launcher
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'izakhono-cloud/DEPLOY-ALLEGRO-ISN-01.ps1'),
            [ref]$tokens,[ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Guard ALLEGRO private-pilot contract
        shell: pwsh
        run: |
          $p = Get-Content 'izakhono-cloud/DEPLOY-ALLEGRO-ISN-01.ps1' -Raw
          foreach ($required in @(
            '0158148cbeae8e5aa7094c0bda9649c438e61e29',
            'ENGINE-PROOF.json',
            'ALLEGRO.env',
            'VITE_IZAKHONO_CORE_URL',
            'VITE_IZAKHONO_PUBLIC_KEY',
            'VITE_IZAKHONO_ANALYTICS_URL=http://127.0.0.1:18112',
            '127.0.0.1:18108',
            'ALLEGRO-CUTOVER.json'
          )) {
            if ($p -notmatch [regex]::Escape($required)) { throw "Missing ALLEGRO pilot contract: $required" }
          }
          if ($p -notmatch 'public_dns_changed.+False') { throw 'DNS safety receipt missing' }
          if ($p -notmatch 'live_payments_changed.+False') { throw 'payment safety receipt missing' }
          if ($p -match 'cloudflared tunnel route|route53|nameserver|dns update') { throw 'ALLEGRO pilot must not modify public edge' }

      - name: Guard fleet integration
        shell: pwsh
        run: |
          $f = Get-Content 'izakhono-cloud/RUN-IZAKHONO-FLEET-ISN-01.ps1' -Raw
          if ($f -notmatch 'DEPLOY-ALLEGRO-ISN-01.ps1') { throw 'ALLEGRO is not registered in the ISN-01 fleet' }
          if ($f -notmatch 'ALLEGRO.env') { throw 'ALLEGRO config gate missing from fleet launcher' }

      - name: Validate CMD handoff
        shell: pwsh
        run: |
          $c = Get-Content 'START-ALLEGRO-ON-IZAKHONO.cmd' -Raw
          if ($c -notmatch 'DEPLOY-ALLEGRO-ISN-01.ps1') { throw 'launcher target mismatch' }
          if ($c -notmatch 'raw.githubusercontent.com/bevanshelton-netizen/Downloads/main') { throw 'launcher must fetch merged main script' }
