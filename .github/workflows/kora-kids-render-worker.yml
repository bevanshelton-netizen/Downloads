name: KORA KIDS Render Worker

on:
  push:
    paths:
      - "kora-kids-render-worker/**"
      - "owner-host/START-KORA-KIDS-RENDER.ps1"
      - "START-KORA-KIDS-RENDER.cmd"
      - ".github/workflows/kora-kids-render-worker.yml"
  pull_request:
    paths:
      - "kora-kids-render-worker/**"
      - "owner-host/START-KORA-KIDS-RENDER.ps1"
      - "START-KORA-KIDS-RENDER.cmd"
      - ".github/workflows/kora-kids-render-worker.yml"

jobs:
  render-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ensure local render tools
        run: |
          set -euo pipefail
          need_install=0
          command -v ffmpeg >/dev/null 2>&1 || need_install=1
          command -v ffprobe >/dev/null 2>&1 || need_install=1
          command -v espeak-ng >/dev/null 2>&1 || need_install=1
          if [ "$need_install" -eq 1 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg espeak-ng
          fi
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
          espeak-ng --version >/dev/null
      - name: Validate worker syntax
        run: node --check kora-kids-render-worker/worker.mjs
      - name: Render approved Lebo & Jabu proof
        run: |
          rm -rf /tmp/kora-render-proof
          node kora-kids-render-worker/worker.mjs             --input kora-kids-render-worker/fixtures/lebo-jabu-approved-job.json             --output /tmp/kora-render-proof             --mode proof
      - name: Validate media and claims boundary
        run: |
          set -euo pipefail
          test -s /tmp/kora-render-proof/episode-guide.mp4
          test -s /tmp/kora-render-proof/guide.wav
          test -s /tmp/kora-render-proof/captions.vtt
          test -s /tmp/kora-render-proof/voice-cues.json
          test -s /tmp/kora-render-proof/lip-sync.json
          test -s /tmp/kora-render-proof/mix-plan.json
          test -s /tmp/kora-render-proof/shot-plan.json
          test -s /tmp/kora-render-proof/qc-report.json
          test -s /tmp/kora-render-proof/render-result.json
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of json /tmp/kora-render-proof/episode-guide.mp4 >/tmp/video.json
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of json /tmp/kora-render-proof/episode-guide.mp4 >/tmp/audio.json
          node <<'NODE'
          const fs=require("fs");
          const read=p=>JSON.parse(fs.readFileSync(p,"utf8"));
          const checks=[];
          const expect=(name,value)=>checks.push({name,ok:Boolean(value)});
          const video=read("/tmp/video.json").streams[0];
          const audio=read("/tmp/audio.json").streams[0];
          const result=read("/tmp/kora-render-proof/render-result.json");
          const qc=read("/tmp/kora-render-proof/qc-report.json");
          const lip=read("/tmp/kora-render-proof/lip-sync.json");
          const mix=read("/tmp/kora-render-proof/mix-plan.json");
          const shots=read("/tmp/kora-render-proof/shot-plan.json");
          const caps=fs.readFileSync("/tmp/kora-render-proof/captions.vtt","utf8");
          expect("video-h264-640x360",video.codec_name==="h264"&&video.width===640&&video.height===360);
          expect("audio-aac",audio.codec_name==="aac");
          expect("result-v3",result.schema==="kora-kids.render-result/v3");
          expect("owned-target",result.authoritativeTarget==="izakhono-local");
          expect("not-broadcast",result.broadcastMaster===false);
          expect("voice-not-final",result.guideAudio?.finalVoiceApproved===false);
          expect("guide-qc-pass",result.qc?.passForGuide===true);
          expect("broadcast-qc-blocked",result.qc?.passForBroadcast===false);
          expect("qc-shot-timing",qc.checks?.shotTiming===true);
          expect("qc-fact-lines",qc.checks?.factLinesIdentified===true);
          expect("qc-shot-plan",qc.checks?.shotPlanPresent===true&&qc.shotCount>=20);
          expect("qc-framing-variety",qc.checks?.framingVariety===true&&qc.framingTypes?.length>=6);
          expect("qc-expression-direction",qc.checks?.expressionDirection===true);
          expect("qc-quality-bibles",qc.checks?.qualityBiblesBound===true);
          expect("shot-plan-count",shots.shots?.length>=20);
          expect("shot-plan-close",shots.shots?.some(s=>s.framing==="close"));
          expect("shot-plan-tracking",shots.shots?.some(s=>s.framing==="tracking"));
          expect("lip-sync-cues",lip.cues?.length>=10);
          expect("lip-sync-lebo-only",lip.cues?.every(c=>c.speaker==="Lebo"&&c.endSeconds>c.startSeconds));
          expect("original-music-required",mix.musicBus?.originalMusicRequired===true);
          expect("five-mix-scenes",mix.scenes?.length===5);
          expect("captions-webvtt",caps.includes("WEBVTT"));
          expect("captions-lebo",caps.includes("Lebo:"));
          expect("captions-first-line",caps.includes("Whoa! Jabu"));
          console.table(checks);
          const failed=checks.filter(x=>!x.ok);
          if(failed.length){console.error("Failed validations:",failed.map(x=>x.name).join(", "));process.exit(2)}
          NODE
      - name: Prove unapproved jobs are refused
        run: |
          node -e 'const fs=require("fs");const x=require("./kora-kids-render-worker/fixtures/lebo-jabu-approved-job.json");x.status="review";x.publishable=false;x.review.culturalContext=false;fs.writeFileSync("/tmp/rejected.json",JSON.stringify(x))'
          if node kora-kids-render-worker/worker.mjs --input /tmp/rejected.json --output /tmp/should-not-render --mode proof; then
            echo "Worker incorrectly rendered an unapproved job" >&2
            exit 2
          fi
      - name: Upload guide animatic proof
        uses: actions/upload-artifact@v4
        with:
          name: kora-kids-lebo-jabu-render-proof
          path: |
            /tmp/kora-render-proof/episode-guide.mp4
            /tmp/kora-render-proof/captions.vtt
            /tmp/kora-render-proof/voice-cues.json
            /tmp/kora-render-proof/lip-sync.json
            /tmp/kora-render-proof/mix-plan.json
            /tmp/kora-render-proof/shot-plan.json
            /tmp/kora-render-proof/qc-report.json
            /tmp/kora-render-proof/render-result.json
          retention-days: 7
