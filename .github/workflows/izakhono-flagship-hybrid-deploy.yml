name: IZAKHONO Flagship Hybrid Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'izakhono-group/**'
      - '.github/workflows/izakhono-flagship-hybrid-deploy.yml'

permissions:
  contents: read

concurrency:
  group: izakhono-flagship-hybrid
  cancel-in-progress: false

jobs:
  verify-owned-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Prove flagship package locally
        working-directory: izakhono-group
        run: |
          HOST=127.0.0.1 PORT=18331 node server.mjs >/tmp/izakhono-flagship-local.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18331/health >/tmp/health.json && break
            sleep .25
          done
          node -e 'const x=require("/tmp/health.json");if(x.ok!==true||x.service!=="IZAKHONO FLAGSHIP"||x.runtime!=="izakhono-owned")process.exit(2)'
          curl -fsS http://127.0.0.1:18331/ | grep -q "WE BUILD"
          curl -fsS http://127.0.0.1:18331/ | grep -q "AUTO AI"
          curl -fsS http://127.0.0.1:18331/ | grep -q "KORA"
          echo "OWNED PACKAGE: VERIFIED"

  external-resilience:
    needs: verify-owned-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: kora-production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_XSHdQaQxmXGD1HlK2E4nehif
      VERCEL_PROJECT_NAME: izakhono-flagship-resilience
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require external resilience credentials
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID"; exit 1; }

      - name: Resolve or create dedicated resilience project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /tmp/vercel-project.json -w "%{http_code}"             "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_NAME?teamId=$VERCEL_ORG_ID"             -H "Authorization: Bearer $VERCEL_TOKEN")"
          if [ "$CODE" = "404" ]; then
            CODE="$(curl -sS -o /tmp/vercel-project.json -w "%{http_code}"               -X POST "https://api.vercel.com/v10/projects?teamId=$VERCEL_ORG_ID"               -H "Authorization: Bearer $VERCEL_TOKEN"               -H "Content-Type: application/json"               --data "{"name":"$VERCEL_PROJECT_NAME"}")"
          fi
          [[ "$CODE" =~ ^2 ]] || { cat /tmp/vercel-project.json; exit 1; }
          PROJECT_ID="$(node -e 'const x=require("/tmp/vercel-project.json");if(!x.id)process.exit(2);process.stdout.write(x.id)')"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "Dedicated resilience project: $PROJECT_ID"

      - name: Disable deployment authentication for public resilience route
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /tmp/project-update.json -w "%{http_code}"             -X PATCH "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$VERCEL_ORG_ID"             -H "Authorization: Bearer $VERCEL_TOKEN"             -H "Content-Type: application/json"             --data '{"ssoProtection":null}')"
          [[ "$CODE" =~ ^2 ]] || { cat /tmp/project-update.json; exit 1; }

      - name: Link flagship source to resilience project
        working-directory: izakhono-group
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          mkdir -p .vercel
          node -e "require('fs').writeFileSync('.vercel/project.json', JSON.stringify({orgId:process.env.VERCEL_ORG_ID,projectId:process.env.PROJECT_ID,projectName:process.env.VERCEL_PROJECT_NAME}))"

      - name: Deploy external resilience production
        id: deploy
        working-directory: izakhono-group
        run: |
          set -euo pipefail
          URL="$(npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" | tail -n 1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Resilience deployment: $URL"

      - name: Verify immutable external deployment
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            CODE="$(curl -sS -L -o /tmp/flagship.html -w "%{http_code}" "$URL/" || true)"
            if [ "$CODE" = "200" ]; then break; fi
            sleep 3
          done
          test "$CODE" = "200"
          grep -q "WE BUILD" /tmp/flagship.html
          grep -q "AUTO AI" /tmp/flagship.html
          grep -q "KORA" /tmp/flagship.html
          curl -fsS "$URL/health" >/tmp/ext-health.json
          node -e 'const x=require("/tmp/ext-health.json");if(x.ok!==true||x.service!=="IZAKHONO FLAGSHIP"||x.runtime!=="external-resilience")process.exit(2)'
          curl -sSI "$URL/" | grep -qi '^x-izakhono-route: external-resilience'
          echo "EXTERNAL RESILIENCE: VERIFIED"

      - name: Publish hybrid deployment receipt
        env:
          URL: ${{ steps.deploy.outputs.url }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          {
            echo "## IZAKHONO Flagship Hybrid Deployment"
            echo "- Owned primary: IZAKHONO CODE -> RUNTIME -> EDGE"
            echo "- External resilience: $URL"
            echo "- External project: $PROJECT_ID"
            echo "- External HTTPS 200: verified"
            echo "- External /health: verified"
            echo "- Same flagship content markers: verified"
            echo "- Customer domain cutover: NOT implied"
            echo "- Commit: ${GITHUB_SHA::7}"
          } >> "$GITHUB_STEP_SUMMARY"
