name: IZAKHONO Infrastructure Executor Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'IZAKHONO-INFRASTRUCTURE-AUTHORITY.json'
      - 'IZAKHONO-PLATFORM-INFRASTRUCTURE-DIRECTIVE.md'
      - 'infrastructure/**'
      - 'izakhono-infrastructure-executor/**'
      - 'izakhono-owned-cloud/install-owned-stack.sh'
      - '.github/workflows/yhvh-gospel-node01-deploy.yml'
      - '.github/workflows/izakhono-infrastructure-executor-gate.yml'
  push:
    branches: [main]
    paths:
      - 'IZAKHONO-INFRASTRUCTURE-AUTHORITY.json'
      - 'IZAKHONO-PLATFORM-INFRASTRUCTURE-DIRECTIVE.md'
      - 'infrastructure/**'
      - 'izakhono-infrastructure-executor/**'
      - 'izakhono-owned-cloud/install-owned-stack.sh'
      - '.github/workflows/yhvh-gospel-node01-deploy.yml'
      - '.github/workflows/izakhono-infrastructure-executor-gate.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate native executor
        shell: bash
        run: |
          set -euo pipefail
          bash -n izakhono-infrastructure-executor/host-eligibility.sh
          bash -n izakhono-infrastructure-executor/sync-source.sh
          bash -n izakhono-infrastructure-executor/run-once.sh
          bash -n izakhono-infrastructure-executor/install-linux.sh
          bash -n izakhono-owned-cloud/activate-izakhono-one-local-model.sh
          bash -n izakhono-owned-cloud/deploy-izakhono-crm-v020.sh
          bash -n izakhono-owned-cloud/deploy-yenzanow.sh
          bash -n izakhono-owned-cloud/deploy-matric-rewrite.sh
          bash -n izakhono-owned-cloud/deploy-command-center.sh
          bash -n izakhono-owned-cloud/deploy-containers.sh
          bash -n izakhono-owned-cloud/deploy-kora-network.sh
          bash -n izakhono-owned-cloud/deploy-faisready.sh
          bash -n izakhono-owned-cloud/deploy-allegro-vibez.sh
          bash -n izakhono-owned-cloud/deploy-the-chancellor.sh
          bash -n izakhono-owned-cloud/deploy-izakhono-analytics-collector.sh

          node - <<'NODE'
          const fs=require('fs');
          const authority=JSON.parse(fs.readFileSync('IZAKHONO-INFRASTRUCTURE-AUTHORITY.json','utf8'));
          if(authority.execution_policy?.production_scheduler!=='IZAKHONO_INFRASTRUCTURE_EXECUTOR') throw new Error('scheduler mismatch');
          if(authority.execution_policy?.github_self_hosted_runner_required_for_production!==false) throw new Error('GitHub runner still required');
          if(authority.execution_policy?.arbitrary_command_from_control_allowed!==false) throw new Error('arbitrary commands not forbidden');

          const control=JSON.parse(fs.readFileSync('infrastructure/control/portfolio-desired-state.json','utf8'));
          if(control.schema!=='izakhono.infrastructure-desired-state/v1'||control.authority!=='IZAKHONO_INFRASTRUCTURE') throw new Error('control contract mismatch');
          const yhvh=(control.requests||[]).find(x=>x.id==='yhvh-gospel-tv-infrastructure-20260926-01');
          if(!yhvh||yhvh.platform_id!=='yhvh-gospel-tv'||yhvh.laptop_target!==false||yhvh.public_live_claim!==false) throw new Error('YHVH request mismatch');

          const targets=JSON.parse(fs.readFileSync('izakhono-infrastructure-executor/targets.json','utf8'));
          if(targets.authority!=='IZAKHONO_INFRASTRUCTURE'||targets.laptop_eligible!==false) throw new Error('target authority mismatch');
          for(const [id,t] of Object.entries(targets.targets||{})){
            if(!Array.isArray(t.command)||t.command[0]!=='bash') throw new Error(id+': command must be bash array');
            const script=String(t.command[1]||'');
            if(!/^izakhono-owned-cloud\/[A-Za-z0-9._-]+\.sh$/.test(script)) throw new Error(id+': deployer outside allowlist');
            if(!fs.existsSync(script)) throw new Error(id+': deployer missing '+script);
          }
          for(const [id,t] of Object.entries(targets.workloads||{})){
            if(!Array.isArray(t.command)||t.command[0]!=='bash') throw new Error(id+': workload command must be bash array');
            const script=String(t.command[1]||'');
            if(!/^izakhono-owned-cloud\/[A-Za-z0-9._-]+\.sh$/.test(script)) throw new Error(id+': workload outside allowlist');
            if(!fs.existsSync(script)) throw new Error(id+': workload wrapper missing '+script);
          }
          if(!fs.readFileSync('izakhono-infrastructure-executor/run-once.sh','utf8').includes("'run-workload'")) throw new Error('executor run-workload support missing');

          const catalog=JSON.parse(fs.readFileSync('owner-host/platforms.json','utf8'));
          const legacy=(catalog.platforms||[]).filter(p=>String(p.deploy||'').endsWith('.ps1')).map(p=>p.id).sort();
          const blocked=[...(targets.legacy_laptop_deployers_blocked||[])].sort();
          if(legacy.length!==0) throw new Error('registered IZAKHONO platform still uses a Windows deployer: '+legacy.join(','));
          if(blocked.length!==0) throw new Error('legacy executor quarantine should now be empty: '+blocked.join(','));
          for(const p of catalog.platforms||[]){
            const t=targets.targets?.[p.id] || (p.productId?targets.targets?.[p.productId]:null);
            if(!t) throw new Error(p.id+': missing infrastructure executor target');
            if(p.deploy!==t.command?.[1]) throw new Error(p.id+': catalog/executor deployer mismatch');
          }
          NODE

          ELIGIBILITY="$(bash izakhono-infrastructure-executor/host-eligibility.sh)"
          grep -q 'INFRASTRUCTURE_HOST_ELIGIBLE=true' <<<"$ELIGIBILITY"
          grep -Fq 'IZAKHONO INFRASTRUCTURE EXECUTOR' izakhono-owned-cloud/install-owned-stack.sh
          grep -Fq 'PLATFORM_TO_LAPTOP=DENY' izakhono-infrastructure-executor/install-linux.sh
          grep -Fq 'WSL_FORBIDDEN' izakhono-infrastructure-executor/host-eligibility.sh
          grep -Fq 'PORTABLE_BATTERY_DETECTED' izakhono-infrastructure-executor/host-eligibility.sh
          ! grep -Eq 'ghp_|github_pat_|sk-[A-Za-z0-9]' izakhono-infrastructure-executor/* 2>/dev/null

      - name: Verify YHVH no longer waits for a GitHub self-hosted deploy runner
        shell: bash
        run: |
          set -euo pipefail
          f=.github/workflows/yhvh-gospel-node01-deploy.yml
          ! grep -q 'runs-on: \[self-hosted' "$f"
          grep -q 'DEPLOYMENT_AUTHORITY=IZAKHONO_INFRASTRUCTURE_EXECUTOR' "$f"
          grep -q 'infrastructure/control/portfolio-desired-state.json' "$f"
          grep -q 'PUBLIC_LIVE_CLAIM=false' "$f"

      - name: Reject GitHub self-hosted production execution
        shell: bash
        run: |
          set -euo pipefail
          for f in             .github/workflows/learner-driver-node01-deploy.yml             .github/workflows/izakhono-one-owner-runner-activation.yml             .github/workflows/izakhono-pay-owner-live.yml             .github/workflows/izakhono-crm-owner-live.yml             .github/workflows/izakhono-portfolio-cutover.yml             .github/workflows/yhvh-gospel-node01-deploy.yml
          do
            if grep -Eq 'runs-on:[[:space:]]*\[[^]]*self-hosted|^[[:space:]]*-[[:space:]]*self-hosted[[:space:]]* "$f"; then
              echo "Production workflow still contains self-hosted execution: $f" >&2
              exit 2
            fi
          done
          echo 'PRODUCTION_GITHUB_SELF_HOSTED_EXECUTION=NONE'
