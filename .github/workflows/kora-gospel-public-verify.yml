name: YHVH Gospel TV Public Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ports/kora-gospel-tv/**"
      - "yhvh-gospel-tv/**"
      - "kora-network/app/gospel/**"
      - "kora-network/app/api/gospel/**"
      - ".github/workflows/kora-gospel-public-verify.yml"

permissions:
  contents: read

jobs:
  verify-public-gospel:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Validate standalone external launch front door
        shell: bash
        run: |
          set -euo pipefail
          grep -qi "YHVH GOSPEL TV" yhvh-gospel-tv/index.html
          grep -qi "YHVH GOSPEL TV" ports/kora-gospel-tv/index.html
          grep -q "LIVE DIGITAL CHANNEL" ports/kora-gospel-tv/index.html\n          grep -q "Cormorant Garamond" ports/kora-gospel-tv/index.html\n          grep -q "yhvh-gospel-tv-logo-dove.png" ports/kora-gospel-tv/index.html\n          grep -q "FAITH. WORSHIP." ports/kora-gospel-tv/index.html
          grep -q "external-launch-web" ports/kora-gospel-tv/index.html
          grep -q "Request Commercial Proposal" kora-network/app/gospel/commercial/commercial-client.tsx

      - name: Verify Vercel external production route
        shell: bash
        run: |
          set -euo pipefail
          URL="https://kora-network.vercel.app/gospel"
          PAGE="$(curl --fail --silent --show-error --max-time 20 "$URL")"
          printf '%s' "$PAGE" | grep -qi "YHVH GOSPEL TV"
          printf '%s' "$PAGE" | grep -qi "Sponsor / advertise"
          echo "VERCEL EXTERNAL PRODUCTION: PASS"

      - name: Verify GitHub Pages external front door
        shell: bash
        run: |
          set -euo pipefail
          URL="https://bevanshelton-netizen.github.io/Downloads/yhvh-gospel-tv/"
          OK=0
          for i in {1..12}; do
            if PAGE="$(curl -L --fail --silent --show-error --max-time 20 "$URL" 2>/dev/null)"; then
              if printf '%s' "$PAGE" | grep -qi "YHVH GOSPEL TV"; then
                OK=1
                break
              fi
            fi
            sleep 10
          done
          test "$OK" = "1"
          echo "GITHUB PAGES EXTERNAL FRONT DOOR: PASS"

      - name: Observe IZAKHONO owned origin without blocking launch
        shell: bash
        run: |
          set +e
          HOST="gospel.domains.izakhonoafrica.co.za"
          HEALTH="$(curl --fail --silent --show-error --max-time 8 "https://$HOST/health" 2>/dev/null)"
          CODE=$?
          if [ "$CODE" = "0" ]; then
            node -e '
              const x=JSON.parse(process.argv[1]);
              if(x.ok!==true || x.service!=="kora-gospel-tv" || x.runtime!=="izakhono-owned") process.exit(2);
            ' "$HEALTH"
            if [ "$?" = "0" ]; then
              echo "IZAKHONO OWNED ORIGIN: LIVE VERIFIED"
              exit 0
            fi
          fi
          echo "IZAKHONO OWNED ORIGIN: NOT PUBLIC YET — EXTERNAL PRODUCTION REMAINS AUTHORITATIVE DELIVERY PATH"
          exit 0

      - name: Declare zero-budget public launch state
        run: |
          echo "YHVH GOSPEL TV: EXTERNAL PRODUCTION LIVE VERIFIED"
          echo "Budget model: R0 infrastructure spend"
          echo "Authority: IZAKHONO"
          echo "Delivery: Vercel + GitHub Pages"
          echo "Commercial intake: active"
