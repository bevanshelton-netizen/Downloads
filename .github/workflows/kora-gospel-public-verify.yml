name: YHVH Gospel TV Public Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ports/kora-gospel-tv/**"
      - "engines/yhvh-gospel-engine/**"
      - "izakhono-owned-cloud/deploy-kora-gospel-tv.sh"
      - "izakhono-owned-cloud/install-yhvh-gospel-engine.sh"
      - "yhvh-gospel-tv/**"
      - "owner-host/owner-agent.sh"
      - "owner-host/control/desired-state.json"
      - "kora-network/app/gospel/**"
      - "kora-network/app/api/gospel/**"
      - ".github/workflows/kora-gospel-public-verify.yml"

permissions:
  contents: read

jobs:
  verify-public-gospel:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Validate standalone external launch front door
        shell: bash
        run: |
          set -euo pipefail
          grep -qi "YHVH GOSPEL TV" yhvh-gospel-tv/index.html
          grep -qi "YHVH GOSPEL TV" ports/kora-gospel-tv/index.html
          grep -q "LIVE DIGITAL CHANNEL" ports/kora-gospel-tv/index.html
          grep -q "Cormorant Garamond" ports/kora-gospel-tv/index.html
          grep -q "yhvh-gospel-tv-logo-dove.png" ports/kora-gospel-tv/index.html
          grep -q "FAITH. WORSHIP." ports/kora-gospel-tv/index.html
          grep -q "external-launch-web" ports/kora-gospel-tv/index.html
          grep -q "Request Commercial Proposal" kora-network/app/gospel/commercial/commercial-client.tsx

      - name: Verify Vercel external production route
        shell: bash
        run: |
          set -euo pipefail
          URL="https://kora-network.vercel.app/gospel"
          PAGE="$(curl --fail --silent --show-error --max-time 20 "$URL")"
          printf '%s' "$PAGE" | grep -qi "YHVH GOSPEL TV"
          printf '%s' "$PAGE" | grep -Eqi "Request commercial proposal|Sponsor[. /]+[[:space:]]*Advertise|Sponsor.*Advertise"
          echo "VERCEL EXTERNAL PRODUCTION: PASS"

      - name: Verify GitHub Pages external front door
        shell: bash
        run: |
          set -euo pipefail
          URL="https://bevanshelton-netizen.github.io/Downloads/yhvh-gospel-tv/"
          OK=0
          for i in {1..12}; do
            if PAGE="$(curl -L --fail --silent --show-error --max-time 20 "$URL" 2>/dev/null)"; then
              if printf '%s' "$PAGE" | grep -qi "YHVH GOSPEL TV"; then
                OK=1
                break
              fi
            fi
            sleep 10
          done
          test "$OK" = "1"
          echo "GITHUB PAGES EXTERNAL FRONT DOOR: PASS"

      - name: Observe IZAKHONO owned origin without blocking launch
        shell: bash
        run: |
          set +e
          HOST="gospel.domains.izakhonoafrica.co.za"
          HEALTH="$(curl --fail --silent --show-error --max-time 8 "https://$HOST/health" 2>/dev/null)"
          CODE=$?
          if [ "$CODE" = "0" ]; then
            node -e '
              const x=JSON.parse(process.argv[1]);
              if(x.ok!==true) process.exit(2);
              if(!["yhvh-gospel-tv","kora-gospel-tv"].includes(x.service) || x.runtime!=="izakhono-owned") process.exit(3);
              if(x.product!=="YHVH GOSPEL TV" || x.product_id!=="yhvh-gospel-tv") process.exit(4);
              if(x.engine_id!=="yhvh-gospel-engine" || x.engine_authoritative!==true) process.exit(5);
              if(x.engine?.available!==true) process.exit(6);
            ' "$HEALTH"
            HEALTH_CODE=$?
            if [ "$HEALTH_CODE" = "0" ]; then
              RECEIPT="$(curl --fail --silent --show-error --max-time 8 "https://$HOST/api/deployment/status" 2>/dev/null)"
              EXPECTED_REQUEST_ID="$(node -e 'const x=require("./owner-host/control/desired-state.json");process.stdout.write(x.id)')"
              node -e '
                const x=JSON.parse(process.argv[1]);
                const expected=process.argv[2];
                const r=x.receipt||{};
                const a=x.owner_agent||{};
                if(x.authority!=="IZAKHONO" || x.product_id!=="yhvh-gospel-tv") process.exit(2);
                if(r.available!==true || r.engine_id!=="yhvh-gospel-engine" || r.engine_authoritative!==true) process.exit(3);
                if(r.source!=="IZAKHONO_CODE" || r.runtime!=="IZAKHONO_RUNTIME") process.exit(4);
                if(a.available!==true || a.product_id!=="yhvh-gospel-tv" || a.engine_id!=="yhvh-gospel-engine") process.exit(5);
                if(a.request_id!==expected || a.action!=="deploy-yhvh-gospel-tv" || a.status!=="success" || a.exit_code!==0) process.exit(6);
                if(a.source_authority!=="IZAKHONO_CODE" || a.secrets_exposed!==false || a.log_path_exposed!==false) process.exit(7);
              ' "$RECEIPT" "$EXPECTED_REQUEST_ID"
              RECEIPT_CODE=$?
              if [ "$RECEIPT_CODE" = "0" ]; then
                echo "IZAKHONO OWNED ORIGIN: LIVE VERIFIED — YHVH ENGINE AUTHORITATIVE — CURRENT OWNER REQUEST PROVEN"
                exit 0
              fi
            fi
          fi
          echo "IZAKHONO OWNED ORIGIN: NOT PUBLIC YET — EXTERNAL PRODUCTION REMAINS RESILIENCE DELIVERY PATH"
          exit 0

      - name: Diagnose IZAKHONO owned public path
        shell: bash
        run: |
          set +e
          HOST="gospel.domains.izakhonoafrica.co.za"
          echo "YHVH OWNED PATH DIAGNOSTIC"
          if getent ahosts "$HOST" >/tmp/yhvh-ahosts.txt 2>/dev/null; then
            echo "DNS_RESOLUTION=PASS"
            awk 'NR<=6{print "DNS_ADDRESS="$1}' /tmp/yhvh-ahosts.txt
          else
            echo "DNS_RESOLUTION=FAIL"
          fi
          if command -v dig >/dev/null 2>&1; then
            A_RECORD="$(dig +short A "$HOST" | head -n 1)"
            AAAA_RECORD="$(dig +short AAAA "$HOST" | head -n 1)"
            PARENT_NS="$(dig +short NS izakhonoafrica.co.za | tr '\n' ',' | sed 's/,$//')"
            OWNED_ZONE_NS="$(dig +short NS domains.izakhonoafrica.co.za | tr '\n' ',' | sed 's/,$//')"
            NS1_A="$(dig +short A ns1.izakhonoafrica.co.za | head -n 1)"
            echo "DNS_A=${A_RECORD:-NONE}"
            echo "DNS_AAAA=${AAAA_RECORD:-NONE}"
            echo "PARENT_ZONE_NS=${PARENT_NS:-NONE}"
            echo "OWNED_ZONE_NS=${OWNED_ZONE_NS:-NONE}"
            echo "NS1_A=${NS1_A:-NONE}"
            if [ -z "$OWNED_ZONE_NS" ]; then
              echo "DNS_BLOCKER=NO_PARENT_DELEGATION_FOR_DOMAINS_ZONE"
            elif ! printf '%s' "$OWNED_ZONE_NS" | grep -qi 'ns1\.izakhonoafrica\.co\.za'; then
              echo "DNS_BLOCKER=DOMAINS_ZONE_NOT_DELEGATED_TO_IZAKHONO_NS1"
            elif [ -z "$NS1_A" ]; then
              echo "DNS_BLOCKER=IZAKHONO_NS1_HAS_NO_PUBLIC_A_RECORD"
            elif [ -z "$A_RECORD" ]; then
              echo "DNS_BLOCKER=YHVH_RECORD_NOT_VISIBLE_FROM_AUTHORITATIVE_PATH"
            else
              echo "DNS_BLOCKER=NONE"
            fi
          fi
          HTTPS_CODE="$(curl -sS -o /tmp/yhvh-owned-health-body.txt -w '%{http_code}' --connect-timeout 5 --max-time 12 "https://$HOST/health" 2>/tmp/yhvh-owned-curl.err)"
          CURL_EXIT=$?
          echo "HTTPS_CURL_EXIT=$CURL_EXIT"
          echo "HTTPS_STATUS=${HTTPS_CODE:-000}"
          if [ "$CURL_EXIT" = "0" ]; then
            head -c 800 /tmp/yhvh-owned-health-body.txt | tr '\n' ' ' | sed 's/^/HTTPS_BODY=/'
            echo
          else
            CURL_ERROR="$(head -c 500 /tmp/yhvh-owned-curl.err | tr '\n' ' ')"
            echo "HTTPS_ERROR=$CURL_ERROR"
          fi
          if command -v openssl >/dev/null 2>&1; then
            timeout 10 openssl s_client -connect "$HOST:443" -servername "$HOST" </dev/null >/tmp/yhvh-tls.out 2>/tmp/yhvh-tls.err
            TLS_EXIT=$?
            echo "TLS_HANDSHAKE_EXIT=$TLS_EXIT"
            if [ "$TLS_EXIT" = "0" ]; then
              openssl x509 -noout -subject -issuer -dates </tmp/yhvh-tls.out 2>/dev/null | sed 's/^/TLS_CERT_/'
            else
              TLS_ERROR="$(head -c 500 /tmp/yhvh-tls.err | tr '\n' ' ')"
              echo "TLS_ERROR=$TLS_ERROR"
            fi
          fi
          exit 0

      - name: Declare zero-budget public launch state
        run: |
          echo "YHVH GOSPEL TV: EXTERNAL PRODUCTION LIVE VERIFIED"
          echo "Budget model: R0 infrastructure spend"
          echo "Authority: IZAKHONO"
          echo "Delivery: Vercel + GitHub Pages"
          echo "Commercial intake: active"
