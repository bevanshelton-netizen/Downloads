name: YHVH Gospel NODE01 Deployment

on:
  push:
    branches: [main]
    paths:
      - "owner-host/control/desired-state.json"
      - ".github/workflows/yhvh-gospel-node01-deploy.yml"
      - "ports/yhvh-gospel-tv/**"
      - "engines/yhvh-gospel-engine/**"
      - "izakhono-owned-cloud/deploy-yhvh-gospel-tv.sh"
      - "izakhono-owned-cloud/start-yhvh-outbound-bridge.sh"
      - "owner-host/owner-agent.sh"
      - "owner-host/GET-YHVH-GOSPEL-TV-OVER-THE-LINE.ps1"
      - "owner-host/START-YHVH-GOSPEL-TV-ON-IZAKHONO.ps1"
      - "owner-host/VERIFY-YHVH-GOSPEL-TV-PUBLIC.ps1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "owner-host/control/desired-state.json"
      - ".github/workflows/yhvh-gospel-node01-deploy.yml"
      - "ports/yhvh-gospel-tv/**"
      - "engines/yhvh-gospel-engine/**"
      - "izakhono-owned-cloud/deploy-yhvh-gospel-tv.sh"
      - "izakhono-owned-cloud/start-yhvh-outbound-bridge.sh"
      - "owner-host/owner-agent.sh"
      - "owner-host/GET-YHVH-GOSPEL-TV-OVER-THE-LINE.ps1"
      - "owner-host/START-YHVH-GOSPEL-TV-ON-IZAKHONO.ps1"
      - "owner-host/VERIFY-YHVH-GOSPEL-TV-PUBLIC.ps1"

permissions:
  contents: read

concurrency:
  group: yhvh-gospel-node01-deploy
  cancel-in-progress: true

jobs:
  external-resilience:
    name: Verify external resilience
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Vercel Gospel front door
        shell: bash
        run: |
          set -euo pipefail
          PAGE="$(curl -LfsS --max-time 20 https://kora-network.vercel.app/gospel)"
          printf '%s' "$PAGE" | grep -qi "YHVH GOSPEL TV"
          echo "VERCEL_RESILIENCE=VERIFIED"

      - name: Verify GitHub Pages Gospel front door
        shell: bash
        run: |
          set -euo pipefail
          OK=0
          for i in {1..6}; do
            if PAGE="$(curl -LfsS --max-time 20 https://bevanshelton-netizen.github.io/Downloads/yhvh-gospel-tv/ 2>/dev/null)"; then
              if printf '%s' "$PAGE" | grep -qi "YHVH GOSPEL TV"; then OK=1; break; fi
            fi
            sleep 5
          done
          test "$OK" = "1"
          echo "GITHUB_PAGES_RESILIENCE=VERIFIED"

  owned-deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    name: Deploy on IZAKHONO NODE01
    runs-on: [self-hosted, linux, x64, izakhono, izakhono-infrastructure]
    timeout-minutes: 20
    steps:
      - name: Run allow-listed NODE01 owner agent
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/opt/izakhono-source/Downloads
          test -d "$ROOT/.git"
          if [ -x "$ROOT/owner-host/sync-owner-source.sh" ]; then
            sudo -n bash "$ROOT/owner-host/sync-owner-source.sh" "$ROOT"
          else
            echo "IZAKHONO sync helper missing locally; using approved external bootstrap only to recover the helper."
            git -C "$ROOT" fetch --quiet origin main
            git -C "$ROOT" show origin/main:owner-host/sync-owner-source.sh >/tmp/izakhono-sync-owner-source.sh
            chmod 0700 /tmp/izakhono-sync-owner-source.sh
            sudo -n bash /tmp/izakhono-sync-owner-source.sh "$ROOT"
          fi
          sudo -n bash "$ROOT/owner-host/owner-agent.sh"

      - name: Verify owner-agent deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          STATE=/var/lib/izakhono-owner-agent/state.json
          test -s "$STATE"
          sudo -n cat "$STATE" > /tmp/yhvh-owner-state.json
          EXPECTED_REQUEST_ID="$(node -e 'const x=require("/opt/izakhono-source/Downloads/owner-host/control/desired-state.json");process.stdout.write(x.id)')"
          node - "$EXPECTED_REQUEST_ID" <<'NODE'
          const expected=process.argv[2];
          const x=require('/tmp/yhvh-owner-state.json');
          if(x.request_id!==expected) process.exit(2);
          if(x.action!=='deploy-yhvh-gospel-tv'||x.status!=='success'||x.exit_code!==0) process.exit(3);
          if(x.source_authority!=='IZAKHONO_CODE') process.exit(4);
          console.log('OWNER_AGENT_DEPLOYMENT=VERIFIED');
          console.log('OWNER_REQUEST_ID='+expected);
          console.log('SOURCE_AUTHORITY=IZAKHONO_CODE');
          NODE

      - name: Verify independent engine locally
        shell: bash
        run: |
          set -euo pipefail
          ENGINE="$(curl -fsS --max-time 5 http://127.0.0.1:8892/health)"
          node -e 'const x=JSON.parse(process.argv[1]);if(x.ok!==true||x.service!=="yhvh-gospel-engine"||x.runtime!=="izakhono-owned"||x.authority!=="IZAKHONO"||x.version!=="2.0.0")process.exit(2)' "$ENGINE"
          echo "YHVH_ENGINE_LOCAL=VERIFIED"

      - name: Verify owned channel locally
        shell: bash
        run: |
          set -euo pipefail
          HOST=gospel.domains.izakhonoafrica.co.za
          HEALTH="$(curl -fsS --max-time 5 -H "Host: $HOST" http://127.0.0.1:8080/health)"
          node -e 'const x=JSON.parse(process.argv[1]);if(x.ok!==true||x.service!=="yhvh-gospel-tv"||x.runtime!=="izakhono-owned")process.exit(2)' "$HEALTH"
          echo "YHVH_CHANNEL_LOCAL=VERIFIED"

  independent-public-verify:
    if: always() && needs.owned-deploy.result == 'success'
    name: Independently verify owned public HTTPS
    needs: owned-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove owned public identity
        shell: bash
        run: |
          set -euo pipefail
          HOST=gospel.domains.izakhonoafrica.co.za
          HEALTH="$(curl -fsS --max-time 20 "https://$HOST/health")"
          node -e 'const x=JSON.parse(process.argv[1]);if(x.ok!==true||x.service!=="yhvh-gospel-tv"||x.runtime!=="izakhono-owned")process.exit(2)' "$HEALTH"
          echo "YHVH_OWNED_PUBLIC_HTTPS=VERIFIED"
