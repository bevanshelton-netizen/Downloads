name: YHVH Gospel NODE01 Deployment

on:
  push:
    branches: [main]
    paths:
      - "owner-host/control/desired-state.json"
      - ".github/workflows/yhvh-gospel-node01-deploy.yml"
      - "ports/yhvh-gospel-tv/**"
      - "engines/yhvh-gospel-engine/**"
      - "izakhono-owned-cloud/deploy-yhvh-gospel-tv.sh"
      - "izakhono-owned-cloud/start-yhvh-outbound-bridge.sh"
      - "owner-host/owner-agent.sh"
      - "owner-host/GET-YHVH-GOSPEL-TV-OVER-THE-LINE.ps1"
      - "owner-host/START-YHVH-GOSPEL-TV-ON-IZAKHONO.ps1"
      - "owner-host/VERIFY-YHVH-GOSPEL-TV-PUBLIC.ps1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "owner-host/control/desired-state.json"
      - ".github/workflows/yhvh-gospel-node01-deploy.yml"
      - "ports/yhvh-gospel-tv/**"
      - "engines/yhvh-gospel-engine/**"
      - "izakhono-owned-cloud/deploy-yhvh-gospel-tv.sh"
      - "izakhono-owned-cloud/start-yhvh-outbound-bridge.sh"
      - "owner-host/owner-agent.sh"
      - "owner-host/GET-YHVH-GOSPEL-TV-OVER-THE-LINE.ps1"
      - "owner-host/START-YHVH-GOSPEL-TV-ON-IZAKHONO.ps1"
      - "owner-host/VERIFY-YHVH-GOSPEL-TV-PUBLIC.ps1"

permissions:
  contents: read

concurrency:
  group: yhvh-gospel-node01-deploy
  cancel-in-progress: true

jobs:
  external-resilience:
    name: Verify external resilience
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Vercel Gospel front door
        shell: bash
        run: |
          set -euo pipefail
          PAGE="$(curl -LfsS --max-time 20 https://kora-network.vercel.app/gospel)"
          printf '%s' "$PAGE" | grep -qi "YHVH GOSPEL TV"
          echo "VERCEL_RESILIENCE=VERIFIED"

      - name: Verify GitHub Pages Gospel front door
        shell: bash
        run: |
          set -euo pipefail
          OK=0
          for i in {1..6}; do
            if PAGE="$(curl -LfsS --max-time 20 https://bevanshelton-netizen.github.io/Downloads/yhvh-gospel-tv/ 2>/dev/null)"; then
              if printf '%s' "$PAGE" | grep -qi "YHVH GOSPEL TV"; then OK=1; break; fi
            fi
            sleep 5
          done
          test "$OK" = "1"
          echo "GITHUB_PAGES_RESILIENCE=VERIFIED"

  infrastructure-request:
    name: Verify native IZAKHONO infrastructure request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify executor request and no-laptop authority
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('IZAKHONO-INFRASTRUCTURE-AUTHORITY.json','utf8'));
          if(a.runtime_authority!=='IZAKHONO_INFRASTRUCTURE') throw new Error('runtime authority mismatch');
          if(a.laptop?.runtime_dependency!==false||a.laptop?.deployment_target!==false) throw new Error('laptop execution not forbidden');
          if(a.communication_policy?.platform_to_laptop!=='DENY') throw new Error('platform-to-laptop communication not denied');
          const c=JSON.parse(fs.readFileSync('infrastructure/control/portfolio-desired-state.json','utf8'));
          const r=(c.requests||[]).find(x=>x.id==='yhvh-gospel-tv-infrastructure-20260926-01');
          if(!r||r.enabled!==true||r.action!=='deploy-platform'||r.platform_id!=='yhvh-gospel-tv') throw new Error('YHVH infrastructure request missing');
          if(r.laptop_target!==false||r.public_live_claim!==false||r.external_resilience_preserve!==true) throw new Error('YHVH request safety contract invalid');
          const t=JSON.parse(fs.readFileSync('izakhono-infrastructure-executor/targets.json','utf8'));
          const target=t.targets?.['yhvh-gospel-tv'];
          if(!target||target.command?.[1]!=='izakhono-owned-cloud/deploy-yhvh-gospel-tv.sh') throw new Error('YHVH executor target mismatch');
          console.log('YHVH_INFRASTRUCTURE_REQUEST=VERIFIED');
          console.log('LAPTOP_TARGET=false');
          console.log('PLATFORM_TO_LAPTOP=DENY');
          console.log('DEPLOYMENT_AUTHORITY=IZAKHONO_INFRASTRUCTURE_EXECUTOR');
          NODE

  independent-public-verify:
    if: always() && needs.infrastructure-request.result == 'success'
    name: Observe owned public HTTPS without making a live claim
    needs: infrastructure-request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove owned public identity
        shell: bash
        run: |
          set -euo pipefail
          HOST=gospel.domains.izakhonoafrica.co.za
          set +e
          HEALTH="$(curl -fsS --max-time 20 "https://$HOST/health" 2>/dev/null)"
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ] || [ -z "$HEALTH" ]; then
            echo "YHVH_OWNED_PUBLIC_HTTPS=NOT_VERIFIED"
            echo "PUBLIC_LIVE_CLAIM=false"
            exit 0
          fi
          if node -e 'const x=JSON.parse(process.argv[1]);if(x.ok!==true||x.service!=="yhvh-gospel-tv"||x.runtime!=="izakhono-owned")process.exit(2)' "$HEALTH"; then
            echo "YHVH_OWNED_PUBLIC_HTTPS=VERIFIED"
          else
            echo "YHVH_OWNED_PUBLIC_HTTPS=IDENTITY_MISMATCH"
          fi
          echo "PUBLIC_LIVE_CLAIM=false"
