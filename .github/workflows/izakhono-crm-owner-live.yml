name: IZAKHONO CRM Native Infrastructure Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/IZAKHONO_CRM_OWNER_LIVE'
      - 'izakhono-owned-cloud/deploy-izakhono-crm-v020.sh'
      - 'infrastructure/control/portfolio-desired-state.json'
      - 'izakhono-infrastructure-executor/targets.json'
      - '.github/workflows/izakhono-crm-owner-live.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/IZAKHONO_CRM_OWNER_LIVE'
      - 'izakhono-owned-cloud/deploy-izakhono-crm-v020.sh'
      - 'infrastructure/control/portfolio-desired-state.json'
      - 'izakhono-infrastructure-executor/targets.json'
      - '.github/workflows/izakhono-crm-owner-live.yml'

permissions:
  contents: read

concurrency:
  group: izakhono-crm-owner-live
  cancel-in-progress: true

jobs:
  verify-package-and-request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout canonical IZAKHONO Builder source
        uses: actions/checkout@v4
        with:
          repository: bevanshelton-netizen/izakhono-builder
          ref: main
          path: canonical-builder
          fetch-depth: 0
          persist-credentials: false
      - name: Verify CRM v0.2.0 package and native workload request
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED='3d115c5ae5c092beb7011622fdda1534f885e68a'
          git -C canonical-builder merge-base --is-ancestor "$REQUIRED" HEAD
          bash -n canonical-builder/infra/app-fabric-runtime/activate-node01.sh
          bash -n izakhono-owned-cloud/deploy-izakhono-crm-v020.sh
          node - <<'NODE'
          const fs=require('fs');
          const p=require('./canonical-builder/products/izakhono-crm/package.json');
          if(p.version!=='0.2.0') throw new Error('expected CRM v0.2.0');
          const m=require('./canonical-builder/products/izakhono-crm/.izakhono.json');
          if(m.application_version!=='0.2.0') throw new Error('CRM capability manifest mismatch');
          const a=JSON.parse(fs.readFileSync('IZAKHONO-INFRASTRUCTURE-AUTHORITY.json','utf8'));
          if(a.execution_policy?.production_scheduler!=='IZAKHONO_INFRASTRUCTURE_EXECUTOR') throw new Error('native executor not authoritative');
          if(a.execution_policy?.github_self_hosted_runner_required_for_production!==false) throw new Error('GitHub runner still required');
          const c=JSON.parse(fs.readFileSync('infrastructure/control/portfolio-desired-state.json','utf8'));
          const r=(c.requests||[]).find(x=>x.id==='izakhono-crm-v020-infrastructure-20260926-01');
          if(!r||r.enabled!==true||r.action!=='run-workload'||r.workload_id!=='izakhono-crm-v020') throw new Error('CRM workload request missing');
          if(r.laptop_target!==false||r.public_live_claim!==false) throw new Error('CRM request safety mismatch');
          const t=JSON.parse(fs.readFileSync('izakhono-infrastructure-executor/targets.json','utf8'));
          if(t.workloads?.['izakhono-crm-v020']?.command?.[1]!=='izakhono-owned-cloud/deploy-izakhono-crm-v020.sh') throw new Error('CRM workload target mismatch');
          console.log('CRM_PACKAGE=VERIFIED');
          console.log('CRM_NATIVE_EXECUTOR_REQUEST=VERIFIED');
          console.log('PUBLIC_LIVE_CLAIM=false');
          NODE
