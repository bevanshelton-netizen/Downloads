name: IZAKHONO Portfolio Native Infrastructure Cutover

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/IZAKHONO_PORTFOLIO_CUTOVER'
      - 'ports/**'
      - 'scripts/izakhono/portfolio-cutover.sh'
      - 'izakhono-owned-cloud/deploy-yenzanow.sh'
      - 'izakhono-owned-cloud/deploy-matric-rewrite.sh'
      - 'izakhono-owned-cloud/deploy-command-center.sh'
      - 'izakhono-owned-cloud/deploy-containers.sh'
      - 'infrastructure/control/portfolio-desired-state.json'
      - 'izakhono-infrastructure-executor/targets.json'
      - '.github/workflows/izakhono-portfolio-cutover.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/IZAKHONO_PORTFOLIO_CUTOVER'
      - 'ports/**'
      - 'scripts/izakhono/portfolio-cutover.sh'
      - 'izakhono-owned-cloud/deploy-yenzanow.sh'
      - 'izakhono-owned-cloud/deploy-matric-rewrite.sh'
      - 'izakhono-owned-cloud/deploy-command-center.sh'
      - 'izakhono-owned-cloud/deploy-containers.sh'
      - 'infrastructure/control/portfolio-desired-state.json'
      - 'izakhono-infrastructure-executor/targets.json'
      - '.github/workflows/izakhono-portfolio-cutover.yml'

permissions:
  contents: read

concurrency:
  group: izakhono-portfolio-infrastructure
  cancel-in-progress: true

jobs:
  verify-packages-and-requests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed native infrastructure cutovers
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/izakhono/portfolio-cutover.sh
          bash -n izakhono-owned-cloud/deploy-yenzanow.sh
          bash -n izakhono-owned-cloud/deploy-matric-rewrite.sh
          bash -n izakhono-owned-cloud/deploy-command-center.sh
          bash -n izakhono-owned-cloud/deploy-containers.sh
          for spec in             'yenzanow:ports/yenzanow:/healthz.txt'             'matric-rewrite:ports/matric-rewrite:/healthz.txt'             'izakhono-command-center:ports/izakhono-command-center:/healthz.txt'             'izakhono-containers:ports/izakhono-containers:/healthz.txt'
          do
            IFS=: read -r name path health <<< "$spec"
            test -d "$path"
            test -f "$path$health"
            echo "READY_PACKAGE $name $path$health"
          done

          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('IZAKHONO-INFRASTRUCTURE-AUTHORITY.json','utf8'));
          if(a.execution_policy?.production_scheduler!=='IZAKHONO_INFRASTRUCTURE_EXECUTOR') throw new Error('native executor not authoritative');
          if(a.execution_policy?.github_self_hosted_runner_required_for_production!==false) throw new Error('GitHub runner still required');
          const c=JSON.parse(fs.readFileSync('infrastructure/control/portfolio-desired-state.json','utf8'));
          const t=JSON.parse(fs.readFileSync('izakhono-infrastructure-executor/targets.json','utf8'));
          const expected={
            'portfolio-yenzanow-infrastructure-20260926-01':['portfolio-yenzanow','izakhono-owned-cloud/deploy-yenzanow.sh'],
            'portfolio-matric-rewrite-infrastructure-20260926-01':['portfolio-matric-rewrite','izakhono-owned-cloud/deploy-matric-rewrite.sh'],
            'portfolio-command-center-infrastructure-20260926-01':['portfolio-command-center','izakhono-owned-cloud/deploy-command-center.sh'],
            'portfolio-containers-infrastructure-20260926-01':['portfolio-containers','izakhono-owned-cloud/deploy-containers.sh']
          };
          for(const [requestId,[workloadId,script]] of Object.entries(expected)){
            const r=(c.requests||[]).find(x=>x.id===requestId);
            if(!r||r.enabled!==true||r.action!=='run-workload'||r.workload_id!==workloadId) throw new Error(requestId+': request missing');
            if(r.laptop_target!==false||r.public_live_claim!==false) throw new Error(requestId+': safety mismatch');
            if(t.workloads?.[workloadId]?.command?.[1]!==script) throw new Error(workloadId+': workload target mismatch');
          }
          console.log('PORTFOLIO_NATIVE_EXECUTOR_REQUESTS=VERIFIED');
          console.log('GITHUB_PRODUCTION_EXECUTION=false');
          NODE
