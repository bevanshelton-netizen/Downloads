name: IZAKHONO Portfolio Infrastructure Cutover

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/IZAKHONO_PORTFOLIO_CUTOVER'
      - 'ports/**'
      - 'scripts/izakhono/portfolio-cutover.sh'
      - '.github/workflows/izakhono-portfolio-cutover.yml'

permissions:
  contents: read

concurrency:
  group: izakhono-portfolio-infrastructure
  cancel-in-progress: true

jobs:
  verify-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify infrastructure cutover packages
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/izakhono/portfolio-cutover.sh
          for spec in             'yenzanow:ports/yenzanow:/healthz.txt'             'matric-rewrite:ports/matric-rewrite:/healthz.txt'             'izakhono-command-center:ports/izakhono-command-center:/healthz.txt'             'izakhono-containers:ports/izakhono-containers:/healthz.txt'
          do
            IFS=: read -r name path health <<< "$spec"
            test -d "$path"
            test -f "$path$health"
            echo "READY_PACKAGE $name $path$health"
          done
          echo 'Infrastructure packages verified. Production execution requires izakhono-infrastructure.'

  yenzanow:
    if: github.event_name == 'workflow_dispatch'
    needs: verify-packages
    runs-on: [self-hosted, linux, x64, izakhono, izakhono-infrastructure]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/izakhono/portfolio-cutover.sh yenzanow ports/yenzanow 18101 /healthz.txt

  matric-rewrite:
    if: github.event_name == 'workflow_dispatch'
    needs: verify-packages
    runs-on: [self-hosted, linux, x64, izakhono, izakhono-infrastructure]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/izakhono/portfolio-cutover.sh matric-rewrite ports/matric-rewrite 18102 /healthz.txt

  command-center:
    if: github.event_name == 'workflow_dispatch'
    needs: verify-packages
    runs-on: [self-hosted, linux, x64, izakhono, izakhono-infrastructure]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/izakhono/portfolio-cutover.sh izakhono-command-center ports/izakhono-command-center 18103 /healthz.txt

  containers:
    if: github.event_name == 'workflow_dispatch'
    needs: verify-packages
    runs-on: [self-hosted, linux, x64, izakhono, izakhono-infrastructure]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/izakhono/portfolio-cutover.sh izakhono-containers ports/izakhono-containers 18104 /healthz.txt
