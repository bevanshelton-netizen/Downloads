name: IZAKHONO Builder Control Panel Gate

on:
  push:
    branches: [izakhono-builder]
    paths:
      - 'izakhono-builder/control-panel/**'
      - '.github/workflows/izakhono-builder-control-panel-ci.yml'

jobs:
  validate-control-panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: izakhono-builder/control-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Validate Cloudflare deployment
        run: npx wrangler deploy --dry-run
      - name: Security assertions
        run: |
          set -euo pipefail
          ! grep -R "ADMIN_SECRET.*=" -n public src || (echo "Do not embed admin secrets in source" && exit 1)
          ! grep -R "access-control-allow-origin.*\*" -n src || (echo "Wildcard CORS is forbidden" && exit 1)
          grep -q "x-admin-secret" src/index.ts
          grep -q "builder_projects" migrations/0001_init.sql
      - name: UI assertions
        run: |
          grep -q "IZAKHONO BUILDER" public/index.html
          grep -q "Build a new app" public/index.html
          grep -q "Free first" public/index.html
