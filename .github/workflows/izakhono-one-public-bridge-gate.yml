name: IZAKHONO ONE Public Bridge Gate

on:
  pull_request:
    paths:
      - "izakhono-one-public-bridge/**"
      - ".github/workflows/izakhono-one-public-bridge-gate.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate public bridge content
        run: |
          test -s izakhono-one-public-bridge/index.html
          grep -q "IZAKHONO ONE" izakhono-one-public-bridge/index.html
          grep -q "Founding 1,000" izakhono-one-public-bridge/index.html
          grep -q "ONE AI owned runtime activating" izakhono-one-public-bridge/index.html
          grep -q "No tracking pixels" izakhono-one-public-bridge/index.html
          ! grep -qi "ONE AI.*live" izakhono-one-public-bridge/index.html
          ! grep -qi "unlimited" izakhono-one-public-bridge/index.html

      - name: Verify Founding 1000 signup endpoint
        run: |
          RESPONSE="$(curl -fsS             -X POST             -H 'content-type: application/json'             --data '{"displayName":"IZAKHONO Bridge CI","email":"bridge-ci@izakhono.test","consent":true,"campaign":"public-bridge-ci"}'             https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-interest)"
          echo "$RESPONSE"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.accepted!==true||x.alreadyRegistered!==false||x.foundingNo!==1||x.foundingMember!==true||!/^ONE-[A-F0-9]{12}$/.test(x.inviteCode||"")||!String(x.shareUrl||"").includes("?ref=ONE-")) process.exit(2)' "$RESPONSE"
          STATUS="$(curl -fsS https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-interest)"
          echo "$STATUS"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.registered!==1||x.remaining!==999||x.behaviouralTracking!==false) process.exit(2)' "$STATUS"


      - name: Verify public launch page
        run: |
          HTML="$(curl -fsS https://yfawrenhudjomhnglfhq.supabase.co/functions/v1/izakhono-one-public)"
          echo "$HTML" | grep -q "IZAKHONO ONE"
          echo "$HTML" | grep -q "Founding 1,000"
          echo "$HTML" | grep -q "ONE AI owned runtime activating"
          echo "$HTML" | grep -q "personal invite link"
          echo "$HTML" | grep -q "Founding Member #"
