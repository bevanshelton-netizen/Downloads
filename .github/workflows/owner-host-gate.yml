name: IZAKHONO Accessible Owner Host Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'owner-host/**'
      - 'START-IZAKHONO-OWNER-HOST.cmd'
      - 'START-IZAKHONO-DOMAINS-OWNER-HOST.cmd'
      - 'START-GROWTH-OS-V2-ON-IZAKHONO.cmd'
      - 'START-CREATIVE-SUITE-ON-IZAKHONO.cmd'
      - 'START-IZAKHONO-TAILSCALE-BRIDGE.cmd'
      - 'owner-host/START-IZAKHONO-DOMAINS-OWNER-HOST.ps1'
      - 'izakhono-edge-node/**'
      - 'izakhono-owned-cloud/**'
      - 'izakhono-cloud/DEPLOY-KORA-ISN-01.ps1'
      - '.github/workflows/owner-host-gate.yml'
  push:
    branches: [build/accessible-owner-host]
    paths:
      - 'owner-host/**'
      - 'START-IZAKHONO-OWNER-HOST.cmd'
      - 'START-IZAKHONO-DOMAINS-OWNER-HOST.cmd'
      - 'izakhono-edge-node/**'
      - 'izakhono-owned-cloud/**'
      - 'izakhono-cloud/DEPLOY-KORA-ISN-01.ps1'
      - '.github/workflows/owner-host-gate.yml'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Syntax-check owner-host shell
        run: |
          bash -n owner-host/bootstrap-linux.sh
          bash -n owner-host/install-cloudflare-tunnel.sh
          bash -n owner-host/status.sh
          grep -q 'deploy-growth-os-v2.sh main' owner-host/bootstrap-linux.sh
          grep -q 'configure-growth-os.sh' owner-host/bootstrap-linux.sh
          grep -q 'growth-os-v2.json' owner-host/status.sh
          grep -q 'owned-public-edge.json' owner-host/status.sh
          grep -q 'activate-owned-public-edge.sh' owner-host/bootstrap-linux.sh
          grep -q 'ACTIVE_HYBRID' owner-host/bootstrap-linux.sh
          bash -n izakhono-owned-cloud/install-owned-stack.sh
          bash -n izakhono-owned-cloud/first-host-proof.sh
          bash -n izakhono-owned-cloud/deploy-izakhono-domains.sh
          bash -n izakhono-owned-cloud/deploy-growth-os-v2.sh
          bash -n izakhono-owned-cloud/deploy-creative-suite.sh
          bash -n izakhono-owned-cloud/import-repo-to-code.sh
          bash -n izakhono-owned-cloud/deploy-legacymart.sh
          bash -n izakhono-owned-cloud/deploy-izakhono-one-ai.sh
          bash -n izakhono-owned-cloud/activate-owned-public-edge.sh
          bash -n izakhono-owned-cloud/activate-tailscale-funnel.sh
          node --check growth-os-v2/server.mjs
          bash -n izakhono-edge-node/install-linux.sh
          node --check izakhono-edge-node/server.mjs
          node -e 'const x=JSON.parse(require("fs").readFileSync("owner-host/platforms.json","utf8"));if(!x.platforms.some(p=>p.id==="izakhono-domains"&&p.defaultHostname==="domains.izakhonoafrica.co.za"))process.exit(2);if(!x.platforms.some(p=>p.id==="growth-os-v2"&&p.defaultHostname==="growth.domains.izakhonoafrica.co.za"))process.exit(3);if(!x.platforms.some(p=>p.id==="legacymart"&&p.defaultHostname==="market.domains.izakhonoafrica.co.za"))process.exit(4);if(!x.platforms.some(p=>p.id==="creative-suite"&&p.defaultHostname==="creative.domains.izakhonoafrica.co.za"))process.exit(5);if(!x.platforms.some(p=>p.id==="izakhono-one-ai"&&p.defaultHostname==="one.domains.izakhonoafrica.co.za"))process.exit(6)'
          PORT=13000 HOST=127.0.0.1 node growth-os-v2/server.mjs >/tmp/growth-os-v2.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:13000/health >/tmp/growth-health.json && break; sleep .25; done
          node -e 'const x=require("/tmp/growth-health.json");if(x.ok!==true||x.service!=="growth-os-v2")process.exit(2)'
          curl -fsS http://127.0.0.1:13000/ | grep -q 'IZAKHONO GROWTH OS'
      - name: Run existing EDGE and FORTRESS self-test
        working-directory: izakhono-edge-node
        run: npm run check
      - name: Verify tunnel safety contract
        run: |
          grep -q 'TUNNEL_HOST.*127.0.0.1' izakhono-edge-node/server.mjs
          grep -q 'IZAKHONO_EDGE_MODE=tunnel' owner-host/bootstrap-linux.sh
          grep -q 'token-file /etc/izakhono/cloudflare-tunnel.token' owner-host/install-cloudflare-tunnel.sh
          ! grep -R -E 'eyJ[a-zA-Z0-9_-]{30,}' owner-host
          grep -q 'FORTRESS_PROTECTOR_MODE=active' izakhono-edge-node/install-linux.sh
          grep -q 'SOURCE=IZAKHONO_CODE' izakhono-owned-cloud/deploy-izakhono-domains.sh
          grep -q 'IZAKHONO_PACKAGE_NODE' izakhono-owned-cloud/deploy-growth-os-v2.sh
          grep -q 'growth.domains.izakhonoafrica.co.za' izakhono-owned-cloud/activate-owned-public-edge.sh
          grep -q 'IZAKHONO_PUBLIC_EXTRA_HOSTS' izakhono-owned-cloud/activate-owned-public-edge.sh
          grep -q 'IZAKHONO_EDGE_MODE=hybrid' izakhono-owned-cloud/activate-owned-public-edge.sh
          grep -q 'GROWTH_OS_V2=DEPLOYED_TO_IZAKHONO_RUNTIME' izakhono-owned-cloud/deploy-primary-node.sh
          grep -q 'tailscale funnel --bg' izakhono-owned-cloud/activate-tailscale-funnel.sh
          grep -q '/v1/apps/$APP/aliases' izakhono-owned-cloud/activate-tailscale-funnel.sh
          grep -q 'IZAKHONO EDGE -> FORTRESS -> RUNTIME' izakhono-owned-cloud/activate-tailscale-funnel.sh
          grep -q 'REGISTRATION_LIVE' izakhono-owned-cloud/deploy-izakhono-domains.sh
          grep -q 'Checkout safety gate did not fail closed' izakhono-owned-cloud/deploy-izakhono-domains.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse owner-host PowerShell
        shell: pwsh
        run: |
          $paths = @(
            'owner-host/START-IZAKHONO-OWNER-HOST.ps1',
            'owner-host/START-IZAKHONO-DOMAINS-OWNER-HOST.ps1',
            'owner-host/START-GROWTH-OS-V2-ON-IZAKHONO.ps1',
            'owner-host/START-CREATIVE-SUITE-ON-IZAKHONO.ps1',
            'owner-host/START-IZAKHONO-TAILSCALE-BRIDGE.ps1',
            'izakhono-cloud/DEPLOY-KORA-ISN-01.ps1',
            'izakhono-cloud/DEPLOY-LEGACYMART-ISN-01.ps1'
          )
          foreach ($path in $paths) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              exit 1
            }
          }
      - name: Verify one-click handoff
        shell: pwsh
        run: |
          $cmd = Get-Content 'START-IZAKHONO-OWNER-HOST.cmd' -Raw
          if ($cmd -notmatch 'START-IZAKHONO-OWNER-HOST.ps1') { throw 'CMD launcher target mismatch' }
          $ps = Get-Content 'owner-host/START-IZAKHONO-OWNER-HOST.ps1' -Raw
          if ($ps -notmatch 'Ubuntu-24.04') { throw 'Ubuntu owner-host target missing' }
          if ($ps -notmatch 'bootstrap-linux.sh') { throw 'Linux bootstrap handoff missing' }
          if ($ps -notmatch 'IZAKHONO-OWNER-HOST-STATUS.txt') { throw 'Owner-host desktop status report missing' }
          if ($ps -notmatch 'growth.domains.izakhonoafrica.co.za') { throw 'Growth OS owned hostname missing from owner launcher' }
          if ($ps -notmatch 'owned_public_edge_state') { throw 'Owned public-edge result handling missing' }
          if ($ps -notmatch 'PARENT_DNS_OR_ROUTER_REQUIRED') { throw 'DNS/router blocker handling missing' }
          if ($ps -notmatch 'TLS_OR_PORTS_REQUIRED') { throw 'TLS/ports blocker handling missing' }
          $domains = Get-Content 'START-IZAKHONO-DOMAINS-OWNER-HOST.cmd' -Raw
          if ($domains -notmatch 'START-IZAKHONO-DOMAINS-OWNER-HOST.ps1') { throw 'Domains PowerShell handoff missing' }
          $domainsPs = Get-Content 'owner-host/START-IZAKHONO-DOMAINS-OWNER-HOST.ps1' -Raw
          if ($domainsPs -notmatch 'Ubuntu-24.04') { throw 'Domains launcher WSL target missing' }
          if ($domainsPs -notmatch 'deploy-izakhono-domains.sh') { throw 'Domains deployment handoff missing' }
          if ($domainsPs -notmatch 'domains.izakhonoafrica.co.za') { throw 'Domains public hostname missing' }
          if ($domainsPs -notmatch 'activate-owned-public-edge.sh') { throw 'Domains owned public-edge handoff missing' }
          if ($domainsPs -notmatch 'IZAKHONO OWNED PUBLIC EDGE: LIVE AND VERIFIED') { throw 'Domains owned public verification gate missing' }
          if ($domainsPs -match 'Cloudflare Tunnel public hostname') { throw 'Domains launcher must prefer IZAKHONO owned public edge' }
          $growth = Get-Content 'START-GROWTH-OS-V2-ON-IZAKHONO.cmd' -Raw
          if ($growth -notmatch 'START-GROWTH-OS-V2-ON-IZAKHONO.ps1') { throw 'Growth OS v2 launcher target mismatch' }
          $growthPs = Get-Content 'owner-host/START-GROWTH-OS-V2-ON-IZAKHONO.ps1' -Raw
          if ($growthPs -notmatch 'deploy-growth-os-v2.sh') { throw 'Growth OS v2 deployment handoff missing' }
          if ($growthPs -notmatch 'growth.domains.izakhonoafrica.co.za') { throw 'Growth OS v2 hostname missing' }
          $creative = Get-Content 'START-CREATIVE-SUITE-ON-IZAKHONO.cmd' -Raw
          if ($creative -notmatch 'START-CREATIVE-SUITE-ON-IZAKHONO.ps1') { throw 'Creative Suite CMD handoff missing' }
          $creativePs = Get-Content 'owner-host/START-CREATIVE-SUITE-ON-IZAKHONO.ps1' -Raw
          if ($creativePs -notmatch 'deploy-creative-suite.sh') { throw 'Creative Suite owned deployment handoff missing' }
          if ($creativePs -notmatch 'creative.domains.izakhonoafrica.co.za') { throw 'Creative Suite owned hostname missing' }
          if ($creativePs -notmatch 'REGISTRATION') { throw 'Creative Suite registration safety reporting missing' }
          if ($creativePs -notmatch 'CHECKOUT') { throw 'Creative Suite checkout safety reporting missing' }
          $tailscale = Get-Content 'START-IZAKHONO-TAILSCALE-BRIDGE.cmd' -Raw
          if ($tailscale -notmatch 'START-IZAKHONO-TAILSCALE-BRIDGE.ps1') { throw 'Tailscale bridge CMD handoff missing' }
          $tailscalePs = Get-Content 'owner-host/START-IZAKHONO-TAILSCALE-BRIDGE.ps1' -Raw
          if ($tailscalePs -notmatch 'tailscale up') { throw 'Tailscale one-time auth handoff missing' }
          if ($tailscalePs -notmatch 'activate-tailscale-funnel.sh') { throw 'Tailscale bridge activation handoff missing' }
