name: IZAKHONO Accessible Owner Host Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'owner-host/**'
      - 'START-IZAKHONO-OWNER-HOST.cmd'
      - 'GET-CRM-OVER-THE-LINE.cmd'
      - 'START-IZAKHONO-DOMAINS-OWNER-HOST.cmd'
      - 'START-GROWTH-OS-V2-ON-IZAKHONO.cmd'
      - 'START-CREATIVE-SUITE-ON-IZAKHONO.cmd'
      - 'START-IZAKHONO-TAILSCALE-BRIDGE.cmd'
      - 'START-IZAKHONO-ONE-AI-LOCAL-MODEL.cmd'
      - 'INSTALL-IZAKHONO-OWNER-AGENT.cmd'
      - 'START-IZAKHONO-ONE-DEPLOYMENT-READINESS.cmd'
      - 'START-IZAKHONO-ONE-OWNED-LAUNCH.cmd'
      - 'owner-host/START-IZAKHONO-DOMAINS-OWNER-HOST.ps1'
      - 'izakhono-edge-node/**'
      - 'izakhono-owned-cloud/**'
      - 'izakhono-cloud/DEPLOY-KORA-ISN-01.ps1'
      - '.github/workflows/owner-host-gate.yml'
  push:
    branches: [main, build/accessible-owner-host]
    paths:
      - 'owner-host/**'
      - 'START-IZAKHONO-OWNER-HOST.cmd'
      - 'GET-CRM-OVER-THE-LINE.cmd'
      - 'START-IZAKHONO-DOMAINS-OWNER-HOST.cmd'
      - 'izakhono-edge-node/**'
      - 'izakhono-owned-cloud/**'
      - 'izakhono-cloud/DEPLOY-KORA-ISN-01.ps1'
      - '.github/workflows/owner-host-gate.yml'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Syntax-check owner-host shell
        run: |
          bash -n owner-host/bootstrap-linux.sh
          bash -n owner-host/install-cloudflare-tunnel.sh
          bash -n owner-host/status.sh
          bash -n owner-host/owner-agent.sh
          grep -Fq 'ROOT="${IZAKHONO_OWNER_AGENT_ROOT:-/opt/izakhono-source/Downloads}"' owner-host/owner-agent.sh
          grep -Fq 'if [ "${EUID:-$(id -u)}" -ne 0 ]; then' owner-host/owner-agent.sh
          ! grep -Fq '\${IZAKHONO_OWNER_AGENT_ROOT' owner-host/owner-agent.sh
          ! grep -Fq '\${EUID' owner-host/owner-agent.sh
          bash -n owner-host/sync-owner-source.sh
          bash -n owner-host/deploy-crm-v020.sh
          bash -n owner-host/notify-crm-v020-completion.sh
          grep -q 'idempotencyKey' owner-host/notify-crm-v020-completion.sh
          grep -q 'third_party_notification_control_required:false' owner-host/notify-crm-v020-completion.sh
          grep -q 'CRM_NOTIFY=WAITING_SUCCESS' owner-host/notify-crm-v020-completion.sh
          grep -q 'channel.*in_app' owner-host/notify-crm-v020-completion.sh
          ! grep -Eqi '(ghp_|github_pat_|AIza|sk-[A-Za-z0-9])' owner-host/notify-crm-v020-completion.sh
          node -e 'const x=JSON.parse(require("fs").readFileSync("owner-host/control/crm-v020-desired-state.json","utf8"));if(x.schema!=="izakhono.crm-v020.owner-request/v1"||x.enabled!==true||x.crm_version!=="0.2.0"||x.target!=="NODE01"||x.public_cutover!==false||x.external_resilience_preserve!==true)process.exit(2)'
          grep -q '3d115c5ae5c092beb7011622fdda1534f885e68a' owner-host/deploy-crm-v020.sh
          grep -q 'CRM_FAIL_CLOSED=PASS' owner-host/deploy-crm-v020.sh
          grep -q 'public_cutover_performed:false' owner-host/deploy-crm-v020.sh
          grep -q 'external_resilience_preserved:true' owner-host/deploy-crm-v020.sh
          grep -q 'deploy-growth-os-v2.sh main' owner-host/bootstrap-linux.sh
          grep -q 'configure-izakhono-one-ai.sh' owner-host/bootstrap-linux.sh
          grep -q 'deploy-izakhono-one-ai.sh main' owner-host/bootstrap-linux.sh
          grep -q 'one.domains.izakhonoafrica.co.za' owner-host/bootstrap-linux.sh
          grep -q 'configure-growth-os.sh' owner-host/bootstrap-linux.sh
          grep -q 'growth-os-v2.json' owner-host/status.sh
          grep -q 'owned-public-edge.json' owner-host/status.sh
          grep -q 'activate-owned-public-edge.sh' owner-host/bootstrap-linux.sh
          grep -q 'ACTIVE_HYBRID' owner-host/bootstrap-linux.sh
          bash -n izakhono-owned-cloud/install-owned-stack.sh
          bash -n izakhono-owned-cloud/first-host-proof.sh
          bash -n izakhono-owned-cloud/deploy-izakhono-domains.sh
          bash -n izakhono-owned-cloud/deploy-growth-os-v2.sh
          bash -n izakhono-owned-cloud/deploy-creative-suite.sh
          bash -n izakhono-owned-cloud/import-repo-to-code.sh
          bash -n izakhono-owned-cloud/deploy-legacymart.sh
          bash -n izakhono-owned-cloud/deploy-izakhono-one-ai.sh
          bash -n izakhono-owned-cloud/activate-local-model-engine.sh
          bash -n izakhono-owned-cloud/configure-izakhono-one-ai.sh
          bash -n izakhono-owned-cloud/preflight-izakhono-one.sh
          bash -n izakhono-gpu-compute-node/install-linux.sh
          bash -n izakhono-model-worker-node/install-linux.sh
          bash -n izakhono-mail-relay-adapter/install-linux.sh
          bash -n izakhono-owned-cloud/activate-owned-public-edge.sh
          bash -n izakhono-owned-cloud/activate-tailscale-funnel.sh
          node --check growth-os-v2/server.mjs
          bash -n izakhono-edge-node/install-linux.sh
          node --check izakhono-edge-node/server.mjs
          node -e 'const x=JSON.parse(require("fs").readFileSync("owner-host/platforms.json","utf8"));if(!x.platforms.some(p=>p.id==="izakhono-domains"&&p.defaultHostname==="domains.izakhonoafrica.co.za"))process.exit(2);if(!x.platforms.some(p=>p.id==="growth-os-v2"&&p.defaultHostname==="growth.domains.izakhonoafrica.co.za"))process.exit(3);if(!x.platforms.some(p=>p.id==="legacymart"&&p.defaultHostname==="market.domains.izakhonoafrica.co.za"))process.exit(4);if(!x.platforms.some(p=>p.id==="creative-suite"&&p.defaultHostname==="creative.domains.izakhonoafrica.co.za"))process.exit(5);if(!x.platforms.some(p=>p.id==="izakhono-one-ai"&&p.defaultHostname==="one.domains.izakhonoafrica.co.za"))process.exit(6)'
          PORT=13000 HOST=127.0.0.1 node growth-os-v2/server.mjs >/tmp/growth-os-v2.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:13000/health >/tmp/growth-health.json && break; sleep .25; done
          node -e 'const x=require("/tmp/growth-health.json");if(x.ok!==true||x.service!=="growth-os-v2")process.exit(2)'
          curl -fsS http://127.0.0.1:13000/ | grep -q 'IZAKHONO GROWTH OS'
      - name: Run existing EDGE and FORTRESS self-test
        working-directory: izakhono-edge-node
        run: npm run check
      - name: Verify tunnel safety contract
        run: |
          grep -q 'TUNNEL_HOST.*127.0.0.1' izakhono-edge-node/server.mjs
          grep -q 'IZAKHONO_EDGE_MODE=tunnel' owner-host/bootstrap-linux.sh
          grep -q 'token-file /etc/izakhono/cloudflare-tunnel.token' owner-host/install-cloudflare-tunnel.sh
          ! grep -R -E 'eyJ[a-zA-Z0-9_-]{30,}' owner-host
          grep -q 'FORTRESS_PROTECTOR_MODE=active' izakhono-edge-node/install-linux.sh
          grep -q 'SOURCE=IZAKHONO_CODE' izakhono-owned-cloud/deploy-izakhono-domains.sh
          grep -q 'IZAKHONO_PACKAGE_NODE' izakhono-owned-cloud/deploy-growth-os-v2.sh
          grep -q 'growth.domains.izakhonoafrica.co.za' izakhono-owned-cloud/activate-owned-public-edge.sh
          grep -q 'IZAKHONO_PUBLIC_EXTRA_HOSTS' izakhono-owned-cloud/activate-owned-public-edge.sh
          grep -q 'IZAKHONO_EDGE_MODE=hybrid' izakhono-owned-cloud/activate-owned-public-edge.sh
          grep -q 'GROWTH_OS_V2=DEPLOYED_TO_IZAKHONO_RUNTIME' izakhono-owned-cloud/deploy-primary-node.sh
          grep -q 'IZAKHONO_AUTH_PUBLIC_SIGNUP' izakhono-owned-cloud/configure-izakhono-one-ai.sh
          grep -q 'IZAKHONO_EMAIL_ADAPTER_URL' izakhono-owned-cloud/configure-izakhono-one-ai.sh
          grep -q 'izakhono-mail-relay' izakhono-owned-cloud/configure-izakhono-one-ai.sh
          grep -q 'IZAKHONO_ONE_CHAT_READY' izakhono-owned-cloud/configure-izakhono-one-ai.sh
          grep -q 'sellable-gate-ready-for-final-commercial-review' izakhono-owned-cloud/deploy-izakhono-one-ai.sh
          grep -q 'izakhono.one-deployment-readiness/v1' izakhono-owned-cloud/preflight-izakhono-one.sh
          grep -q 'GO_TECHNICAL_RUNTIME_ONLY' izakhono-owned-cloud/preflight-izakhono-one.sh
          grep -q 'GO_PUBLIC_PILOT' izakhono-owned-cloud/preflight-izakhono-one.sh
          grep -q 'GO_COMMERCIAL' izakhono-owned-cloud/preflight-izakhono-one.sh
          grep -q '127.0.0.1:$ENGINE_PORT:11434' izakhono-owned-cloud/activate-local-model-engine.sh
          grep -q 'IZAKHONO_MODEL_WORKER_MODELS' izakhono-owned-cloud/activate-local-model-engine.sh
          grep -q 'configure-izakhono-one-ai.sh' izakhono-owned-cloud/activate-local-model-engine.sh
          grep -q 'deploy-izakhono-one-ai.sh main' izakhono-owned-cloud/activate-local-model-engine.sh
          ! grep -q -- '--privileged' izakhono-owned-cloud/activate-local-model-engine.sh
          node -e 'const x=JSON.parse(require("fs").readFileSync("owner-host/control/desired-state.json","utf8")); const ok=new Set(["activate-one-local-model","configure-one-ai","deploy-one-ai","verify-one-ai","deploy-yhvh-gospel-tv","deploy-growth-os-bridge"]); if(!x.id||!ok.has(x.action)||typeof x.enabled!=="boolean")process.exit(2); if(x.params?.hostname&&!String(x.params.hostname).endsWith(".izakhonoafrica.co.za"))process.exit(3)'
          grep -q 'const allowed=new Set(\["activate-one-local-model","configure-one-ai","deploy-one-ai","verify-one-ai","deploy-yhvh-gospel-tv","deploy-growth-os-bridge"\])' owner-host/owner-agent.sh
          grep -q 'deploy-growth-os-bridge)' owner-host/owner-agent.sh
          grep -q 'izakhono-growth-bridge-node/install-linux.sh' owner-host/owner-agent.sh
          grep -q 'start-growth-os-outbound-bridge.sh' owner-host/owner-agent.sh
          grep -q 'deploy-yhvh-gospel-tv)' owner-host/owner-agent.sh
          grep -q 'deploy-yhvh-gospel-tv.sh' owner-host/owner-agent.sh
          grep -q 'yhvh-owner-agent-proof.json' owner-host/owner-agent.sh
          grep -q 'izakhono.yhvh-owner-agent-proof/v1' owner-host/owner-agent.sh
          grep -q 'STATUS="waiting-public-dns"' owner-host/owner-agent.sh
          grep -q 'ATTEMPTS="$PREV_ATTEMPTS"' owner-host/owner-agent.sh
          grep -q 'secrets_exposed:false' owner-host/owner-agent.sh
          grep -q 'log_path_exposed:false' owner-host/owner-agent.sh
          ! grep -q 'log_path:log' owner-host/owner-agent.sh
          grep -q 'hostname outside approved IZAKHONO namespace' owner-host/owner-agent.sh
          grep -q 'sync-owner-source.sh' owner-host/owner-agent.sh
          grep -q 'SOURCE_AUTHORITY=IZAKHONO_CODE' owner-host/sync-owner-source.sh
          grep -q 'SOURCE_AUTHORITY=GITHUB_BOOTSTRAP' owner-host/sync-owner-source.sh
          grep -q 'EXTERNAL_REFRESH=IMPORTED_TO_IZAKHONO_CODE' owner-host/sync-owner-source.sh
          grep -q 'BOOTSTRAP_SOURCE=GITHUB' owner-host/sync-owner-source.sh
          grep -q 'sync_owned_code || fail "IZAKHONO CODE refresh succeeded but owned re-sync failed."' owner-host/sync-owner-source.sh
          grep -q 'Refusing non-owned CODE source' owner-host/sync-owner-source.sh
          grep -q 'Refusing unapproved bootstrap origin' owner-host/sync-owner-source.sh
          grep -q 'BOOTSTRAP_SOURCE_TO_IZAKHONO_CODE' owner-host/owner-agent.sh
          grep -q 'OWNED_CODE_ALREADY_AUTHORITATIVE' owner-host/owner-agent.sh
          ! grep -Eq '(^|[^A-Za-z])eval([^A-Za-z]|$)' owner-host/owner-agent.sh
          ! grep -q '"command"' owner-host/control/desired-state.json
          grep -q 'tailscale funnel --bg' izakhono-owned-cloud/activate-tailscale-funnel.sh
          grep -q '/v1/apps/$APP/aliases' izakhono-owned-cloud/activate-tailscale-funnel.sh
          grep -q 'IZAKHONO EDGE -> FORTRESS -> RUNTIME' izakhono-owned-cloud/activate-tailscale-funnel.sh
          grep -q 'REGISTRATION_LIVE' izakhono-owned-cloud/deploy-izakhono-domains.sh
          grep -q 'Checkout safety gate did not fail closed' izakhono-owned-cloud/deploy-izakhono-domains.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse owner-host PowerShell
        shell: pwsh
        run: |
          $paths = @(
            'owner-host/START-IZAKHONO-OWNER-HOST.ps1',
            'owner-host/GET-CRM-OVER-THE-LINE.ps1',
            'owner-host/START-IZAKHONO-DOMAINS-OWNER-HOST.ps1',
            'owner-host/START-GROWTH-OS-V2-ON-IZAKHONO.ps1',
            'owner-host/START-CREATIVE-SUITE-ON-IZAKHONO.ps1',
            'owner-host/START-IZAKHONO-TAILSCALE-BRIDGE.ps1',
            'owner-host/START-IZAKHONO-ONE-AI-LOCAL-MODEL.ps1',
            'owner-host/INSTALL-IZAKHONO-OWNER-AGENT.ps1',
            'owner-host/START-IZAKHONO-ONE-DEPLOYMENT-READINESS.ps1',
            'owner-host/START-IZAKHONO-ONE-OWNED-LAUNCH.ps1',
            'izakhono-cloud/DEPLOY-KORA-ISN-01.ps1',
            'izakhono-cloud/DEPLOY-LEGACYMART-ISN-01.ps1'
          )
          foreach ($path in $paths) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              exit 1
            }
          }
      - name: Verify one-click handoff
        shell: pwsh
        run: |
          $cmd = Get-Content 'START-IZAKHONO-OWNER-HOST.cmd' -Raw
          if ($cmd -notmatch 'START-IZAKHONO-OWNER-HOST.ps1') { throw 'CMD launcher target mismatch' }
          $ps = Get-Content 'owner-host/START-IZAKHONO-OWNER-HOST.ps1' -Raw
          if ($ps -notmatch 'Ubuntu-24.04') { throw 'Ubuntu owner-host target missing' }
          if ($ps -notmatch 'bootstrap-linux.sh') { throw 'Linux bootstrap handoff missing' }
          if ($ps -notmatch 'IZAKHONO-OWNER-HOST-STATUS.txt') { throw 'Owner-host desktop status report missing' }
          if ($ps -notmatch 'growth.domains.izakhonoafrica.co.za') { throw 'Growth OS owned hostname missing from owner launcher' }
          if ($ps -notmatch 'owned_public_edge_state') { throw 'Owned public-edge result handling missing' }
          $crmCmd = Get-Content 'GET-CRM-OVER-THE-LINE.cmd' -Raw
          if ($crmCmd -notmatch 'owner-host/GET-CRM-OVER-THE-LINE.ps1') { throw 'CRM one-click PowerShell handoff missing' }
          $crmPs = Get-Content 'owner-host/GET-CRM-OVER-THE-LINE.ps1' -Raw
          if ($crmPs -notmatch 'deploy-crm-v020.sh') { throw 'CRM allow-listed deployment handoff missing' }
          if ($crmPs -notmatch 'verify-node01.sh') { throw 'CRM owned verification handoff missing' }
          if ($crmPs -notmatch '3d115c5ae5c092beb7011622fdda1534f885e68a') { throw 'CRM required source commit missing' }
          if ($crmPs -notmatch 'PASS_INTERNAL_OWNED') { throw 'CRM internal-owned evidence gate missing' }
          if ($crmPs -notmatch 'public_cutover_performed') { throw 'CRM public-cutover safety check missing' }
          if ($crmPs -notmatch 'CRM direct public exposure: NO') { throw 'CRM direct-public prohibition missing' }
          if ($crmPs -notmatch 'APP FABRIC public intake: FAIL-CLOSED') { throw 'APP FABRIC fail-closed status missing' }
          if ($crmPs -notmatch 'IZAKHONO-CRM-V020-GO-LIVE-STATUS.txt') { throw 'CRM desktop go-live receipt missing' }
          if ($crmPs -match 'IZAKHONO_FABRIC_PUBLIC_INTAKE=true') { throw 'CRM one-click launcher must not enable public intake' }
          if ($crmPs -match 'prepare-edge\.sh.+--apply') { throw 'CRM one-click launcher must not perform public EDGE promotion' }
          if ($ps -notmatch 'PARENT_DNS_OR_ROUTER_REQUIRED') { throw 'DNS/router blocker handling missing' }
          if ($ps -notmatch 'TLS_OR_PORTS_REQUIRED') { throw 'TLS/ports blocker handling missing' }
          $domains = Get-Content 'START-IZAKHONO-DOMAINS-OWNER-HOST.cmd' -Raw
          if ($domains -notmatch 'START-IZAKHONO-DOMAINS-OWNER-HOST.ps1') { throw 'Domains PowerShell handoff missing' }
          $domainsPs = Get-Content 'owner-host/START-IZAKHONO-DOMAINS-OWNER-HOST.ps1' -Raw
          if ($domainsPs -notmatch 'Ubuntu-24.04') { throw 'Domains launcher WSL target missing' }
          if ($domainsPs -notmatch 'deploy-izakhono-domains.sh') { throw 'Domains deployment handoff missing' }
          if ($domainsPs -notmatch 'domains.izakhonoafrica.co.za') { throw 'Domains public hostname missing' }
          if ($domainsPs -notmatch 'activate-owned-public-edge.sh') { throw 'Domains owned public-edge handoff missing' }
          if ($domainsPs -notmatch 'IZAKHONO OWNED PUBLIC EDGE: LIVE AND VERIFIED') { throw 'Domains owned public verification gate missing' }
          if ($domainsPs -match 'Cloudflare Tunnel public hostname') { throw 'Domains launcher must prefer IZAKHONO owned public edge' }
          $growth = Get-Content 'START-GROWTH-OS-V2-ON-IZAKHONO.cmd' -Raw
          if ($growth -notmatch 'START-GROWTH-OS-V2-ON-IZAKHONO.ps1') { throw 'Growth OS v2 launcher target mismatch' }
          $growthPs = Get-Content 'owner-host/START-GROWTH-OS-V2-ON-IZAKHONO.ps1' -Raw
          if ($growthPs -notmatch 'deploy-growth-os-v2.sh') { throw 'Growth OS v2 deployment handoff missing' }
          if ($growthPs -notmatch 'growth.domains.izakhonoafrica.co.za') { throw 'Growth OS v2 hostname missing' }
          $creative = Get-Content 'START-CREATIVE-SUITE-ON-IZAKHONO.cmd' -Raw
          if ($creative -notmatch 'START-CREATIVE-SUITE-ON-IZAKHONO.ps1') { throw 'Creative Suite CMD handoff missing' }
          $creativePs = Get-Content 'owner-host/START-CREATIVE-SUITE-ON-IZAKHONO.ps1' -Raw
          if ($creativePs -notmatch 'deploy-creative-suite.sh') { throw 'Creative Suite owned deployment handoff missing' }
          if ($creativePs -notmatch 'creative.domains.izakhonoafrica.co.za') { throw 'Creative Suite owned hostname missing' }
          if ($creativePs -notmatch 'REGISTRATION') { throw 'Creative Suite registration safety reporting missing' }
          if ($creativePs -notmatch 'CHECKOUT') { throw 'Creative Suite checkout safety reporting missing' }
          $tailscale = Get-Content 'START-IZAKHONO-TAILSCALE-BRIDGE.cmd' -Raw
          if ($tailscale -notmatch 'START-IZAKHONO-TAILSCALE-BRIDGE.ps1') { throw 'Tailscale bridge CMD handoff missing' }
          $tailscalePs = Get-Content 'owner-host/START-IZAKHONO-TAILSCALE-BRIDGE.ps1' -Raw
          if ($tailscalePs -notmatch 'tailscale up') { throw 'Tailscale one-time auth handoff missing' }
          if ($tailscalePs -notmatch 'activate-tailscale-funnel.sh') { throw 'Tailscale bridge activation handoff missing' }
          $oneLocal = Get-Content 'START-IZAKHONO-ONE-AI-LOCAL-MODEL.cmd' -Raw
          if ($oneLocal -notmatch 'START-IZAKHONO-ONE-AI-LOCAL-MODEL.ps1') { throw 'ONE AI local-model CMD handoff missing' }
          $oneLocalPs = Get-Content 'owner-host/START-IZAKHONO-ONE-AI-LOCAL-MODEL.ps1' -Raw
          if ($oneLocalPs -notmatch 'Ubuntu-24.04') { throw 'ONE AI local-model WSL target missing' }
          if ($oneLocalPs -notmatch 'activate-local-model-engine.sh') { throw 'ONE AI local-model activation handoff missing' }
          if ($oneLocalPs -notmatch 'IZAKHONO-ONE-LOCAL-MODEL-REPORT.json') { throw 'ONE AI local-model Desktop receipt missing' }
          $ownerAgent = Get-Content 'INSTALL-IZAKHONO-OWNER-AGENT.cmd' -Raw
          if ($ownerAgent -notmatch 'INSTALL-IZAKHONO-OWNER-AGENT.ps1') { throw 'Owner Agent CMD handoff missing' }
          $ownerAgentPs = Get-Content 'owner-host/INSTALL-IZAKHONO-OWNER-AGENT.ps1' -Raw
          if ($ownerAgentPs -notmatch 'New-ScheduledTaskTrigger') { throw 'Owner Agent scheduled trigger missing' }
          if ($ownerAgentPs -notmatch 'owner-agent.sh') { throw 'Owner Agent WSL handoff missing' }
          if ($ownerAgentPs -notmatch 'Arbitrary command execution from the control document: DISABLED') { throw 'Owner Agent trust boundary status missing' }
          $readiness = Get-Content 'START-IZAKHONO-ONE-DEPLOYMENT-READINESS.cmd' -Raw
          if ($readiness -notmatch 'START-IZAKHONO-ONE-DEPLOYMENT-READINESS.ps1') { throw 'Deployment readiness CMD handoff missing' }
          $readinessPs = Get-Content 'owner-host/START-IZAKHONO-ONE-DEPLOYMENT-READINESS.ps1' -Raw
          if ($readinessPs -notmatch 'preflight-izakhono-one.sh') { throw 'Deployment readiness Linux handoff missing' }
          if ($readinessPs -notmatch 'IZAKHONO-ONE-DEPLOYMENT-READINESS.json') { throw 'Deployment readiness JSON Desktop receipt missing' }
          if ($readinessPs -notmatch 'IZAKHONO-ONE-DEPLOYMENT-READINESS.txt') { throw 'Deployment readiness text Desktop receipt missing' }
          $ownedLaunch = Get-Content 'START-IZAKHONO-ONE-OWNED-LAUNCH.cmd' -Raw
          if ($ownedLaunch -notmatch 'START-IZAKHONO-ONE-OWNED-LAUNCH.ps1') { throw 'ONE owned-launch CMD handoff missing' }
          $ownedLaunchPs = Get-Content 'owner-host/START-IZAKHONO-ONE-OWNED-LAUNCH.ps1' -Raw
          if ($ownedLaunchPs -notmatch 'INSTALL-IZAKHONO-OWNER-AGENT.ps1') { throw 'ONE owned-launch Owner Agent step missing' }
          if ($ownedLaunchPs -notmatch 'owner-agent.sh') { throw 'ONE owned-launch Owner Agent execution missing' }
          if ($ownedLaunchPs -match 'START-IZAKHONO-ONE-AI-LOCAL-MODEL.ps1') { throw 'ONE owned-launch must not race the Owner Agent with direct activation' }
          if ($ownedLaunchPs -notmatch 'owner-host/control/one-desired-state.json') { throw 'ONE owned-launch isolated request lookup missing' }
          if ($ownedLaunchPs -notmatch 'expectedRequestId') { throw 'ONE owned-launch dynamic request receipt check missing' }
          if ($ownedLaunchPs -notmatch 'activate-owned-public-edge.sh') { throw 'ONE owned-launch DNS/TLS/EDGE activation missing' }
          if ($ownedLaunchPs -notmatch 'IZAKHONO-ONE-OWNED-EDGE.json') { throw 'ONE owned-launch EDGE/DNS Desktop receipt missing' }
          if ($ownedLaunchPs -notmatch 'PARENT DNS / ROUTER ACTION REQUIRED') { throw 'ONE owned-launch parent DNS safe-hold reporting missing' }
          if ($ownedLaunchPs -notmatch 'START-IZAKHONO-ONE-DEPLOYMENT-READINESS.ps1') { throw 'ONE owned-launch readiness step missing' }
          if ($ownedLaunchPs -notmatch 'IZAKHONO-ONE-OWNED-LAUNCH-STATUS.txt') { throw 'ONE owned-launch Desktop status missing' }
          if ($ownedLaunchPs -notmatch 'External resilience route: PRESERVED / NOT MODIFIED') { throw 'ONE owned-launch resilience-preservation contract missing' }
          if ($ownedLaunchPs -notmatch 'one.domains.izakhonoafrica.co.za') { throw 'ONE owned-launch hostname missing' }
