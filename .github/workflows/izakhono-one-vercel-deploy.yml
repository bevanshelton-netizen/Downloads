name: IZAKHONO ONE Vercel Public Pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'one/**'
      - '.github/workflows/izakhono-one-vercel-deploy.yml'

permissions:
  contents: read

concurrency:
  group: izakhono-one-vercel-public
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: kora-production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_XSHdQaQxmXGD1HlK2E4nehif
      PROJECT_NAME: izakhono-one-public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Vercel credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"

      - name: Build Vercel-safe ONE static root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf one-vercel
          cp -R one one-vercel

          node <<'NODE'
          const fs=require('fs');
          const root='one-vercel';
          const publicUrl='https://izakhono-one-public.vercel.app/';

          let html=fs.readFileSync(root+'/index.html','utf8');
          html=html
            .replaceAll('https://bevanshelton-netizen.github.io/Downloads/one/', publicUrl)
            .replace('<div class="ey">IZAKHONO AFRICA · ONE PUBLIC ENTRY</div>', '<div class="ey">IZAKHONO AFRICA · ONE PUBLIC PILOT</div>');
          fs.writeFileSync(root+'/index.html',html);

          const m=JSON.parse(fs.readFileSync(root+'/manifest.webmanifest','utf8'));
          m.id='/';
          m.start_url='/';
          m.scope='/';
          fs.writeFileSync(root+'/manifest.webmanifest',JSON.stringify(m,null,2)+'\n');

          let sw=fs.readFileSync(root+'/sw.js','utf8');
          sw=sw.replace("!u.pathname.startsWith('/Downloads/one/')", "!u.pathname.startsWith('/')");
          fs.writeFileSync(root+'/sw.js',sw);

          fs.writeFileSync(root+'/sitemap.xml',
            '<?xml version="1.0" encoding="UTF-8"?>\n'+
            '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'+
            '  <url><loc>'+publicUrl+'</loc><changefreq>weekly</changefreq><priority>1.0</priority></url>\n'+
            '</urlset>\n'
          );

          fs.writeFileSync(root+'/robots.txt',
            'User-agent: *\nAllow: /\nSitemap: '+publicUrl+'sitemap.xml\n'
          );

          fs.writeFileSync(root+'/vercel.json', JSON.stringify({
            cleanUrls:true,
            trailingSlash:false,
            headers:[
              {source:'/(.*)',headers:[
                {key:'X-Content-Type-Options',value:'nosniff'},
                {key:'Referrer-Policy',value:'no-referrer'},
                {key:'Permissions-Policy',value:'camera=(), microphone=(), geolocation=()'}
              ]}
            ]
          },null,2)+'\n');
          NODE

          grep -q 'IZAKHONO ONE' one-vercel/index.html
          grep -qi 'no application analytics' one-vercel/index.html
          ! grep -Eqi 'utm_|googletagmanager|google-analytics|facebook[^<]*(pixel|track)|hotjar|clarity\.ms|mixpanel|amplitude|plausible|matomo|portfolio-growth/bridge\.js' one-vercel/index.html

      - name: Create or locate isolated Vercel project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/one-project.json <<JSON
          {
            "name": "$PROJECT_NAME",
            "framework": null
          }
          JSON

          CODE="$(curl -sS -o /tmp/vercel-create.json -w "%{http_code}" \
            -X POST "https://api.vercel.com/v11/projects?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/one-project.json)"

          if [[ "$CODE" =~ ^2 ]]; then
            cp /tmp/vercel-create.json /tmp/vercel-project.json
          elif [ "$CODE" = "409" ]; then
            curl -fsS \
              "https://api.vercel.com/v9/projects/$PROJECT_NAME?teamId=$VERCEL_ORG_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              > /tmp/vercel-project.json
          else
            echo "Vercel project creation failed with HTTP $CODE"
            cat /tmp/vercel-create.json
            exit 1
          fi

          PROJECT_ID="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/vercel-project.json','utf8'));if(!x.id)process.exit(2);process.stdout.write(x.id)")"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "Vercel project: $PROJECT_ID"

      - name: Link ONE public root
        working-directory: one-vercel
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          mkdir -p .vercel
          node -e "require('fs').writeFileSync('.vercel/project.json',JSON.stringify({orgId:process.env.VERCEL_ORG_ID,projectId:process.env.PROJECT_ID,projectName:process.env.PROJECT_NAME}))"

      - name: Pull project settings
        working-directory: one-vercel
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        working-directory: one-vercel
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        id: deploy
        working-directory: one-vercel
        run: |
          set -euo pipefail
          URL="$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n 1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "IZAKHONO ONE public pilot URL: $URL"

      - name: Verify public pilot contract
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            code="$(curl -sSL --max-time 15 -o /tmp/one.html -w '%{http_code}' "$URL/" || true)"
            [ "$code" = "200" ] && break
            sleep 3
          done
          test "$code" = "200"
          grep -q 'IZAKHONO ONE' /tmp/one.html
          grep -qi 'no application analytics' /tmp/one.html
          grep -q 'izakhono-one-control' /tmp/one.html
          grep -q 'izakhono-one-device-ai' /tmp/one.html
          ! grep -Eqi 'utm_|googletagmanager|google-analytics|facebook[^<]*(pixel|track)|hotjar|clarity\.ms|mixpanel|amplitude|plausible|matomo|portfolio-growth/bridge\.js' /tmp/one.html

          curl -fsS "$URL/manifest.webmanifest" -o /tmp/manifest.json
          node -e "const m=require('/tmp/manifest.json');if(m.name!=='IZAKHONO ONE'||m.start_url!=='/'||m.scope!=='/')process.exit(1)"
          curl -fsS "$URL/sw.js" | grep -q "izakhono-one-shell-v1"
          curl -fsS "$URL/offline.html" | grep -q "No workspace credentials are cached"
          curl -fsS "$URL/robots.txt" | grep -q "Sitemap:"
          curl -fsS "$URL/sitemap.xml" | grep -q "izakhono-one-public.vercel.app"

          echo "IZAKHONO ONE VERCEL PUBLIC PILOT: VERIFIED"

      - name: Publish deployment summary
        env:
          URL: ${{ steps.deploy.outputs.url }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          {
            echo "## IZAKHONO ONE Deploy Result"
            echo "- URL: $URL"
            echo "- Target: production"
            echo "- Vercel project: $PROJECT_ID"
            echo "- Commit: ${GITHUB_SHA::7}"
            echo "- Public pilot shell: VERIFIED"
            echo "- Privacy contract: VERIFIED"
            echo "- Owned authority: NODE 01 (unchanged)"
            echo "- Owned .co.za route: still separately gated by parent DNS"
          } >> "$GITHUB_STEP_SUMMARY"
