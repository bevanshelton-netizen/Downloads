name: Build KORA Creator Welcome Video

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kora-creator-welcome-video.yml
      - kora-network/public/media/kora-creator-welcome.mp4.b64

permissions:
  contents: write

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build MP4 from packaged asset
        run: |
          set -e
          mkdir -p kora-network/public/media
          base64 -d kora-network/public/media/kora-creator-welcome.mp4.b64 > kora-network/public/media/kora-creator-welcome.mp4
          test -s kora-network/public/media/kora-creator-welcome.mp4
          rm kora-network/public/media/kora-creator-welcome.mp4.b64
      - name: Commit MP4
        run: |
          git config user.name "KORA Build Worker"
          git config user.email "actions@users.noreply.github.com"
          git add kora-network/public/media/kora-creator-welcome.mp4 kora-network/public/media/kora-creator-welcome.mp4.b64
          git commit -m "Add KORA Creator Welcome video asset" || exit 0
          git push origin HEAD:main
