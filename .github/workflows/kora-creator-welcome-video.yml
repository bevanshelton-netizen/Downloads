name: Build KORA Creator Welcome Video

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kora-creator-welcome-video.yml

permissions:
  contents: write

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak
      - name: Render MP4
        run: |
          set -e
          mkdir -p kora-network/public/media
          SCRIPT="Welcome to KORA. KORA is a creator-first African media and digital platform built to connect stories, talent, audiences and opportunity. We give creators a home to publish, grow audiences and showcase their work. Your creativity can be discovered, heard and valued. Create, publish, connect and grow. Bring your culture, your voice and your original ideas to the world. KORA. Africa to the World. Your story belongs here."
          espeak -s 155 -v en -w /tmp/kora-voice.wav "$SCRIPT"
          ffmpeg -y -f lavfi -i "color=c=0x08080a:s=640x360:r=30:d=45" -i /tmp/kora-voice.wav -vf "drawbox=x=0:y=0:w=8:h=360:color=0xD4AA4A:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='KORA':x=40:y=35:fontsize=32:fontcolor=0xD4AA4A,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='WELCOME TO KORA':x=40:y=125:fontsize=38:fontcolor=white,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Who we are | What we do | What it means for creators':x=40:y=190:fontsize=17:fontcolor=0xB9B9BE,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Africa to the World':x=40:y=245:fontsize=24:fontcolor=0xD4AA4A,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='KORA CREATOR ECOSYSTEM':x=40:y=315:fontsize=13:fontcolor=0x8A8A90" -t 45 -c:v libx264 -preset medium -crf 28 -pix_fmt yuv420p -c:a aac -b:a 48k -ac 1 -shortest kora-network/public/media/kora-creator-welcome.mp4
          test -s kora-network/public/media/kora-creator-welcome.mp4
      - name: Commit generated MP4
        run: |
          git config user.name "KORA Build Worker"
          git config user.email "actions@users.noreply.github.com"
          git add kora-network/public/media/kora-creator-welcome.mp4
          git commit -m "Add KORA Creator Welcome video asset"
          git push origin HEAD:main
