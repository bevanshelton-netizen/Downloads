name: YHVH GOSPEL TV Gate
# YHVH standalone identity gate v2

on:
  pull_request:
    paths:
      - "ports/kora-gospel-tv/**"
      - "engines/yhvh-gospel-engine/**"
      - "izakhono-owned-cloud/install-yhvh-gospel-engine.sh"
      - "tests/yhvh-gospel-engine-test.mjs"
      - "owner-host/INSTALL-YHVH-GOSPEL-ENGINE.ps1"
      - "INSTALL-YHVH-GOSPEL-ENGINE.cmd"
      - "izakhono-owned-cloud/deploy-kora-gospel-tv.sh"
      - "izakhono-owned-cloud/start-yhvh-outbound-bridge.sh"
      - "owner-host/GET-YHVH-GOSPEL-TV-OVER-THE-LINE.ps1"
      - "owner-host/owner-agent.sh"
      - "owner-host/control/desired-state.json"
      - "GET-YHVH-GOSPEL-TV-OVER-THE-LINE.cmd"
      - "GO-LIVE-YHVH-GOSPEL-TV-ON-IZAKHONO.cmd"
      - "owner-host/START-KORA-GOSPEL-TV-ON-IZAKHONO.ps1"
      - "START-KORA-GOSPEL-TV-ON-IZAKHONO.cmd"
      - "kora-gospel-tv/**"
      - "izakhono-owned-cloud/kora-gospel-tv-simulcast.sh"
      - "izakhono-owned-cloud/kora-gospel-tv-simulcast.env.example"
      - "izakhono-owned-cloud/reconcile-kora-gospel-intake.mjs"
      - "izakhono-owned-cloud/kora-gospel-external.env.example"
      - "izakhono-owned-cloud/install-kora-gospel-reconciler.sh"
      - "tests/kora-gospel-reconciler-test.mjs"
      - "owner-host/INSTALL-KORA-GOSPEL-RECONCILIATION.ps1"
      - "INSTALL-KORA-GOSPEL-RECONCILIATION.cmd"
      - "kora-network/app/gospel/**"
      - "kora-network/public/gospel-syndication.json"
      - "kora-network/public/gospel-global.json"
      - "kora-network/public/gospel-commercial.json"
      - "kora-network/public/gospel-hybrid-gateway.json"
      - "ports/kora-gospel-tv/WORLDWIDE.md"
      - ".github/workflows/kora-gospel-tv.yml"
  push:
    branches: [main]
    paths:
      - "ports/kora-gospel-tv/**"
      - "engines/yhvh-gospel-engine/**"
      - "izakhono-owned-cloud/install-yhvh-gospel-engine.sh"
      - "tests/yhvh-gospel-engine-test.mjs"
      - "owner-host/INSTALL-YHVH-GOSPEL-ENGINE.ps1"
      - "INSTALL-YHVH-GOSPEL-ENGINE.cmd"
      - "izakhono-owned-cloud/deploy-kora-gospel-tv.sh"
      - "izakhono-owned-cloud/start-yhvh-outbound-bridge.sh"
      - "owner-host/GET-YHVH-GOSPEL-TV-OVER-THE-LINE.ps1"
      - "owner-host/owner-agent.sh"
      - "owner-host/control/desired-state.json"
      - "GET-YHVH-GOSPEL-TV-OVER-THE-LINE.cmd"
      - "GO-LIVE-YHVH-GOSPEL-TV-ON-IZAKHONO.cmd"
      - "owner-host/START-KORA-GOSPEL-TV-ON-IZAKHONO.ps1"
      - "START-KORA-GOSPEL-TV-ON-IZAKHONO.cmd"
      - "kora-gospel-tv/**"
      - ".github/workflows/kora-gospel-tv.yml"

permissions:
  contents: read

jobs:
  prove-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate runtime syntax
        run: |
          node --check ports/kora-gospel-tv/server.mjs
          node --check engines/yhvh-gospel-engine/engine.mjs
          node --check tests/yhvh-gospel-engine-test.mjs
          bash -n izakhono-owned-cloud/install-yhvh-gospel-engine.sh
          grep -q 'YHVH_GOSPEL_ENGINE_TOKEN=REPLACE-WITH-32-PLUS-CHARACTER-OWNER-TOKEN' engines/yhvh-gospel-engine/yhvh-gospel-engine.env.example
          grep -q 'openssl rand -hex 32' izakhono-owned-cloud/install-yhvh-gospel-engine.sh
          grep -q 'VERSION="2.0.0"' engines/yhvh-gospel-engine/engine.mjs
          grep -q 'content-submissions' engines/yhvh-gospel-engine/engine.mjs
          grep -q 'simulcast-state' engines/yhvh-gospel-engine/engine.mjs
          grep -q 'behavioural_tracking:false' engines/yhvh-gospel-engine/engine.mjs
          grep -q 'YHVH_GOSPEL_ENGINE_TOKEN' izakhono-owned-cloud/deploy-kora-gospel-tv.sh
          grep -q 'independent_engine' izakhono-owned-cloud/deploy-kora-gospel-tv.sh
          grep -q 'install-yhvh-gospel-engine.sh' izakhono-owned-cloud/deploy-kora-gospel-tv.sh
          bash -n izakhono-owned-cloud/deploy-kora-gospel-tv.sh
          bash -n izakhono-owned-cloud/start-yhvh-outbound-bridge.sh
          grep -q "authoritative_origin:\"IZAKHONO\"" izakhono-owned-cloud/start-yhvh-outbound-bridge.sh
          grep -q "inbound_port_forwarding_required:false" izakhono-owned-cloud/start-yhvh-outbound-bridge.sh
          grep -q "GET-YHVH-GOSPEL-TV-OVER-THE-LINE.ps1" GO-LIVE-YHVH-GOSPEL-TV-ON-IZAKHONO.cmd
          bash -n izakhono-owned-cloud/kora-gospel-tv-simulcast.sh
          bash -n izakhono-owned-cloud/install-kora-gospel-reconciler.sh
          node --check izakhono-owned-cloud/reconcile-kora-gospel-intake.mjs
          node --check tests/kora-gospel-reconciler-test.mjs
          ! grep -R --line-number -E '(stream[_ -]?key|secret).{0,20}(=|:).{3,}' izakhono-owned-cloud/kora-gospel-tv-simulcast.env.example | grep -v 'REPLACE-WITH'
          grep -q 'SUPABASE_SECRET_KEY=REPLACE-WITH-DEDICATED-SB-SECRET-KEY' izakhono-owned-cloud/kora-gospel-external.env.example
          ! grep -R --line-number 'sb_secret_' izakhono-owned-cloud tests owner-host INSTALL-KORA-GOSPEL-RECONCILIATION.cmd | grep -v 'sb_secret_ci_test_only'
          grep -q '"authoritative_origin": "IZAKHONO"' kora-network/public/gospel-global.json
          grep -q '"name": "Europe"' kora-network/public/gospel-global.json
          grep -q '"name": "Spanish"' kora-network/public/gospel-global.json
          grep -q '"id": "supabase-intake-buffer"' kora-network/public/gospel-syndication.json
          grep -q 'yfawrenhudjomhnglfhq.supabase.co/functions/v1/kora-gospel-intake' kora-network/public/gospel-syndication.json
          grep -q '"pricing_mode": "proposal-based"' kora-network/public/gospel-commercial.json
          grep -q '"editorial_independence": true' kora-network/public/gospel-commercial.json
          grep -q '"policy": "owned-first-external-fallback"' kora-network/public/gospel-hybrid-gateway.json
          grep -q '"global_front_door": "/gospel/live"' kora-network/public/gospel-hybrid-gateway.json
          grep -q "kora-gospel-hybrid-gateway" kora-network/app/api/gospel/hybrid-status/route.ts

      - name: Prove independent YHVH Gospel Engine
        run: |
          node tests/yhvh-gospel-engine-test.mjs

      - name: Start isolated Gospel TV runtime
        run: |
          mkdir -p "$RUNNER_TEMP/kora-gospel-tv" "$RUNNER_TEMP/yhvh-gospel-engine"
          HOST=127.0.0.1 PORT=8892 YHVH_GOSPEL_ENGINE_TOKEN="ci-owner-engine-token-1234567890" YHVH_GOSPEL_ENGINE_DATA_DIR="$RUNNER_TEMP/yhvh-gospel-engine" node engines/yhvh-gospel-engine/engine.mjs >"$RUNNER_TEMP/yhvh-gospel-engine.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/yhvh-gospel-engine.pid"
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8892/health && break
            sleep 0.25
          done
          cat > "$RUNNER_TEMP/reconcile-receipt.json" <<'JSON'
          {"authority":"IZAKHONO","source_authoritative":false,"worker":"ci-reconciler","scanned":3,"imported":2,"duplicates":1,"failed":0,"completed_at":"2026-09-22T08:30:00Z"}
          JSON
          cat > "$RUNNER_TEMP/yhvh-deployment-receipt.json" <<'JSON'
          {"schema":"izakhono.yhvh-gospel-tv-deployment/v2","product":"YHVH GOSPEL TV","product_id":"yhvh-gospel-tv","legacy_runtime_id":"kora-gospel-tv","engine_id":"yhvh-gospel-engine","engine_authoritative":true,"hostname":"gospel.domains.izakhonoafrica.co.za","revision":"ci-revision","source":"IZAKHONO_CODE","runtime":"IZAKHONO_RUNTIME","edge":"VERIFIED","engine":"VERIFIED_V2_INDEPENDENT","public_https":"VERIFIED","generated_at":"2026-09-25T10:00:00Z"}
          JSON
          cat > "$RUNNER_TEMP/yhvh-owner-agent-proof.json" <<'JSON'
          {"schema":"izakhono.yhvh-owner-agent-proof/v1","product_id":"yhvh-gospel-tv","engine_id":"yhvh-gospel-engine","request_id":"ci-yhvh-owner-proof","action":"deploy-yhvh-gospel-tv","status":"success","attempts":1,"exit_code":0,"source_commit":"ci-revision","source_authority":"IZAKHONO_CODE","started_at":"2026-09-25T09:59:00Z","ended_at":"2026-09-25T10:00:00Z","secrets_exposed":false,"log_path_exposed":false}
          JSON
          GOSPEL_TV_DATA_DIR="$RUNNER_TEMP/kora-gospel-tv" GOSPEL_TV_CONTROL_TOKEN="ci-owner-control-token-1234567890" YHVH_GOSPEL_ENGINE_TOKEN="ci-owner-engine-token-1234567890" YHVH_GOSPEL_ENGINE_URL="http://127.0.0.1:8892" GOSPEL_RECONCILE_RECEIPT="$RUNNER_TEMP/reconcile-receipt.json" YHVH_DEPLOYMENT_RECEIPT="$RUNNER_TEMP/yhvh-deployment-receipt.json" YHVH_OWNER_AGENT_PROOF="$RUNNER_TEMP/yhvh-owner-agent-proof.json" HOST=127.0.0.1 PORT=8188 node ports/kora-gospel-tv/server.mjs >"$RUNNER_TEMP/kora-gospel-tv.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/kora-gospel-tv.pid"
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8188/health && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/kora-gospel-tv.log"
          exit 1

      - name: Verify channel experience
        run: |
          curl -fsS http://127.0.0.1:8188/ | grep -q "YHVH GOSPEL TV"
          curl -fsS http://127.0.0.1:8188/ | grep -q "GOSPEL ONLY"
          curl -fsS http://127.0.0.1:8188/api/channel | grep -q '"mode":"scheduled"'
          curl -fsS http://127.0.0.1:8188/api/channel | grep -q '"policy":"owned-primary-external-distribution"'
          curl -fsS http://127.0.0.1:8188/api/channel | grep -q '"provider":"Vercel"'
          curl -fsS http://127.0.0.1:8188/api/channel | grep -q '"engine":{"available":true'
          curl -fsS http://127.0.0.1:8188/api/channel | grep -q '"title":"'
          curl -fsS http://127.0.0.1:8188/api/control/status -H 'authorization: Bearer ci-owner-control-token-1234567890' | grep -q '"engine":{"available":true'
          DEPLOYMENT="$(curl -fsS http://127.0.0.1:8188/api/deployment/status)"
          echo "$DEPLOYMENT" | grep -q '"request_id":"ci-yhvh-owner-proof"'
          echo "$DEPLOYMENT" | grep -q '"source_authority":"IZAKHONO_CODE"'
          echo "$DEPLOYMENT" | grep -q '"secrets_exposed":false'
          echo "$DEPLOYMENT" | grep -q '"log_path_exposed":false'

      - name: Verify web survives engine outage
        run: |
          kill "$(cat "$RUNNER_TEMP/yhvh-gospel-engine.pid")"
          for i in {1..20}; do
            RESPONSE="$(curl -fsS http://127.0.0.1:8188/api/channel)"
            if echo "$RESPONSE" | grep -q '"engine":{"available":false'; then
              echo "$RESPONSE" | grep -Eq '"mode":"(launch-mode|live-feed)"'
              break
            fi
            sleep 0.1
          done
          grep -q '"engine":{"available":false' < <(curl -fsS http://127.0.0.1:8188/api/channel)
          rm -f "$RUNNER_TEMP/yhvh-gospel-engine.pid"

      - name: Verify owner control room boundary
        run: |
          test "$(curl -sS -o /tmp/control-noauth.json -w '%{http_code}' http://127.0.0.1:8188/api/control/status)" = "401"
          grep -q '"error":"Owner authorization required."' /tmp/control-noauth.json
          curl -fsS http://127.0.0.1:8188/api/control/status             -H 'authorization: Bearer ci-owner-control-token-1234567890' | tee /tmp/control-status.json | grep -q '"service":"kora-gospel-tv-control"'
          grep -q '"sponsorship_inventory"' /tmp/control-status.json
          grep -q '"rights_workflow"' /tmp/control-status.json
          grep -q '"reconciliation"' /tmp/control-status.json
          grep -q '"imported":2' /tmp/control-status.json
          grep -q '"duplicates":1' /tmp/control-status.json
          curl -fsS http://127.0.0.1:8188/control.html | grep -q "GOSPEL TV"
          ! grep -R "ci-owner-control-token-1234567890" ports/kora-gospel-tv/control.html ports/kora-gospel-tv/control-room.json

      - name: Restore owned YHVH Gospel Engine after outage proof
        run: |
          HOST=127.0.0.1 PORT=8892 YHVH_GOSPEL_ENGINE_TOKEN="ci-owner-engine-token-1234567890" YHVH_GOSPEL_ENGINE_DATA_DIR="$RUNNER_TEMP/yhvh-gospel-engine" node engines/yhvh-gospel-engine/engine.mjs >"$RUNNER_TEMP/yhvh-gospel-engine.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/yhvh-gospel-engine.pid"
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8892/health && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/yhvh-gospel-engine.log"
          exit 1

      - name: Verify owned cross-origin intake
        run: |
          test "$(curl -sS -o /tmp/preflight.txt -D /tmp/preflight.headers -w '%{http_code}' -X OPTIONS http://127.0.0.1:8188/api/submissions -H 'origin: https://kora-network.vercel.app' -H 'access-control-request-method: POST' -H 'access-control-request-headers: content-type')" = "204"
          grep -qi 'access-control-allow-origin: https://kora-network.vercel.app' /tmp/preflight.headers
          RESPONSE="$(curl -fsS -X POST http://127.0.0.1:8188/api/submissions -H 'origin: https://kora-network.vercel.app' -H 'content-type: application/json' --data '{"category":"partner","type":"distribution","name":"YHVH CI","contact":"ci@example.invalid","message":"Cross-origin owned intake test","territory":"Global","language":"English","sourceChannel":"yhvh-ci"}')"
          echo "$RESPONSE" | grep -q '"route":"izakhono-owned"'
          echo "$RESPONSE" | grep -q '"engine_route":"yhvh-owned-engine"'
          ENGINE_QUEUE="$(curl -fsS 'http://127.0.0.1:8892/v1/submissions?limit=5' -H 'authorization: Bearer ci-owner-engine-token-1234567890')"
          echo "$ENGINE_QUEUE" | grep -q '"territory":"Global"'
          echo "$ENGINE_QUEUE" | grep -q '"source_channel":"yhvh-ci"'
          RESPONSE="$(curl -fsS -X POST http://127.0.0.1:8188/api/submissions -H 'origin: https://kora-network.vercel.app' -H 'content-type: application/json' --data '{"category":"partner","type":"sponsor","name":"Commercial CI","contact":"ci@example.invalid","message":"Commercial desk test","details":{"package":"programme-sponsor","budget":"quote-request"}}')"
          echo "$RESPONSE" | grep -q '"route":"izakhono-owned"'
          echo "$RESPONSE" | grep -q '"engine_route":"yhvh-owned-engine"'
          curl -fsS 'http://127.0.0.1:8892/v1/submissions?limit=5' -H 'authorization: Bearer ci-owner-engine-token-1234567890' | grep -q '"package":"programme-sponsor"'

      - name: Verify safe submission path
        run: |
          RESPONSE="$(curl -fsS -X POST http://127.0.0.1:8188/api/submissions             -H 'content-type: application/json'             --data '{"category":"prayer","message":"Please pray for our community","onAir":false}')"
          echo "$RESPONSE" | grep -q '"ok":true'
          echo "$RESPONSE" | grep -q '"engine_route":"yhvh-owned-engine"'
          curl -fsS 'http://127.0.0.1:8892/v1/submissions?limit=5' -H 'authorization: Bearer ci-owner-engine-token-1234567890' | grep -q '"category":"prayer"'
          curl -fsS 'http://127.0.0.1:8892/v1/submissions?limit=5' -H 'authorization: Bearer ci-owner-engine-token-1234567890' | grep -q '"on_air":false'
          curl -fsS 'http://127.0.0.1:8188/api/control/submissions?limit=5' -H 'authorization: Bearer ci-owner-control-token-1234567890' | grep -q '"category":"prayer"'

      - name: Prove external intake reconciliation
        run: |
          node tests/kora-gospel-reconciler-test.mjs

      - name: Stop runtime
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/kora-gospel-tv.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/kora-gospel-tv.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/yhvh-gospel-engine.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/yhvh-gospel-engine.pid")" 2>/dev/null || true
          fi
