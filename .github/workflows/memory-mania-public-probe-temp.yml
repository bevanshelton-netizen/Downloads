name: Memory Mania Public Internet Probe
on:
  push:
    branches: [diag/memory-mania-public-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe parent and Memory Mania DNS
        shell: bash
        run: |
          set +e
          echo "=== resolv.conf ==="
          cat /etc/resolv.conf
          echo "=== parent root domain ==="
          getent ahostsv4 izakhonoafrica.co.za || true
          echo "=== owned zone ==="
          getent ahostsv4 domains.izakhonoafrica.co.za || true
          echo "=== owned nameserver ==="
          getent ahostsv4 ns1.izakhonoafrica.co.za || true
          echo "=== memory mania ==="
          getent ahostsv4 memorymania.domains.izakhonoafrica.co.za || true
          python3 - <<'PY'
          import socket
          for h in [
            "izakhonoafrica.co.za",
            "domains.izakhonoafrica.co.za",
            "ns1.izakhonoafrica.co.za",
            "memorymania.domains.izakhonoafrica.co.za",
          ]:
              try:
                  print("RESOLVE", h, sorted({x[4][0] for x in socket.getaddrinfo(h,443,type=socket.SOCK_STREAM)}))
              except Exception as e:
                  print("RESOLVE_FAIL", h, repr(e))
          PY
      - name: Query CO.ZA registry WHOIS
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          host="coza-whois.registry.net.za"
          query="izakhonoafrica.co.za\r\n".encode()
          try:
              with socket.create_connection((host,43),timeout=10) as s:
                  s.sendall(query)
                  out=b""
                  while True:
                      c=s.recv(65536)
                      if not c: break
                      out+=c
              print(out.decode("utf-8","replace")[:20000])
          except Exception as e:
              print("WHOIS_FAIL",repr(e))
          PY
      - name: Probe alternative owned domains
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          domains=[
            "izakhono.co.za",
            "faisready.co.za",
            "doxahosting.co.za",
            "edubuildshelton.org.za",
          ]
          for h in domains:
              try:
                  print("ALT_RESOLVE",h,sorted({x[4][0] for x in socket.getaddrinfo(h,443,type=socket.SOCK_STREAM)}))
              except Exception as e:
                  print("ALT_RESOLVE_FAIL",h,repr(e))
          def whois(server,name):
              try:
                  with socket.create_connection((server,43),timeout=10) as s:
                      s.sendall((name+"\r\n").encode())
                      out=b""
                      while True:
                          c=s.recv(65536)
                          if not c: break
                          out+=c
                  text=out.decode("utf-8","replace")
                  print("\nWHOIS",name,"\n",text[:8000])
              except Exception as e:
                  print("WHOIS_FAIL",name,repr(e))
          for d in ["izakhono.co.za","faisready.co.za","doxahosting.co.za"]:
              whois("coza-whois.registry.net.za",d)
          whois("org-whois.registry.net.za","edubuildshelton.org.za")
          PY
      - name: Probe zero-cost Pages bridge
        shell: bash
        run: |
          set +e
          echo "=== GitHub Pages bridge ==="
          curl -sSIL --max-time 15 https://bevanshelton-netizen.github.io/Downloads/memory-mania/public/ || true
          echo "=== Content marker ==="
          curl -sSL --max-time 15 https://bevanshelton-netizen.github.io/Downloads/memory-mania/public/ | grep -E -m1 'MEMORY|Memory Mania' || true
      - name: Probe HTTPS
        shell: bash
        run: |
          set +e
          echo "=== zone health ==="
          curl -sv --max-time 10 https://domains.izakhonoafrica.co.za/health -o /tmp/zone.out 2>&1
          cat /tmp/zone.out 2>/dev/null || true
          echo "=== memory mania health ==="
          curl -sv --max-time 10 https://memorymania.domains.izakhonoafrica.co.za/health -o /tmp/mm.out 2>&1
          cat /tmp/mm.out 2>/dev/null || true
