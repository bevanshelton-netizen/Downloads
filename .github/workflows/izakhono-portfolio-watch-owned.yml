name: IZAKHONO Portfolio Watch Owned Activation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'izakhono-portfolio-watch/**'
      - '.github/workflows/izakhono-portfolio-watch-owned.yml'

permissions:
  contents: read

concurrency:
  group: izakhono-portfolio-watch-owned
  cancel-in-progress: true

jobs:
  package-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify portable owned-node package
        working-directory: izakhono-portfolio-watch
        run: |
          python3 -m py_compile app.py test_watch.py
          python3 -m unittest -v test_watch.py
          docker build -t izakhono-portfolio-watch:ci .
          echo 'Portfolio Watch package is ready for NODE01 activation.'

  deploy-owned:
    if: github.event_name == 'workflow_dispatch'
    needs: package-and-verify
    runs-on: [self-hosted, linux, x64, izakhono, izakhono-infrastructure]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install on IZAKHONO owned node
        working-directory: izakhono-portfolio-watch
        run: sudo bash install-linux.sh
      - name: Verify owned-node service
        run: |
          curl -fsS http://127.0.0.1:8860/health >/tmp/portfolio-watch-health.json
          python3 - <<'PY'
          import json
          x=json.load(open("/tmp/portfolio-watch-health.json"))
          assert x["ok"] is True
          assert x["service"] == "izakhono-portfolio-watch"
          assert x["workers"] >= 1
          print(json.dumps(x, indent=2))
          PY
