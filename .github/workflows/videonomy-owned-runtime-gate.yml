name: VIDEONOMY IZAKHONO Owned Runtime Gate

on:
  push:
    branches: [videonomy-production]
    paths:
      - "owned/**"
      - "src/**"
      - "migrations/**"
      - ".github/workflows/videonomy-owned-runtime-gate.yml"

permissions:
  contents: read

jobs:
  owned-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - name: Validate owned deployment adapter
        run: |
          bash -n owned/deploy-to-izakhono-runtime.sh
          node --check owned/server.mjs
          node -e "const p=require('./owned/package.json'); if(!p.dependencies['better-sqlite3']||!p.dependencies.tsx) process.exit(1)"
      - name: Install owned runtime dependencies
        run: npm --prefix owned install --no-audit --no-fund
      - name: Run owned engine smoke test
        run: bash scripts/owned-smoke.sh

  windows-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse and exercise secure Windows bootstrap
        shell: pwsh
        run: |
          $scriptPath = (Resolve-Path 'owned/prepare-windows-env.ps1').Path
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }

          $envPath = Join-Path (Resolve-Path 'owned').Path '.env'
          try {
            & $scriptPath -PublicBaseUrl 'https://videonomy.izakhonoafrica.co.za'
            if (-not (Test-Path $envPath)) { throw 'Bootstrap did not create owned/.env' }
            $values = @{}
            Get-Content $envPath | ForEach-Object {
              $pair = $_ -split '=', 2
              if ($pair.Count -eq 2) { $values[$pair[0]] = $pair[1] }
            }
            foreach ($key in @('ADMIN_SECRET','ABUSE_SALT')) {
              if (-not $values[$key] -or $values[$key].Length -lt 32) { throw "$key missing or too short" }
            }
            if ($values['ADMIN_SECRET'] -eq $values['ABUSE_SALT']) { throw 'Application secrets must be distinct' }
            if ($values['PUBLIC_BASE_URL'] -ne 'https://videonomy.izakhonoafrica.co.za') { throw 'Canonical origin mismatch' }
            if ($values['ALLOWED_ORIGINS'] -ne $values['PUBLIC_BASE_URL']) { throw 'Allowed origin mismatch' }
            if ($values['IKHOKHA_MODE'] -ne 'sandbox' -or $values['PAYFAST_MODE'] -ne 'sandbox') { throw 'Payment providers must default to sandbox' }

            $acl = Get-Acl -LiteralPath $envPath
            if (-not $acl.AreAccessRulesProtected) { throw 'The .env ACL must not inherit permissions' }
            $broadSids = @('S-1-1-0','S-1-5-32-545')
            foreach ($rule in $acl.Access) {
              $sid = $rule.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
              if ($broadSids -contains $sid) { throw "Broad principal $sid has access to .env" }
            }
            Write-Host 'VIDEONOMY Windows bootstrap and secret ACL: PASS'
          }
          finally {
            if (Test-Path $envPath) { Remove-Item -LiteralPath $envPath -Force }
          }
