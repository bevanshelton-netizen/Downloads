name: IZAKHONO NOTIFY NODE Gate

on:
  push:
    branches: [build/izakhono-notify-node]
    paths:
      - "izakhono-notify-node/**"
      - ".github/workflows/izakhono-notify-node-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "izakhono-notify-node/**"
      - ".github/workflows/izakhono-notify-node-gate.yml"

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: izakhono-notify-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Verify zero runtime dependencies
        run: test "$(node -e 'console.log(Object.keys(require("./package.json").dependencies||{}).length)')" = "0"
      - name: Run notification end-to-end self test
        run: npm run check
      - name: Verify privacy and queue integration
        run: |
          grep -q 'aes-256-gcm' server.mjs
          grep -q 'IZAKHONO_QUEUE_URL' server.mjs
          grep -q 'HOST.*127.0.0.1' server.mjs
          grep -q 'suppressed' server.mjs
