name: KORA IZAKHONO Central Alpha

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'kora-network/**'
      - '.github/workflows/kora-izakhono-alpha.yml'
  push:
    branches: [main]
    paths:
      - 'kora-network/**'
      - '.github/workflows/kora-izakhono-alpha.yml'

permissions:
  contents: read

jobs:
  alpha-core:
    # Immutable reviewed IZAKHONO Builder policy. Upgrade only through an intentional reviewed pin change.
    uses: bevanshelton-netizen/izakhono-builder/.github/workflows/izakhono-build-to-alpha.yml@b53395ede1fa2bf446c88e12554bfcf3c3eaa2ff
    with:
      manifest_path: kora-network/.izakhono.json
