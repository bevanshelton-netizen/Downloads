name: VIDEONOMY Zero Launch Gate

on:
  push:
    branches: [videonomy-cloudflare-zero]
  pull_request:
    branches: [videonomy-cloudflare-zero]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Cloudflare bootstrap shell
        run: bash -n deploy-videonomy-zero.sh
      - name: Install root deployment tooling
        run: npm install
      - name: Extract exact production source
        run: |
          git fetch --depth=1 origin videonomy-production
          rm -rf .videonomy-ci
          mkdir .videonomy-ci
          git archive FETCH_HEAD | tar -x -C .videonomy-ci
      - name: Install production application dependencies
        working-directory: .videonomy-ci
        run: npm install
      - name: Typecheck production source
        working-directory: .videonomy-ci
        run: npm run typecheck
      - name: Package and security tests
        working-directory: .videonomy-ci
        run: npm run test:package
      - name: Validate production Wrangler configuration
        working-directory: .videonomy-ci
        run: ../node_modules/.bin/wrangler deploy --dry-run
