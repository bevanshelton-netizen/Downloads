name: IZAKHONO OWNED CLOUD Gate

on:
  push:
    branches: [build/izakhono-owned-cloud-stack, build/owned-cloud-add-auth, build/owned-cloud-add-analytics, build/owned-cloud-add-notify, build/owned-cloud-add-ai-gateway, build/owned-cloud-add-code, build/owned-cloud-add-backup, build/owned-cloud-add-ci-worker, build/owned-cloud-add-replica-final, build/owned-cloud-package-node-final, build/owned-cloud-add-failover]
    paths:
      - "izakhono-owned-cloud/**"
      - ".github/workflows/izakhono-owned-cloud-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "izakhono-owned-cloud/**"
      - ".github/workflows/izakhono-owned-cloud-gate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n izakhono-owned-cloud/install-owned-stack.sh
          bash -n izakhono-owned-cloud/configure-growth-os.sh
          bash -n izakhono-owned-cloud/bootstrap-owner.sh
          bash -n izakhono-owned-cloud/stack-status.sh
          bash -n izakhono-owned-cloud/provision-ai-client.sh
          bash -n izakhono-owned-cloud/provision-code-token.sh
          bash -n izakhono-owned-cloud/configure-stack-backup.sh
          bash -n izakhono-owned-cloud/deploy-auto-ai.sh
          bash -n izakhono-owned-cloud/configure-auto-ai-tunnel.sh
          bash -n izakhono-owned-cloud/first-host-proof.sh
          bash -n izakhono-owned-cloud/deploy-primary-node.sh
          bash -n izakhono-owned-cloud/deploy-fortress-protector.sh
          bash -n izakhono-owned-cloud/go-live-izakhono-pay.sh
          bash -n izakhono-owned-cloud/deploy-recovery-node.sh
          bash -n izakhono-owned-cloud/migrate-source-to-code.sh
      - name: Verify no paid provisioning commands
        run: |
          ! grep -R -E 'supabase projects create|vercel deploy|aws s3 mb|gcloud .* create' izakhono-owned-cloud
          grep -q '127.0.0.1:\$PORT:8000' izakhono-owned-cloud/deploy-fortress-protector.sh
          grep -q 'payment_credentials_stored.*False' izakhono-owned-cloud/deploy-fortress-protector.sh
          grep -q 'IZAKHONO_DNS_CONTROL_PORT || 8900' izakhono-dns-node/server.mjs
          grep -q 'process.env.PORT || 8910' izakhono-package-node/server.mjs
          grep -q 'IZAKHONO_PACKAGE_URL=http://127.0.0.1:8910/' izakhono-ci-worker-node/install-linux.sh
          grep -q 'PORT || 8920' izakhono-failover-node/server.mjs
          grep -q 'automaticPromotion:false' izakhono-failover-node/server.mjs
          grep -q 'fence-required' izakhono-failover-node/server.mjs
      - name: Verify all sixteen component installers exist
        run: |
          test -f izakhono-data-node/install-linux.sh
          test -f izakhono-runtime-node/install-linux.sh
          test -f izakhono-edge-node/install-linux.sh
          test -f izakhono-object-node/install-linux.sh
          test -f izakhono-queue-node/install-linux.sh
          test -f izakhono-auth-node/install-linux.sh
          test -f izakhono-analytics-node/install-linux.sh
          test -f izakhono-notify-node/install-linux.sh
          test -f izakhono-ai-gateway-node/install-linux.sh
          test -f izakhono-code-node/install-linux.sh
          test -f izakhono-package-node/install-linux.sh
          test -f izakhono-ci-worker-node/install-linux.sh
          test -f izakhono-backup-node/install-linux.sh
          test -f izakhono-replica-node/install-linux.sh
          test -f izakhono-dns-node/install-linux.sh
          test -f izakhono-failover-node/install-linux.sh
