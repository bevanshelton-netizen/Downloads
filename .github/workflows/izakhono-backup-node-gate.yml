name: IZAKHONO BACKUP NODE Gate

on:
  push:
    branches: [build/izakhono-backup-node, build/warm-standby-handoff]
    paths:
      - "izakhono-backup-node/**"
      - ".github/workflows/izakhono-backup-node-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "izakhono-backup-node/**"
      - ".github/workflows/izakhono-backup-node-gate.yml"

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: izakhono-backup-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Verify system backup tools
        run: |
          command -v tar
      - name: Verify zero runtime dependencies
        run: test "$(node -e 'console.log(Object.keys(require("./package.json").dependencies||{}).length)')" = "0"
      - name: Validate shell scripts
        run: |
          bash -n install-linux.sh
          bash -n export-recovery-key.sh
          test -f scripts/restore-external.mjs
      - name: Run encrypted backup end-to-end self test
        run: npm run check
      - name: Run external replica restore staging self test
        run: node scripts/restore-external-self-test.mjs
      - name: Verify recovery safeguards
        run: |
          grep -q 'aes-256-gcm' server.mjs
          grep -q 'SOURCE_NOT_ALLOWED' server.mjs
          grep -q 'RESTORE_DESTINATION_EXISTS' server.mjs
          grep -q 'User=root' systemd/izakhono-backup-node.service
          grep -q 'IZAKHONO_STANDBY_RESTORE_ROOT' scripts/restore-external.mjs
          grep -q 'liveDirectoriesModified:false' scripts/restore-external.mjs
          grep -q 'izakhono-package' install-linux.sh
          grep -q 'izakhono-failover' install-linux.sh
