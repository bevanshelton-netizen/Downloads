name: Chancellor Owner Cutover Handoff Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'START-CHANCELLOR-ON-IZAKHONO.cmd'
      - 'izakhono-cloud/DEPLOY-CHANCELLOR-ISN-01.ps1'
      - '.github/workflows/chancellor-owner-cutover-handoff.yml'
  push:
    branches: [main]
    paths:
      - 'START-CHANCELLOR-ON-IZAKHONO.cmd'
      - 'izakhono-cloud/DEPLOY-CHANCELLOR-ISN-01.ps1'
      - '.github/workflows/chancellor-owner-cutover-handoff.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse PowerShell launcher
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'izakhono-cloud/DEPLOY-CHANCELLOR-ISN-01.ps1'),
            [ref]$tokens,[ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Guard private-pilot contract
        shell: pwsh
        run: |
          $p = Get-Content 'izakhono-cloud/DEPLOY-CHANCELLOR-ISN-01.ps1' -Raw
          if ($p -notmatch '22914758d9bc24217d63c87515186f5d4a9806ab') { throw 'Chancellor revision is not pinned' }
          if ($p -notmatch 'ENGINE-PROOF.json') { throw 'ISN-01 Engine proof is not required' }
          if ($p -notmatch '127\.0\.0\.1:18106') { throw 'loopback Chancellor port missing' }
          if ($p -notmatch 'PAYFAST_MODE=sandbox') { throw 'PayFast sandbox guard missing' }
          if ($p -notmatch 'IZAKHONO_ANALYTICS_URL=http://127.0.0.1:18112') { throw 'local analytics wiring missing' }
          if ($p -notmatch 'PAYFAST_MERCHANT_ID=') { throw 'merchant-disable guard missing' }
          if ($p -notmatch 'readyForPaidTraffic":false') { throw 'paid-traffic fail-closed gate missing' }
          if ($p -notmatch 'public_dns_changed.+False') { throw 'DNS safety receipt missing' }
          if ($p -notmatch 'live_payments_changed.+False') { throw 'payment safety receipt missing' }
          if ($p -match 'cloudflared tunnel route|route53|nameserver|dns update') { throw 'handoff must not modify public edge' }

      - name: Validate CMD handoff
        shell: pwsh
        run: |
          $c = Get-Content 'START-CHANCELLOR-ON-IZAKHONO.cmd' -Raw
          if ($c -notmatch 'DEPLOY-CHANCELLOR-ISN-01.ps1') { throw 'launcher target mismatch' }
          if ($c -notmatch 'raw.githubusercontent.com/bevanshelton-netizen/Downloads/main') { throw 'launcher must fetch merged main script' }
