name: KORA Verify Public Launch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: kora-production
    defaults:
      run:
        working-directory: kora-network
    env:
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      KORA_TARGET_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      KORA_EXPECT_READY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify the public production deployment
        run: node scripts/postdeploy-smoke.mjs
