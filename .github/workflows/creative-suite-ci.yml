name: Creative Suite CI

on:
  push:
    paths:
      - 'IZAKHONO-STUDIO/**'
      - '.github/workflows/creative-suite-ci.yml'
  pull_request:
    paths:
      - 'IZAKHONO-STUDIO/**'
      - '.github/workflows/creative-suite-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: IZAKHONO-STUDIO

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Creative Suite
        run: npm run build
