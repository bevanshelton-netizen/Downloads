name: Materialize VIDEONOMY Production Source

on:
  push:
    branches: [videonomy-cloudflare-zero]
    paths:
      - 'videonomy-bundle/**'
      - '.github/workflows/videonomy-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize clean source tree
        run: |
          set -euo pipefail
          rm -rf .videonomy-materialize videonomy-zero
          mkdir -p .videonomy-materialize videonomy-zero
          cat videonomy-bundle/chunk-*.b64 | base64 -d > .videonomy-materialize/app.tgz
          tar -xzf .videonomy-materialize/app.tgz -C videonomy-zero
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('videonomy-zero/wrangler.jsonc')
          data = json.loads(p.read_text())
          data['name'] = 'videonomy'
          p.write_text(json.dumps(data, indent=2) + '\n')
          p = Path('videonomy-zero/package.json')
          data = json.loads(p.read_text())
          data['name'] = 'videonomy'
          data['scripts']['deploy'] = 'wrangler deploy --yes && wrangler d1 migrations apply DB --remote && wrangler deploy --yes'
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          rm -rf .videonomy-materialize
      - name: Commit direct source
        run: |
          git config user.name 'VIDEONOMY Launch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add videonomy-zero
          if git diff --cached --quiet; then
            echo 'Direct source is already current.'
            exit 0
          fi
          git commit -m 'VIDEONOMY Zero: materialize direct Cloudflare source'
          git push
