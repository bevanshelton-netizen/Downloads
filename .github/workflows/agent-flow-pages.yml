name: Deploy Agent Flow to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'agent-flow/**'
      - '.github/workflows/agent-flow-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-agent-flow
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: agent-flow
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
