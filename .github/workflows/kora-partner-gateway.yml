name: KORA Partner Gateway Gate

on:
  pull_request:
    paths:
      - 'kora-network/**'
      - '.github/workflows/kora-partner-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'kora-network/**'
      - '.github/workflows/kora-partner-gateway.yml'

jobs:
  partner-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kora-network
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run validate:migrations
      - run: npm run validate:partner-gateway
      - run: npm run typecheck
      - run: npm run build
