name: IZAKHONO ONE Optional Owner Runner Activation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/izakhono-one-owner-runner-activation.yml'
      - 'owner-host/control/one-desired-state.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/izakhono-one-owner-runner-activation.yml'
      - 'owner-host/control/one-desired-state.json'

permissions:
  contents: read

concurrency:
  group: izakhono-one-owner-runner-activation
  cancel-in-progress: true

jobs:
  detect-owner-request-change:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      changed: ${{ steps.change.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: change
        name: Decide whether owned execution is authorised for this event
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "OWNER_EXECUTION_TRIGGER=workflow_dispatch"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "OWNER_EXECUTION_TRIGGER=none"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "OWNER_EXECUTION_TRIGGER=none"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$AFTER" | grep -Fxq 'owner-host/control/one-desired-state.json'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "OWNER_EXECUTION_TRIGGER=desired-state-change"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "OWNER_EXECUTION_TRIGGER=none"
          fi

  verify-owner-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved ONE request contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('owner-host/control/one-desired-state.json','utf8'));
          if(x.enabled!==true) throw new Error('owner request is not enabled');
          if(x.action!=='activate-one-local-model') throw new Error('unexpected owner action');
          if(x.params?.hostname!=='one.domains.izakhonoafrica.co.za') throw new Error('unexpected hostname');
          if(x.params?.r0_mode!==true) throw new Error('R0 mode is required');
          if(!x.id) throw new Error('request id missing');
          console.log('ONE_OWNER_REQUEST=VERIFIED');
          console.log('APPROVED_REQUEST='+x.id);
          NODE

  activate-on-owned-runner:
    if: github.event_name == 'workflow_dispatch' || needs.detect-owner-request-change.outputs.changed == 'true'
    needs: [verify-owner-request, detect-owner-request-change]
    runs-on: [self-hosted, linux, x64, izakhono]
    timeout-minutes: 60
    outputs:
      bridge_url: ${{ steps.bridge.outputs.public_url }}
      bridge_state: ${{ steps.bridge.outputs.bridge_state }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify approved ONE request contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('owner-host/control/one-desired-state.json','utf8'));
          if(x.enabled!==true) throw new Error('owner request is not enabled');
          if(x.action!=='activate-one-local-model') throw new Error('unexpected owner action');
          if(x.params?.hostname!=='one.domains.izakhonoafrica.co.za') throw new Error('unexpected hostname');
          if(x.params?.r0_mode!==true) throw new Error('R0 mode is required');
          if(!x.id) throw new Error('request id missing');
          console.log('APPROVED_REQUEST='+x.id);
          NODE

      - name: Execute allow-listed owner agent on IZAKHONO infrastructure
        shell: bash
        run: |
          set -euo pipefail
          sudo -E env IZAKHONO_OWNER_CONTROL_PATH=owner-host/control/one-desired-state.json IZAKHONO_OWNER_AGENT_STATE_FILE=/var/lib/izakhono-owner-agent/one-r0-state.json bash owner-host/owner-agent.sh

      - name: Verify owner-agent receipt and local ONE health
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID="$(node -e "const x=require('./owner-host/control/one-desired-state.json');process.stdout.write(x.id)")"
          sudo test -s /var/lib/izakhono-owner-agent/one-r0-state.json
          sudo node - "$REQUEST_ID" <<'NODE'
          const fs=require('fs');
          const request=process.argv[2];
          const x=JSON.parse(fs.readFileSync('/var/lib/izakhono-owner-agent/one-r0-state.json','utf8'));
          if(x.request_id!==request) throw new Error('receipt request id mismatch');
          if(x.status!=='success') throw new Error('owner agent did not report success: '+x.status);
          console.log('OWNER_AGENT_STATUS=success');
          console.log('OWNER_AGENT_SOURCE_COMMIT='+String(x.source_commit||''));
          NODE
          curl -fsS --max-time 8 -H 'Host: one.domains.izakhonoafrica.co.za' http://127.0.0.1:8080/health >/tmp/one-owned-local-health.json
          node - <<'NODE'
          const x=require('/tmp/one-owned-local-health.json');
          if(x.product!=='IZAKHONO ONE AI'||x.status!=='healthy') process.exit(2);
          if(x.tracking!==false||x.promptPersistence!==false||x.chatReady!==true||x.accountReachable!==true) process.exit(3);
          console.log('OWNED_LOCAL_RUNTIME=VERIFIED');
          console.log('TRACKING=false');
          NODE

      - id: bridge
        name: Start R0 owned public bridge and export public URL
        shell: bash
        run: |
          set -euo pipefail
          set +e
          sudo -E env \
            IZAKHONO_BRIDGE_APP="izakhono-one-ai" \
            IZAKHONO_BRIDGE_HEALTH_PATH="/health" \
            IZAKHONO_BRIDGE_EXPECTED_SERVICE="" \
            IZAKHONO_BRIDGE_EXPECTED_PRODUCT="IZAKHONO ONE AI" \
            IZAKHONO_BRIDGE_EXPECTED_STATUS="healthy" \
            bash izakhono-owned-cloud/activate-tailscale-funnel.sh
          code=$?
          set -e

          case "$code" in
            0) ;;
            20)
              echo "::error::Tailscale authentication is required once on the owned node. Run the secure tailscale up browser flow on that node; do not paste auth credentials into ChatGPT."
              exit 20
              ;;
            21)
              echo "::error::Tailscale Funnel approval is required once for this tailnet."
              exit 21
              ;;
            22)
              echo "::error::Tailscale Funnel exists but public ONE health is not ready yet."
              exit 22
              ;;
            *)
              echo "::error::R0 bridge activation failed with exit $code."
              exit "$code"
              ;;
          esac

          REPORT='/var/lib/izakhono-deploy/tailscale-funnel-izakhono-one-ai.json'
          sudo test -s "$REPORT"
          public_url="$(sudo node - "$REPORT" <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(x.state!=='LIVE_VERIFIED'||x.public_ready!==true) process.exit(2);
          if(x.engine_authority!=='IZAKHONO_OWNED_RUNTIME'||x.provider_is_replaceable_adapter!==true) process.exit(3);
          if(typeof x.public_url!=='string'||!x.public_url.startsWith('https://')) process.exit(4);
          process.stdout.write(x.public_url.replace(/\/$/,''));
          NODE
          )"
          echo "public_url=$public_url" >> "$GITHUB_OUTPUT"
          echo "bridge_state=LIVE_VERIFIED" >> "$GITHUB_OUTPUT"
          echo "R0_BRIDGE_URL=$public_url"
          echo "R0_BRIDGE_STATE=LIVE_VERIFIED"

  verify-owned-public-independently:
    needs: activate-on-owned-runner
    if: always() && needs.activate-on-owned-runner.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Strict independent R0 bridge HTTPS verification
        shell: bash
        env:
          OWNED_BASE: ${{ needs.activate-on-owned-runner.outputs.bridge_url }}
        run: |
          set -euo pipefail
          test -n "$OWNED_BASE"
          case "$OWNED_BASE" in https://*) ;; *) echo "Owned bridge is not HTTPS" >&2; exit 10;; esac
          ROOT="${OWNED_BASE%/}/"
          HEALTH="${OWNED_BASE%/}/health"
          root_code="$(curl -sSL --max-time 20 -o /tmp/root.html -w '%{http_code}' "$ROOT" || true)"
          health_code="$(curl -sSL --max-time 20 -o /tmp/health.json -w '%{http_code}' "$HEALTH" || true)"
          echo "OWNED_BRIDGE=$OWNED_BASE"
          echo "HTTPS_ROOT=$root_code"
          echo "HTTPS_HEALTH=$health_code"
          test "$root_code" = '200'
          test "$health_code" = '200'
          grep -q 'IZAKHONO ONE' /tmp/root.html
          ! grep -Eqi 'utm_|googletagmanager|google-analytics|facebook[^<]*(pixel|track)|hotjar|clarity\.ms|mixpanel|amplitude|plausible|matomo|portfolio-growth/bridge\.js' /tmp/root.html

          node - <<'NODE'
          const x=require('/tmp/health.json');
          const runtime={
            product:'IZAKHONO ONE AI',
            status:'healthy',
            tracking:false,
            promptPersistence:false,
            chatReady:true,
            accountReachable:true
          };
          for(const [k,v] of Object.entries(runtime)) if(x[k]!==v) throw new Error(k+' mismatch');
          console.log('OWNED_SERVER_AI_BRIDGE=VERIFIED');
          if(x.publicSignup===true && x.emailVerificationRequired===true){
            console.log('OWNED_PUBLIC_PILOT_ACCOUNT_GATE=VERIFIED');
          }else{
            console.log('OWNED_PUBLIC_PILOT_ACCOUNT_GATE=PENDING');
            console.log('PUBLIC_SIGNUP='+String(x.publicSignup));
            console.log('EMAIL_VERIFICATION_REQUIRED='+String(x.emailVerificationRequired));
          }
          NODE

          echo 'IZAKHONO ONE R0 OWNED SERVER BRIDGE: INDEPENDENTLY VERIFIED'
          echo 'OWNED_AUTHORITY_ROLE=NODE01'
          echo 'OWNED_EXECUTION_CLASS=IZAKHONO_SOVEREIGN_NODE'
          echo 'OWNED_EXECUTION_ALIASES=ISN-01,NODE01_EQUIVALENT'
          echo 'TRANSPORT=TAILSCALE_FUNNEL_REPLACEABLE_ADAPTER'
          echo 'TRACKING=false'
