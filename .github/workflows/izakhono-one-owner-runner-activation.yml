name: IZAKHONO ONE Native Infrastructure Activation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/izakhono-one-owner-runner-activation.yml'
      - 'infrastructure/control/portfolio-desired-state.json'
      - 'izakhono-infrastructure-executor/targets.json'
      - 'izakhono-owned-cloud/activate-izakhono-one-local-model.sh'
      - 'izakhono-owned-cloud/activate-local-model-engine.sh'
      - 'IZAKHONO-INFRASTRUCTURE-AUTHORITY.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/izakhono-one-owner-runner-activation.yml'
      - 'infrastructure/control/portfolio-desired-state.json'
      - 'izakhono-infrastructure-executor/targets.json'
      - 'izakhono-owned-cloud/activate-izakhono-one-local-model.sh'
      - 'izakhono-owned-cloud/activate-local-model-engine.sh'
      - 'IZAKHONO-INFRASTRUCTURE-AUTHORITY.json'

permissions:
  contents: read

concurrency:
  group: izakhono-one-infrastructure-activation
  cancel-in-progress: true

jobs:
  verify-request:
    name: Verify ONE native executor request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify infrastructure authority and fixed workload
        shell: bash
        run: |
          set -euo pipefail
          bash -n izakhono-owned-cloud/activate-izakhono-one-local-model.sh
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('IZAKHONO-INFRASTRUCTURE-AUTHORITY.json','utf8'));
          if(p.runtime_authority!=='IZAKHONO_INFRASTRUCTURE') throw new Error('infrastructure authority mismatch');
          if(p.execution_policy?.production_scheduler!=='IZAKHONO_INFRASTRUCTURE_EXECUTOR') throw new Error('native executor not authoritative');
          if(p.execution_policy?.github_self_hosted_runner_required_for_production!==false) throw new Error('GitHub runner still required');
          if(p.laptop?.deployment_target!==false||p.communication_policy?.platform_to_laptop!=='DENY') throw new Error('laptop isolation failed');
          const c=JSON.parse(fs.readFileSync('infrastructure/control/portfolio-desired-state.json','utf8'));
          const r=(c.requests||[]).find(x=>x.id==='izakhono-one-local-model-infrastructure-20260926-01');
          if(!r||r.action!=='run-workload'||r.workload_id!=='izakhono-one-local-model'||r.enabled!==true) throw new Error('ONE workload request missing');
          if(r.laptop_target!==false||r.public_live_claim!==false) throw new Error('ONE request safety mismatch');
          const t=JSON.parse(fs.readFileSync('izakhono-infrastructure-executor/targets.json','utf8'));
          if(t.workloads?.['izakhono-one-local-model']?.command?.[1]!=='izakhono-owned-cloud/activate-izakhono-one-local-model.sh') throw new Error('ONE workload target mismatch');
          console.log('ONE_NATIVE_EXECUTOR_REQUEST=VERIFIED');
          console.log('GITHUB_PRODUCTION_EXECUTION=false');
          NODE

  observe-owned-public:
    name: Observe IZAKHONO ONE owned public HTTPS
    needs: verify-request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Observe without creating a live claim
        shell: bash
        run: |
          set -euo pipefail
          HOST='one.domains.izakhonoafrica.co.za'
          set +e
          HEALTH="$(curl -fsS --connect-timeout 5 --max-time 20 "https://$HOST/health" 2>/dev/null)"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ] || [ -z "$HEALTH" ]; then
            echo 'IZAKHONO_ONE_OWNED_PUBLIC_HTTPS=NOT_VERIFIED'
            echo 'PUBLIC_LIVE_CLAIM=false'
            exit 0
          fi
          if node -e 'const x=JSON.parse(process.argv[1]);if(x.product!=="IZAKHONO ONE AI"||x.status!=="healthy")process.exit(2)' "$HEALTH"; then
            echo 'IZAKHONO_ONE_OWNED_PUBLIC_HTTPS=VERIFIED'
          else
            echo 'IZAKHONO_ONE_OWNED_PUBLIC_HTTPS=IDENTITY_MISMATCH'
          fi
          echo 'PUBLIC_LIVE_CLAIM=false'
