name: Growth OS External Resilience Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/growth-os-external-resilience-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-https:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public Growth OS root
        run: |
          set -euo pipefail
          URL="https://izakhono-growth-os-resilience.vercel.app"
          code="$(curl -sS -L -o /tmp/root.html -w '%{http_code}' --max-time 20 "$URL/")"
          test "$code" = "200"
          grep -q 'IZAKHONO' /tmp/root.html
          grep -q 'GROWTH OS' /tmp/root.html

      - name: Verify public Growth OS health contract
        run: |
          set -euo pipefail
          URL="https://izakhono-growth-os-resilience.vercel.app/api/health"
          code="$(curl -sS -L -o /tmp/health.json -w '%{http_code}' --max-time 20 "$URL")"
          test "$code" = "200"
          node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));
          if(x.ok!==true) throw new Error("health ok was not true");
          if(x.service!=="growth-os-v2") throw new Error("wrong service");
          if(x.product!=="IZAKHONO GROWTH OS") throw new Error("wrong product");
          if(x.safeWriteMode!==true) throw new Error("safe write mode missing");
          if(x.liveAdWrites!==false) throw new Error("live ad writes must remain off");
          if(x.runtime!=="external-resilience") throw new Error("external runtime was not reported truthfully");
          if(x.authority!=="izakhono-owned-primary") throw new Error("owned authority missing");
          console.log(JSON.stringify(x,null,2));
          NODE

      - name: Verify Backend Control page and status API
        run: |
          set -euo pipefail
          URL="https://izakhono-growth-os-resilience.vercel.app"
          code="$(curl -sS -L -o /tmp/backend.html -w '%{http_code}' --max-time 20 "$URL/backend")"
          test "$code" = "200"
          grep -q 'IZAKHONO BACKEND CONTROL' /tmp/backend.html
          code="$(curl -sS -L -o /tmp/backend-status.json -w '%{http_code}' --max-time 20 "$URL/api/backend/status")"
          test "$code" = "200"
          node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(fs.readFileSync("/tmp/backend-status.json","utf8"));
          if(x.authority!=="IZAKHONO-owned infrastructure") throw new Error("wrong backend authority");
          if(x.guardrails?.liveAdWrites!==false) throw new Error("live ad writes must remain off");
          if(x.guardrails?.approvalRequiredBeforeWrite!==true) throw new Error("approval guardrail missing");
          if(x.modules?.payments?.provider!=="iKhokha") throw new Error("iKhokha readiness missing");
          console.log(JSON.stringify(x,null,2));
          NODE

      - name: Confirm external route is resilience only
        run: |
          echo "EXTERNAL_ROUTE=VERIFIED"
          echo "AUTHORITY=IZAKHONO_OWNED_PRIMARY"
          echo "LIVE_AD_WRITES=DISABLED"
