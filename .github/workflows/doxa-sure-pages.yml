name: Deploy IZAKHONO Static Gateway to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/PUBLISH_STATIC_GATEWAY'
      - 'ports/yenzanow/**'
      - 'ports/revenue-sprint/**'
      - 'doxa-sure/**'
      - 'ports/izakhono-one/**'
      - 'portfolio-growth/**'
      - '.github/workflows/doxa-sure-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: izakhono-static-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble stable static gateway
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/yenzanow _site/revenue
          mkdir -p _site/izakhono-one
          mkdir -p _site/portfolio-growth

          # Preserve the existing DOXA-SURE demo at repository Pages root.
          cp -R doxa-sure/. _site/

          # Add the verified YenZaNow build as a stable sub-route.
          cp ports/yenzanow/index.html _site/yenzanow/index.html
          cp ports/yenzanow/healthz.txt _site/yenzanow/healthz.txt

          # Publish the premium IZAKHONO Revenue Sprint.
          cp ports/revenue-sprint/index.html _site/revenue/index.html
          cp ports/revenue-sprint/index.html _site/revenue.html

          # Publish the shared portfolio growth bridge.
          cp -R portfolio-growth/. _site/portfolio-growth/

          # Add the full IZAKHONO ONE public frontend and campaign routes.
          cp -R ports/izakhono-one/. _site/izakhono-one/

          touch _site/.nojekyll

      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload IZAKHONO static gateway
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify IZAKHONO ONE public routes
        shell: bash
        run: |
          set -euo pipefail
          REVENUE="https://bevanshelton-netizen.github.io/Downloads/revenue.html"
          BASE="https://bevanshelton-netizen.github.io/Downloads/izakhono-one/"
          HEALTH="https://bevanshelton-netizen.github.io/Downloads/izakhono-one/health-check/"
          CLINIC="https://bevanshelton-netizen.github.io/Downloads/izakhono-one/clinic/"
          CONTRACTORS="https://bevanshelton-netizen.github.io/Downloads/izakhono-one/contractors/"
          PORTFOLIO="https://bevanshelton-netizen.github.io/Downloads/portfolio-growth/"
          LAUNCH="https://bevanshelton-netizen.github.io/Downloads/portfolio-growth/launch/?platform=fortress"
          ok=0
          for i in $(seq 1 36); do
            rm -f /tmp/revenue.html /tmp/revenue.h /tmp/one.html /tmp/health.html /tmp/clinic.html /tmp/contractors.html /tmp/portfolio.html /tmp/launch.html /tmp/one.h /tmp/health.h
            if curl -fsSL -D /tmp/revenue.h -o /tmp/revenue.html "$REVENUE" &&
               curl -fsSL -D /tmp/one.h -o /tmp/one.html "$BASE" &&
               curl -fsSL -D /tmp/health.h -o /tmp/health.html "$HEALTH" &&
               curl -fsSL -o /tmp/clinic.html "$CLINIC" &&
               curl -fsSL -o /tmp/contractors.html "$CONTRACTORS" &&
               curl -fsSL -o /tmp/portfolio.html "$PORTFOLIO" &&
               curl -fsSL -o /tmp/launch.html "$LAUNCH" &&
               grep -q 'IZAKHONO Revenue Sprint' /tmp/revenue.html &&
               grep -q 'Built enough.' /tmp/revenue.html &&
               grep -q 'IZAKHONO ONE' /tmp/one.html &&
               grep -q 'FREE 3-MINUTE BUSINESS HEALTH CHECK' /tmp/health.html &&
               grep -q 'Business Clinic' /tmp/clinic.html &&
               grep -q 'Contractors' /tmp/contractors.html &&
               grep -q 'IZAKHONO PORTFOLIO' /tmp/portfolio.html &&
               grep -q 'IZAKHONO PORTFOLIO' /tmp/launch.html &&
               grep -qi '^content-type: text/html' /tmp/revenue.h &&
               grep -qi '^content-type: text/html' /tmp/one.h &&
               grep -qi '^content-type: text/html' /tmp/health.h; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
