name: Deploy DOXA-SURE Demo to GitHub Pages

# Runs only when this deployment workflow changes or is started manually.
# configure-pages may create the Pages site when the repository permits it.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/doxa-sure-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: doxa-sure-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload DOXA-SURE site
        uses: actions/upload-pages-artifact@v4
        with:
          path: doxa-sure
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
