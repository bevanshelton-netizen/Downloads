name: Deploy IZAKHONO Static Gateway to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/PUBLISH_STATIC_GATEWAY'
      - 'ports/yenzanow/**'
      - 'ports/revenue-sprint/**'
      - 'doxa-sure/**'
      - 'ports/izakhono-one/**'
      - 'ports/kora-kids/**'
      - 'portfolio-growth/**'
      - 'IZAKHONO-STUDIO/**'
      - '.github/workflows/doxa-sure-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: izakhono-static-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for Creative Suite
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Creative Suite external fallback
        working-directory: IZAKHONO-STUDIO
        run: |
          npm install --no-audit --no-fund
          npm run build -- --base=/Downloads/creative-suite/

      - name: Assemble stable static gateway
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/doxa-sure _site/yenzanow
          mkdir -p _site/izakhono-one
          mkdir -p _site/portfolio-growth
          mkdir -p _site/kora-kids
          mkdir -p _site/creative-suite

          # Revenue Sprint is the production front door at the Pages root.
          cp ports/revenue-sprint/index.html _site/index.html

          # Preserve DOXA-SURE at its own stable sub-route.
          cp -R doxa-sure/. _site/doxa-sure/

          # Add the verified YenZaNow build as a stable sub-route.
          cp ports/yenzanow/index.html _site/yenzanow/index.html
          cp ports/yenzanow/healthz.txt _site/yenzanow/healthz.txt

          # Publish the shared portfolio growth bridge.
          cp -R portfolio-growth/. _site/portfolio-growth/

          # Add the full IZAKHONO ONE public frontend and campaign routes.
          cp -R ports/izakhono-one/. _site/izakhono-one/

          # Publish the original KORA KIDS Tumi & Tala prototype.
          cp -R ports/kora-kids/. _site/kora-kids/

          # Publish IZAKHONO Creative Suite as an external static fallback.
          cp -R IZAKHONO-STUDIO/dist/. _site/creative-suite/

          touch _site/.nojekyll

      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload IZAKHONO static gateway
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Creative Suite external fallback
        shell: bash
        run: |
          set -euo pipefail
          CREATIVE="https://bevanshelton-netizen.github.io/Downloads/creative-suite/"
          HEALTH="https://bevanshelton-netizen.github.io/Downloads/creative-suite/health.json"
          ok=0
          for i in $(seq 1 36); do
            rm -f /tmp/creative.html /tmp/creative-health.json
            if curl -fsSL -o /tmp/creative.html "$CREATIVE" &&
               curl -fsSL -o /tmp/creative-health.json "$HEALTH" &&
               grep -Fq '<div id="root"></div>' /tmp/creative.html &&
               node -e 'const x=require("/tmp/creative-health.json");if(x.ok!==true||x.service!=="izakhono-creative-suite"||x.registration_enabled!==false||x.checkout_enabled!==false)process.exit(2)'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

      - name: Verify KORA KIDS public route
        shell: bash
        run: |
          set -euo pipefail
          KIDS="https://bevanshelton-netizen.github.io/Downloads/kora-kids/"
          ok=0
          for i in $(seq 1 36); do
            rm -f /tmp/kids.html /tmp/kids.h
            if curl -fsSL -D /tmp/kids.h -o /tmp/kids.html "$KIDS" &&
               grep -q 'LEBO' /tmp/kids.html &&
               grep -q 'JABU' /tmp/kids.html &&
               grep -q 'KORA KIDS' /tmp/kids.html &&
               grep -qi '^content-type: text/html' /tmp/kids.h; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

      - name: Verify Revenue Sprint public route
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          REVENUE="https://bevanshelton-netizen.github.io/Downloads/"
          ok=0
          for i in $(seq 1 36); do
            rm -f /tmp/revenue.html /tmp/revenue.h
            if curl -fsSL -D /tmp/revenue.h -o /tmp/revenue.html "$REVENUE" &&
               grep -q 'IZAKHONO REVENUE SPRINT' /tmp/revenue.html &&
               grep -q 'Built enough.' /tmp/revenue.html &&
               grep -qi '^content-type: text/html' /tmp/revenue.h; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

      - name: Verify IZAKHONO ONE static resilience route
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bevanshelton-netizen.github.io/Downloads/izakhono-one/"
          HEALTH="https://bevanshelton-netizen.github.io/Downloads/izakhono-one/health-check/"
          CLINIC="https://bevanshelton-netizen.github.io/Downloads/izakhono-one/clinic/"
          CONTRACTORS="https://bevanshelton-netizen.github.io/Downloads/izakhono-one/contractors/"
          PORTFOLIO="https://bevanshelton-netizen.github.io/Downloads/portfolio-growth/"
          LAUNCH="https://bevanshelton-netizen.github.io/Downloads/portfolio-growth/launch/?platform=fortress"
          curl -fsSL "$BASE" | grep -q 'IZAKHONO ONE'
          curl -fsSL "$HEALTH" | grep -q 'FREE 3-MINUTE BUSINESS HEALTH CHECK'
          curl -fsSL "$CLINIC" | grep -q 'Business Clinic'
          curl -fsSL "$CONTRACTORS" | grep -q 'Contractors'
          curl -fsSL "$PORTFOLIO" | grep -q 'IZAKHONO PORTFOLIO'
          curl -fsSL "$LAUNCH" | grep -q 'IZAKHONO PORTFOLIO'
          # Zero-tracking gate for the public resilience route.
          curl -fsSL "$BASE" -o /tmp/izakhono-one-static.html
          ! grep -Eqi 'utm_|googletagmanager|google-analytics|facebook[^<]*(pixel|track)|hotjar|clarity\.ms|mixpanel|amplitude|plausible|matomo|portfolio-growth/bridge\.js' /tmp/izakhono-one-static.html
