name: Deploy IZAKHONO Static Gateway to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/PUBLISH_STATIC_GATEWAY'
      - 'ports/yenzanow/**'
      - 'doxa-sure/**'
      - 'ports/izakhono-one/**'
      - '.github/workflows/doxa-sure-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: izakhono-static-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble stable static gateway
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/yenzanow
          mkdir -p _site/izakhono-one

          # Preserve the existing DOXA-SURE demo at repository Pages root.
          cp -R doxa-sure/. _site/

          # Add the verified YenZaNow build as a stable sub-route.
          cp ports/yenzanow/index.html _site/yenzanow/index.html
          cp ports/yenzanow/healthz.txt _site/yenzanow/healthz.txt

          # Add the full IZAKHONO ONE public frontend and campaign routes.
          cp -R ports/izakhono-one/. _site/izakhono-one/

          touch _site/.nojekyll

      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload IZAKHONO static gateway
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify IZAKHONO ONE public routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bevanshelton-netizen.github.io/Downloads/izakhono-one/"
          HEALTH="https://bevanshelton-netizen.github.io/Downloads/izakhono-one/health-check/"
          ok=0
          for i in $(seq 1 18); do
            rm -f /tmp/one.html /tmp/health.html /tmp/one.h /tmp/health.h
            if curl -fsSL -D /tmp/one.h -o /tmp/one.html "$BASE" &&
               curl -fsSL -D /tmp/health.h -o /tmp/health.html "$HEALTH" &&
               grep -q 'IZAKHONO ONE' /tmp/one.html &&
               grep -q 'FREE 3-MINUTE BUSINESS HEALTH CHECK' /tmp/health.html &&
               grep -qi '^content-type: text/html' /tmp/one.h &&
               grep -qi '^content-type: text/html' /tmp/health.h; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
