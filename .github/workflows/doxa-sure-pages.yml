name: Deploy IZAKHONO Static Gateway to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/PUBLISH_STATIC_GATEWAY'
      - 'ports/yenzanow/**'
      - 'ports/revenue-sprint/**'
      - 'doxa-sure/**'
      - 'ports/izakhono-one/**'
      - 'portfolio-growth/**'
      - '.github/workflows/doxa-sure-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: izakhono-static-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble stable static gateway
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/doxa-sure _site/yenzanow
          mkdir -p _site/izakhono-one
          mkdir -p _site/portfolio-growth

          # Revenue Sprint is the production front door at the Pages root.
          cp ports/revenue-sprint/index.html _site/index.html

          # Preserve DOXA-SURE at its own stable sub-route.
          cp -R doxa-sure/. _site/doxa-sure/

          # Add the verified YenZaNow build as a stable sub-route.
          cp ports/yenzanow/index.html _site/yenzanow/index.html
          cp ports/yenzanow/healthz.txt _site/yenzanow/healthz.txt

          # Publish the shared portfolio growth bridge.
          cp -R portfolio-growth/. _site/portfolio-growth/

          # Add the full IZAKHONO ONE public frontend and campaign routes.
          cp -R ports/izakhono-one/. _site/izakhono-one/

          touch _site/.nojekyll

      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload IZAKHONO static gateway
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Revenue Sprint public route
        shell: bash
        run: |
          set -euo pipefail
          REVENUE="https://bevanshelton-netizen.github.io/Downloads/"
          ok=0
          for i in $(seq 1 36); do
            rm -f /tmp/revenue.html /tmp/revenue.h
            if curl -fsSL -D /tmp/revenue.h -o /tmp/revenue.html "$REVENUE" &&
               grep -q 'IZAKHONO REVENUE SPRINT' /tmp/revenue.html &&
               grep -q 'Built enough.' /tmp/revenue.html &&
               grep -qi '^content-type: text/html' /tmp/revenue.h; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

      - name: Verify legacy IZAKHONO ONE public routes
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bevanshelton-netizen.github.io/Downloads/izakhono-one/"
          HEALTH="https://bevanshelton-netizen.github.io/Downloads/izakhono-one/health-check/"
          CLINIC="https://bevanshelton-netizen.github.io/Downloads/izakhono-one/clinic/"
          CONTRACTORS="https://bevanshelton-netizen.github.io/Downloads/izakhono-one/contractors/"
          PORTFOLIO="https://bevanshelton-netizen.github.io/Downloads/portfolio-growth/"
          LAUNCH="https://bevanshelton-netizen.github.io/Downloads/portfolio-growth/launch/?platform=fortress"
          curl -fsSL "$BASE" | grep -q 'IZAKHONO ONE'
          curl -fsSL "$HEALTH" | grep -q 'FREE 3-MINUTE BUSINESS HEALTH CHECK'
          curl -fsSL "$CLINIC" | grep -q 'Business Clinic'
          curl -fsSL "$CONTRACTORS" | grep -q 'Contractors'
          curl -fsSL "$PORTFOLIO" | grep -q 'IZAKHONO PORTFOLIO'
          curl -fsSL "$LAUNCH" | grep -q 'IZAKHONO PORTFOLIO'
