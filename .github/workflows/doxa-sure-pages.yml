name: Deploy DOXA-SURE Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'doxa-sure/**'
      - '.github/workflows/doxa-sure-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: doxa-sure-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload DOXA-SURE site
        uses: actions/upload-pages-artifact@v4
        with:
          path: doxa-sure
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
