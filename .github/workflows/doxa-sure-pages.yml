name: Deploy IZAKHONO Static Gateway to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/PUBLISH_STATIC_GATEWAY'
      - 'ports/yenzanow/**'
      - 'ports/revenue-sprint/**'
      - 'kora-network/public/izakhono-revenue/**'
      - 'doxa-sure/**'
      - 'ports/izakhono-one/**'
      - 'one/**'
      - 'ports/kora-kids/**'
      - 'yhvh-gospel-tv/**'
      - 'izakhono-digital-finance/**'
      - 'ports/kora-gospel-tv/**'
      - 'portfolio-growth/**'
      - 'IZAKHONO-STUDIO/**'
      - '.github/workflows/doxa-sure-pages.yml'

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: izakhono-static-pages-workflow
  cancel-in-progress: true


jobs:
  cancel-stale-publishers:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel older IZAKHONO static publisher runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100"
          json="$(curl -fsSL --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api")"
          mapfile -t stale < <(printf '%s' "$json" | jq -r --argjson current "${GITHUB_RUN_ID}" '
            .workflow_runs[]
            | select(.name=="Deploy IZAKHONO Static Gateway to GitHub Pages")
            | select(.id != $current)
            | select(.status != "completed")
            | .id
          ')
          for run_id in "${stale[@]:-}"; do
            [ -n "$run_id" ] || continue
            echo "Cancelling stale IZAKHONO Pages run $run_id"
            curl -fsSL --max-time 15 -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/cancel" \
              -o /dev/null || true
          done

  build-gateway:
    needs: cancel-stale-publishers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for Creative Suite
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Creative Suite external fallback
        working-directory: IZAKHONO-STUDIO
        run: |
          npm install --no-audit --no-fund
          npm run build -- --base=/Downloads/creative-suite/

      - name: Assemble stable static gateway
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/doxa-sure _site/yenzanow _site/revenue-sprint
          mkdir -p _site/izakhono-one
          mkdir -p _site/one
          mkdir -p _site/ports/izakhono-one
          mkdir -p _site/portfolio-growth
          mkdir -p _site/kora-kids
          mkdir -p _site/yhvh-gospel-tv
          mkdir -p _site/izakhono-digital-finance
          mkdir -p _site/ports/kora-gospel-tv
          mkdir -p _site/creative-suite

          # Publish the photo-led Business Growth Desk as the public front door.
          cp kora-network/public/izakhono-revenue/index.html _site/index.html
          cp kora-network/public/izakhono-revenue/premium-v1.css _site/premium-v1.css

          # Preserve the previous Revenue Sprint as a reversible fallback.
          cp ports/revenue-sprint/index.html _site/revenue-sprint/index.html
          cp -R doxa-sure/. _site/doxa-sure/
          cp ports/yenzanow/index.html _site/yenzanow/index.html
          cp ports/yenzanow/healthz.txt _site/yenzanow/healthz.txt
          cp -R portfolio-growth/. _site/portfolio-growth/
          cp -R ports/izakhono-one/. _site/izakhono-one/
          cp -R one/. _site/one/
          cp -R ports/izakhono-one/. _site/ports/izakhono-one/
          cp -R ports/kora-kids/. _site/kora-kids/
          cp -R yhvh-gospel-tv/. _site/yhvh-gospel-tv/
          cp -R izakhono-digital-finance/. _site/izakhono-digital-finance/
          cp -R ports/kora-gospel-tv/. _site/ports/kora-gospel-tv/
          cp -R IZAKHONO-STUDIO/dist/. _site/creative-suite/
          touch _site/.nojekyll

      - name: Configure Pages artifact
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload IZAKHONO static gateway
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  wait-native-pages:
    needs: build-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for native Pages publisher to clear the environment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100"
          echo "Waiting for native GitHub Pages deployment for ${GITHUB_SHA} to finish before IZAKHONO publishes last."
          for i in $(seq 1 72); do
            json="$(curl -fsSL --max-time 15 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$api")"
            state="$(printf '%s' "$json" | jq -r '[.workflow_runs[] | select(.name=="pages build and deployment")][0].status // "missing"')"
            conclusion="$(printf '%s' "$json" | jq -r '[.workflow_runs[] | select(.name=="pages build and deployment")][0].conclusion // ""')"
            echo "NATIVE_PAGES_STATUS=$state NATIVE_PAGES_CONCLUSION=$conclusion"
            if [ "$state" = "completed" ]; then
              exit 0
            fi
            if [ "$state" = "missing" ] && [ "$i" -ge 12 ]; then
              echo "No native Pages run found after one minute; continuing with IZAKHONO publisher."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Native Pages publisher did not clear within the synchronization window."
          exit 1

  deploy:
    needs: [build-gateway, wait-native-pages]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy prebuilt gateway
        id: deployment
        uses: actions/deploy-pages@v4


  verify-digital-finance:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify IZAKHONO Digital Finance public resilience route
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bevanshelton-netizen.github.io/Downloads/izakhono-digital-finance/"
          ok=0
          for i in $(seq 1 24); do
            rm -f /tmp/df-home.html /tmp/df-platform.json /tmp/df-hero.svg
            if curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/df-home.html "$BASE" &&
               curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/df-platform.json "${BASE}platform.json" &&
               curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/df-hero.svg "${BASE}assets/digital-finance-hero.svg" &&
               grep -Fq 'IZAKHONO DIGITAL FINANCE' /tmp/df-home.html &&
               grep -Fq 'Financial-services workforce package' /tmp/df-home.html &&
               grep -Fq 'R1,000' /tmp/df-home.html &&
               grep -Fq 'WORKFORCE AUTOPILOT' /tmp/df-hero.svg; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          python - <<'PY'
          import json
          x=json.load(open('/tmp/df-platform.json'))
          assert x['platform_id']=='izakhono-digital-finance'
          assert x['status']=='EXTERNAL LIVE VERIFIED'
          assert x['payments']['state']=='GATED_PENDING_VERIFIED_PRODUCT_CHECKOUT'
          assert x['data']['tracking']=='None'
          PY
          forbidden='utm_|googletagmanager|google-analytics|facebook[^<]*(pixel|track)|hotjar|clarity\.ms|mixpanel|amplitude|plausible|matomo'
          ! grep -Eqi "$forbidden" /tmp/df-home.html
          echo "DIGITAL_FINANCE_GITHUB_PAGES_RESILIENCE=VERIFIED"

  verify-yhvh-gospel:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify YHVH Gospel TV public resilience route
        shell: bash
        run: |
          set -euo pipefail
          FRONT="https://bevanshelton-netizen.github.io/Downloads/yhvh-gospel-tv/"
          CHANNEL="https://bevanshelton-netizen.github.io/Downloads/ports/kora-gospel-tv/"
          ok=0
          for i in $(seq 1 24); do
            rm -f /tmp/yhvh-front.html /tmp/yhvh-channel.html
            if curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/yhvh-front.html "$FRONT" &&
               curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/yhvh-channel.html "$CHANNEL" &&
               grep -Fqi 'YHVH GOSPEL TV' /tmp/yhvh-front.html &&
               grep -Fqi 'YHVH GOSPEL TV' /tmp/yhvh-channel.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          echo "YHVH_GOSPEL_PAGES_RESILIENCE=VERIFIED"

  verify-creative-suite:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Creative Suite external fallback
        shell: bash
        run: |
          set -euo pipefail
          CREATIVE="https://bevanshelton-netizen.github.io/Downloads/creative-suite/"
          HEALTH="https://bevanshelton-netizen.github.io/Downloads/creative-suite/health.json"
          ok=0
          for i in $(seq 1 24); do
            rm -f /tmp/creative.html /tmp/creative-health.json
            if curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/creative.html "$CREATIVE" &&
               curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/creative-health.json "$HEALTH" &&
               grep -Fq '<div id="root"></div>' /tmp/creative.html &&
               node -e 'const x=require("/tmp/creative-health.json");if(x.ok!==true||x.service!=="izakhono-creative-suite"||x.registration_enabled!==false||x.checkout_enabled!==false)process.exit(2)'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

  verify-kora-kids:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify KORA KIDS public route
        shell: bash
        run: |
          set -euo pipefail
          KIDS="https://bevanshelton-netizen.github.io/Downloads/kora-kids/"
          ok=0
          for i in $(seq 1 24); do
            rm -f /tmp/kids.html /tmp/kids.h
            if curl -fsSL --connect-timeout 4 --max-time 8 -D /tmp/kids.h -o /tmp/kids.html "$KIDS" &&
               grep -q 'LEBO' /tmp/kids.html &&
               grep -q 'JABU' /tmp/kids.html &&
               grep -q 'KORA KIDS' /tmp/kids.html &&
               grep -qi '^content-type: text/html' /tmp/kids.h; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

  verify-revenue-sprint:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Revenue Sprint public route
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          REVENUE="https://bevanshelton-netizen.github.io/Downloads/"
          ok=0
          for i in $(seq 1 24); do
            rm -f /tmp/revenue.html /tmp/revenue.h
            if curl -fsSL --connect-timeout 4 --max-time 8 -D /tmp/revenue.h -o /tmp/revenue.html "$REVENUE" &&
               grep -q 'IZAKHONO Business Growth Desk' /tmp/revenue.html &&
               grep -q 'AI Automation' /tmp/revenue.html &&
               grep -q 'Special:FilePath' /tmp/revenue.html &&
               grep -qi '^content-type: text/html' /tmp/revenue.h; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

  verify-izakhono-one:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify IZAKHONO ONE static resilience route
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bevanshelton-netizen.github.io/Downloads/izakhono-one/"
          SHORT="https://bevanshelton-netizen.github.io/Downloads/one/"
          PORT_BASE="https://bevanshelton-netizen.github.io/Downloads/ports/izakhono-one/"
          HEALTH="${PORT_BASE}health-check/"
          CLINIC="${PORT_BASE}clinic/"
          CONTRACTORS="${PORT_BASE}contractors/"
          GUIDE="${PORT_BASE}guides/how-to-price-a-job-for-profit/"
          PORTFOLIO="https://bevanshelton-netizen.github.io/Downloads/portfolio-growth/"
          LAUNCH="https://bevanshelton-netizen.github.io/Downloads/portfolio-growth/launch/?platform=fortress"
          ok=0

          fetch_all() {
            local failed=0
            curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/one-base.html "$BASE" & p1=$!
            curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/one-short.html "$SHORT" & p9=$!
            curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/one-port.html "$PORT_BASE" & p2=$!
            curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/one-health.html "$HEALTH" & p3=$!
            curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/one-clinic.html "$CLINIC" & p4=$!
            curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/one-contractors.html "$CONTRACTORS" & p5=$!
            curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/one-guide.html "$GUIDE" & p6=$!
            curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/portfolio.html "$PORTFOLIO" & p7=$!
            curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/launch.html "$LAUNCH" & p8=$!
            for pid in $p1 $p2 $p3 $p4 $p5 $p6 $p7 $p8 $p9; do
              wait "$pid" || failed=1
            done
            return "$failed"
          }

          for i in $(seq 1 24); do
            rm -f /tmp/one-base.html /tmp/one-short.html /tmp/one-port.html /tmp/one-health.html /tmp/one-clinic.html /tmp/one-contractors.html /tmp/one-guide.html /tmp/portfolio.html /tmp/launch.html
            if fetch_all &&
               grep -q 'IZAKHONO ONE' /tmp/one-base.html &&
               grep -q 'IZAKHONO ONE' /tmp/one-short.html &&
               grep -q 'HYBRID PUBLIC ROUTE' /tmp/one-short.html &&
               grep -q 'izakhono-one-hub' /tmp/one-short.html &&
               grep -q 'IZAKHONO ONE' /tmp/one-port.html &&
               grep -q 'FREE 3-MINUTE BUSINESS HEALTH CHECK' /tmp/one-health.html &&
               grep -q 'Business Clinic' /tmp/one-clinic.html &&
               grep -q 'Contractors' /tmp/one-contractors.html &&
               grep -q 'Stop quoting from instinct' /tmp/one-guide.html &&
               grep -q 'IZAKHONO PORTFOLIO' /tmp/portfolio.html &&
               grep -q 'IZAKHONO' /tmp/launch.html &&
               grep -q '<span>PORTFOLIO</span>' /tmp/launch.html; then
              ok=1
              break
            fi
            sleep 5
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::IZAKHONO ONE static route verification did not satisfy every content marker."
            for spec in               '/tmp/one-base.html|IZAKHONO ONE'               '/tmp/one-short.html|HYBRID PUBLIC ROUTE'               '/tmp/one-short.html|izakhono-one-hub'               '/tmp/one-port.html|IZAKHONO ONE'               '/tmp/one-health.html|FREE 3-MINUTE BUSINESS HEALTH CHECK'               '/tmp/one-clinic.html|Business Clinic'               '/tmp/one-contractors.html|Contractors'               '/tmp/one-guide.html|Stop quoting from instinct'               '/tmp/portfolio.html|IZAKHONO PORTFOLIO'               '/tmp/launch.html|<span>PORTFOLIO</span>'
            do
              file="${spec%%|*}"
              marker="${spec#*|}"
              if [ ! -f "$file" ]; then
                echo "::error::Missing fetched file: $file"
              elif ! grep -Fq "$marker" "$file"; then
                echo "::error::Missing marker [$marker] in $file"
              fi
            done
            exit 1
          fi
          forbidden='utm_|googletagmanager|google-analytics|facebook[^<]*(pixel|track)|hotjar|clarity\.ms|mixpanel|amplitude|plausible|matomo|portfolio-growth/bridge\.js|izakhono-growth-event|iz_one_anon|iz_portfolio_anon'
          privacy_fail=0
          for file in /tmp/one-base.html /tmp/one-short.html /tmp/one-port.html /tmp/one-health.html /tmp/one-clinic.html /tmp/one-contractors.html /tmp/one-guide.html; do
            if grep -Eiq "$forbidden" "$file"; then
              echo "::error::Forbidden privacy/tracking marker detected in $file"
              grep -Ein "$forbidden" "$file" | head -20 || true
              privacy_fail=1
            fi
          done
          test "$privacy_fail" -eq 0
