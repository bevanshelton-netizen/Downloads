name: Deploy IZAKHONO Static Gateway to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/PUBLISH_STATIC_GATEWAY'
      - 'ports/yenzanow/**'
      - 'ports/revenue-sprint/**'
      - 'doxa-sure/**'
      - 'ports/izakhono-one/**'
      - 'ports/kora-kids/**'
      - 'portfolio-growth/**'
      - 'IZAKHONO-STUDIO/**'
      - '.github/workflows/doxa-sure-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: izakhono-static-pages
  cancel-in-progress: true

jobs:
  build-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for Creative Suite
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Creative Suite external fallback
        working-directory: IZAKHONO-STUDIO
        run: |
          npm install --no-audit --no-fund
          npm run build -- --base=/Downloads/creative-suite/

      - name: Assemble stable static gateway
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/doxa-sure _site/yenzanow
          mkdir -p _site/izakhono-one
          mkdir -p _site/ports/izakhono-one
          mkdir -p _site/portfolio-growth
          mkdir -p _site/kora-kids
          mkdir -p _site/creative-suite

          cp ports/revenue-sprint/index.html _site/index.html
          cp -R doxa-sure/. _site/doxa-sure/
          cp ports/yenzanow/index.html _site/yenzanow/index.html
          cp ports/yenzanow/healthz.txt _site/yenzanow/healthz.txt
          cp -R portfolio-growth/. _site/portfolio-growth/
          cp -R ports/izakhono-one/. _site/izakhono-one/
          cp -R ports/izakhono-one/. _site/ports/izakhono-one/
          cp -R ports/kora-kids/. _site/kora-kids/
          cp -R IZAKHONO-STUDIO/dist/. _site/creative-suite/
          touch _site/.nojekyll

      - name: Configure Pages artifact
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload IZAKHONO static gateway
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build-gateway
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy prebuilt gateway
        id: deployment
        uses: actions/deploy-pages@v4

  verify-creative-suite:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Creative Suite external fallback
        shell: bash
        run: |
          set -euo pipefail
          CREATIVE="https://bevanshelton-netizen.github.io/Downloads/creative-suite/"
          HEALTH="https://bevanshelton-netizen.github.io/Downloads/creative-suite/health.json"
          ok=0
          for i in $(seq 1 24); do
            rm -f /tmp/creative.html /tmp/creative-health.json
            if curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/creative.html "$CREATIVE" &&
               curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/creative-health.json "$HEALTH" &&
               grep -Fq '<div id="root"></div>' /tmp/creative.html &&
               node -e 'const x=require("/tmp/creative-health.json");if(x.ok!==true||x.service!=="izakhono-creative-suite"||x.registration_enabled!==false||x.checkout_enabled!==false)process.exit(2)'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

  verify-kora-kids:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify KORA KIDS public route
        shell: bash
        run: |
          set -euo pipefail
          KIDS="https://bevanshelton-netizen.github.io/Downloads/kora-kids/"
          ok=0
          for i in $(seq 1 24); do
            rm -f /tmp/kids.html /tmp/kids.h
            if curl -fsSL --connect-timeout 4 --max-time 8 -D /tmp/kids.h -o /tmp/kids.html "$KIDS" &&
               grep -q 'LEBO' /tmp/kids.html &&
               grep -q 'JABU' /tmp/kids.html &&
               grep -q 'KORA KIDS' /tmp/kids.html &&
               grep -qi '^content-type: text/html' /tmp/kids.h; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

  verify-revenue-sprint:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Revenue Sprint public route
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          REVENUE="https://bevanshelton-netizen.github.io/Downloads/"
          ok=0
          for i in $(seq 1 24); do
            rm -f /tmp/revenue.html /tmp/revenue.h
            if curl -fsSL --connect-timeout 4 --max-time 8 -D /tmp/revenue.h -o /tmp/revenue.html "$REVENUE" &&
               grep -q 'IZAKHONO REVENUE SPRINT' /tmp/revenue.html &&
               grep -q 'Built enough.' /tmp/revenue.html &&
               grep -qi '^content-type: text/html' /tmp/revenue.h; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

  verify-izakhono-one:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify IZAKHONO ONE static resilience route
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bevanshelton-netizen.github.io/Downloads/izakhono-one/"
          PORT_BASE="https://bevanshelton-netizen.github.io/Downloads/ports/izakhono-one/"
          HEALTH="${PORT_BASE}health-check/"
          CLINIC="${PORT_BASE}clinic/"
          CONTRACTORS="${PORT_BASE}contractors/"
          GUIDE="${PORT_BASE}guides/how-to-price-a-job-for-profit/"
          PORTFOLIO="https://bevanshelton-netizen.github.io/Downloads/portfolio-growth/"
          LAUNCH="https://bevanshelton-netizen.github.io/Downloads/portfolio-growth/launch/?platform=fortress"
          ok=0

          fetch_all() {
            local failed=0
            curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/one-base.html "$BASE" & p1=$!
            curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/one-port.html "$PORT_BASE" & p2=$!
            curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/one-health.html "$HEALTH" & p3=$!
            curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/one-clinic.html "$CLINIC" & p4=$!
            curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/one-contractors.html "$CONTRACTORS" & p5=$!
            curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/one-guide.html "$GUIDE" & p6=$!
            curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/portfolio.html "$PORTFOLIO" & p7=$!
            curl -fsSL --connect-timeout 4 --max-time 8 -o /tmp/launch.html "$LAUNCH" & p8=$!
            for pid in $p1 $p2 $p3 $p4 $p5 $p6 $p7 $p8; do
              wait "$pid" || failed=1
            done
            return "$failed"
          }

          for i in $(seq 1 24); do
            rm -f /tmp/one-base.html /tmp/one-port.html /tmp/one-health.html /tmp/one-clinic.html /tmp/one-contractors.html /tmp/one-guide.html /tmp/portfolio.html /tmp/launch.html
            if fetch_all &&
               grep -q 'IZAKHONO ONE' /tmp/one-base.html &&
               grep -q 'IZAKHONO ONE' /tmp/one-port.html &&
               grep -q 'FREE 3-MINUTE BUSINESS HEALTH CHECK' /tmp/one-health.html &&
               grep -q 'Business Clinic' /tmp/one-clinic.html &&
               grep -q 'Contractors' /tmp/one-contractors.html &&
               grep -q 'Stop quoting from instinct' /tmp/one-guide.html &&
               grep -q 'IZAKHONO PORTFOLIO' /tmp/portfolio.html &&
               grep -q 'IZAKHONO PORTFOLIO' /tmp/launch.html; then
              ok=1
              break
            fi
            sleep 5
          done

          test "$ok" -eq 1
          cat /tmp/one-base.html /tmp/one-port.html /tmp/one-health.html /tmp/one-clinic.html /tmp/one-contractors.html /tmp/one-guide.html > /tmp/izakhono-one-privacy.html
          ! grep -Eqi 'utm_|googletagmanager|google-analytics|facebook[^<]*(pixel|track)|hotjar|clarity\.ms|mixpanel|amplitude|plausible|matomo|portfolio-growth/bridge\.js|izakhono-growth-event|iz_one_anon|iz_portfolio_anon' /tmp/izakhono-one-privacy.html
