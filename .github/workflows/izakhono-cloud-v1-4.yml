name: IZAKHONO CLOUD v1.4 Release Gate

on:
  pull_request:
    paths:
      - 'izakhono-cloud/release/v1.4/**'
      - 'izakhono-cloud/verify-v1.4-release.sh'
      - 'izakhono-cloud/oracle-a1-preflight.sh'
      - 'izakhono-cloud/FIRST-SERVER-QUICKSTART.md'
      - 'izakhono-cloud/IZAKHONO-CLOUD-V1.4-STATUS.md'
      - 'izakhono-cloud/ORACLE-ALWAYS-FREE-FIRST-SERVER.md'
      - 'izakhono-cloud/check-first-server.sh'
      - 'izakhono-cloud/cloud-init.yaml'
      - 'izakhono-cloud/install-first-server.sh'
      - '.github/workflows/izakhono-cloud-v1-4.yml'
  push:
    branches:
      - izakhono-cloud-v1-4
    paths:
      - 'izakhono-cloud/release/v1.4/**'
      - 'izakhono-cloud/verify-v1.4-release.sh'
      - 'izakhono-cloud/oracle-a1-preflight.sh'
      - 'izakhono-cloud/FIRST-SERVER-QUICKSTART.md'
      - 'izakhono-cloud/IZAKHONO-CLOUD-V1.4-STATUS.md'
      - 'izakhono-cloud/ORACLE-ALWAYS-FREE-FIRST-SERVER.md'
      - 'izakhono-cloud/check-first-server.sh'
      - 'izakhono-cloud/cloud-init.yaml'
      - 'izakhono-cloud/install-first-server.sh'
      - '.github/workflows/izakhono-cloud-v1-4.yml'

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable release, installer and launch gate
        run: bash izakhono-cloud/verify-v1.4-release.sh
      - name: Verify Oracle A1 preflight syntax
        run: bash -n izakhono-cloud/oracle-a1-preflight.sh
      - name: Verify upstream images support Linux Arm64
        shell: bash
        run: |
          set -euo pipefail
          images=(
            'postgres:16-alpine'
            'caddy:2-alpine'
            'prom/prometheus:latest'
            'prom/alertmanager:latest'
            'prom/node-exporter:latest'
            'python:3.12-slim'
          )
          for image in "${images[@]}"; do
            echo "Checking ${image} for linux/arm64..."
            if docker buildx imagetools inspect --raw "$image" > /tmp/izakhono-image-index.json 2>/tmp/izakhono-image-index.err; then
              python3 - "$image" <<'PY'
          import json, sys
          image = sys.argv[1]
          with open('/tmp/izakhono-image-index.json', encoding='utf-8') as fh:
              data = json.load(fh)
          platforms = {
              (m.get('platform', {}).get('os'), m.get('platform', {}).get('architecture'))
              for m in data.get('manifests', [])
          }
          if ('linux', 'arm64') not in platforms:
              raise SystemExit(f'{image}: linux/arm64 manifest missing; platforms={sorted(platforms)}')
          print(f'{image}: linux/arm64 OK')
          PY
            else
              echo "Registry manifest metadata lookup unavailable for ${image}; verifying by real arm64 pull."
              cat /tmp/izakhono-image-index.err || true
              docker pull --platform linux/arm64 "$image"
              actual="$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')"
              test "$actual" = "linux/arm64" || { echo "${image}: expected linux/arm64, got $actual" >&2; exit 1; }
              echo "${image}: linux/arm64 OK (pull fallback)"
            fi
          done
          echo "MinIO live-registry probing is not a universal CI gate for the frozen v1.4 release."
          echo "The immutable release hash is verified above; any real v1.4 host must still prove its required image pulls during host preflight."
