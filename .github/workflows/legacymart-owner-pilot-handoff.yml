name: LegacyMart Owner Pilot Handoff Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'START-LEGACYMART-ON-IZAKHONO.cmd'
      - 'izakhono-cloud/DEPLOY-LEGACYMART-ISN-01.ps1'
      - 'izakhono-cloud/RUN-IZAKHONO-FLEET-ISN-01.ps1'
      - 'izakhono-owned-cloud/import-repo-to-code.sh'
      - 'izakhono-owned-cloud/deploy-legacymart.sh'
      - 'owner-host/platforms.json'
      - '.github/workflows/legacymart-owner-pilot-handoff.yml'
  push:
    branches: [main]
    paths:
      - 'START-LEGACYMART-ON-IZAKHONO.cmd'
      - 'izakhono-cloud/DEPLOY-LEGACYMART-ISN-01.ps1'
      - 'izakhono-cloud/RUN-IZAKHONO-FLEET-ISN-01.ps1'
      - '.github/workflows/legacymart-owner-pilot-handoff.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse PowerShell launcher
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'izakhono-cloud/DEPLOY-LEGACYMART-ISN-01.ps1'),
            [ref]$tokens,[ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Guard LegacyMart private-pilot contract
        shell: pwsh
        run: |
          $p = Get-Content 'izakhono-cloud/DEPLOY-LEGACYMART-ISN-01.ps1' -Raw
          foreach ($required in @(
            'ENGINE-PROOF.json',
            'import-repo-to-code.sh',
            'deploy-legacymart.sh',
            'IZAKHONO_CODE',
            'IZAKHONO_RUNTIME',
            'market.domains.izakhonoafrica.co.za',
            'LEGACYMART-CUTOVER.json',
            'legacy_checkout_enabled'
          )) {
            if ($p -notmatch [regex]::Escape($required)) { throw "Missing LegacyMart pilot contract: $required" }
          }
          if ($p -notmatch 'Legacy PayFast checkout remains disabled') { throw 'legacy checkout safety statement missing' }
          if ($p -notmatch 'No public-live claim is made unless PUBLIC_HTTPS is VERIFIED') { throw 'public verification boundary missing' }
          if ($p -match 'cloudflared tunnel route|route53|nameserver|dns update') { throw 'LegacyMart pilot must not modify public edge directly' }

      - name: Guard fleet integration
        shell: pwsh
        run: |
          $f = Get-Content 'izakhono-cloud/RUN-IZAKHONO-FLEET-ISN-01.ps1' -Raw
          if ($f -notmatch 'DEPLOY-LEGACYMART-ISN-01.ps1') { throw 'LegacyMart is not registered in the ISN-01 fleet' }

      - name: Validate CMD handoff
        shell: pwsh
        run: |
          $c = Get-Content 'START-LEGACYMART-ON-IZAKHONO.cmd' -Raw
          if ($c -notmatch 'DEPLOY-LEGACYMART-ISN-01.ps1') { throw 'launcher target mismatch' }
          if ($c -notmatch 'raw.githubusercontent.com/bevanshelton-netizen/Downloads/main') { throw 'launcher must fetch merged main script' }
