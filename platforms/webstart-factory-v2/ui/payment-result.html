<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment | IZAKHONO WebStart</title><style>body{margin:0;background:#07101f;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh;padding:24px}.card{max-width:640px;background:#fff;color:#111827;padding:36px;border-radius:22px}h1{font-size:2.5rem;margin:.2em 0}p{color:#5b6779;font-size:1.08rem}a{display:inline-block;margin-top:16px;background:#0bb3bf;color:#fff;text-decoration:none;padding:13px 18px;border-radius:12px;font-weight:800}</style></head><body><div class="card"><div id="icon">•</div><h1 id="title">Payment status</h1><p id="message">Checking the result...</p><a href="/">Return to WebStart</a></div><script>const s=(new URLSearchParams(location.search).get("status")||"").toLowerCase();const good=s==="success",cancel=s==="cancelled";document.getElementById("icon").textContent=good?"✓":cancel?"↩":"!";document.getElementById("title").textContent=good?"Payment received":cancel?"Payment cancelled":"Payment was not completed";document.getElementById("message").textContent=good?"Thank you. iKhokha will confirm the transaction securely and your order status will update automatically.":cancel?"No payment was taken. You can return to WebStart and try again.":"Your payment did not complete. Return to WebStart to retry or review the order.";</script></body></html>
