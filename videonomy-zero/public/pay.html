<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIDEONOMY — Founding Partner Checkout</title><style>:root{--b:#071019;--c:#0d1722;--l:#203245;--t:#f6fbff;--m:#9db0bf;--a:#7cf7c9}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Inter,system-ui,sans-serif}.w{max-width:680px;margin:auto;padding:7vw 5vw}.card{border:1px solid var(--l);background:var(--c);border-radius:20px;padding:24px}a{color:var(--a)}input,button{width:100%;font:inherit;border-radius:11px;padding:12px;margin:6px 0;border:1px solid var(--l);background:#071019;color:#fff}button{background:var(--a);color:#03110d;border:0;font-weight:900;cursor:pointer}.m{color:var(--m);font-size:13px}.price{font-size:36px;color:var(--a);font-weight:900}.status{min-height:24px;margin-top:10px}</style></head><body><main class="w"><p><a href="/">← VIDEONOMY</a></p><section class="card"><div class="m">FOUNDING PARTNER CHECKOUT</div><h1 id="title">Launch partnership</h1><div class="price" id="price">—</div><p class="m">Payment is processed securely by PayFast in South African rand. Founding packages do not guarantee a minimum number of impressions while the audience is being built.</p><form id="f"><input name="name" placeholder="Your name / company" required><input name="email" type="email" placeholder="Business email" required><button type="submit">Continue to secure payment</button></form><div id="status" class="status m"></div></section></main><script>
const packages={'VZ-LAUNCH-1500':['Launch Supporter','R1,500'],'VZ-GROW-5000':['Growth Partner','R5,000'],'VZ-FOUNDING-12500':['Founding Brand Partner','R12,500']};const q=new URLSearchParams(location.search),code=q.get('package')||'VZ-LAUNCH-1500',p=packages[code]||packages['VZ-LAUNCH-1500'];title.textContent=p[0];price.textContent=p[1];f.onsubmit=async e=>{e.preventDefault();status.textContent='Preparing secure checkout…';const d=new FormData(f);try{let r=await fetch('/api/commerce/payment-intents',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({platform:'videonomy',package_code:code,name:d.get('name'),email:d.get('email')})});let j=await r.json();if(!r.ok)throw new Error(j.error||'Could not create payment');r=await fetch(j.checkout_url);const c=await r.json();if(!r.ok)throw new Error(c.error||'Payment activation is not available yet');const form=document.createElement('form');form.method='post';form.action=c.action;Object.entries(c.fields).forEach(([k,v])=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=String(v);form.append(i)});document.body.append(form);form.submit()}catch(err){status.textContent=err.message+'. If payments are still being activated, please return to the advertising enquiry form and we will contact you.'}};
</script></body></html>
