<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALLEGRO VIBEZ — Programming</title><style>body{margin:0;background:#08100e;color:#f5f1e7;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:48px 20px}h1{font-size:clamp(38px,7vw,76px);margin:0}.eyebrow{letter-spacing:.16em;color:#8de0b7;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:28px}.card{border:1px solid #263b33;border-radius:18px;padding:22px;background:#0d1714}.time{color:#d9b56a;font-weight:800}.tag{display:inline-block;border:1px solid #315345;border-radius:999px;padding:6px 10px;margin:4px;color:#9ee7c0;font-size:12px}.note{color:#aebbb5;line-height:1.6}.count{font-size:42px;font-weight:800}</style></head><body><main><div class="eyebrow">ALLEGRO VIBEZ • PROGRAMMING CONSOLE</div><h1>The sound has a schedule.</h1><p class="note">Rights-cleared music and approved creator programming flow into curated playlists and broadcast shows.</p><section class="grid" id="stats"><div class="card"><div class="count" id="shows">—</div><div class="note">Active shows</div></div><div class="card"><div class="count" id="playlists">—</div><div class="note">Active playlists</div></div><div class="card"><div class="count" id="catalogue">—</div><div class="note">Approved catalogue items</div></div></section><h2>Weekly programming</h2><div class="grid" id="schedule"></div></main><script>const U='https://yfawrenhudjomhnglfhq.supabase.co/rest/v1/';const K='sb_publishable_3KY--8Y_uuKEdfdumC2txg__OWTRo2p';const H={apikey:K,Authorization:'Bearer '+K};async function get(t,q){const r=await fetch(U+t+'?'+q,{headers:H});return r.json()}async function boot(){const [s,p,c]=await Promise.all([get('allegro_broadcast_shows','select=name,start_time,end_time,days_of_week&active=eq.true&order=start_time'),get('allegro_broadcast_playlists','select=id&active=eq.true'),get('allegro_broadcast_catalogue','select=id&rights_status=eq.approved&active=eq.true')]);shows.textContent=s.length;playlists.textContent=p.length;catalogue.textContent=c.length;schedule.innerHTML=s.map(x=>`<article class="card"><div class="time">${x.start_time.slice(0,5)} — ${x.end_time.slice(0,5)}</div><h3>${x.name}</h3><div>${x.days_of_week.map(d=>['','MON','TUE','WED','THU','FRI','SAT','SUN'][d]).map(d=>`<span class="tag">${d}</span>`).join('')}</div></article>`).join('')}boot().catch(()=>{schedule.innerHTML='<p class="note">Programming data is temporarily unavailable.</p>'})</script></body></html>
