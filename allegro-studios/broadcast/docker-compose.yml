services:
  broadcaster:
    image: savonet/liquidsoap:v2.4.5
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    volumes:
      - ./liquidsoap:/etc/liquidsoap:ro
      - ./media:/media:ro
    command: ["liquidsoap", "/etc/liquidsoap/radio.liq"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8000/allegro-vibez.mp3 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
