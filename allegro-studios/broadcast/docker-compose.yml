services:
  icecast:
    image: infiniteproject/icecast:2.4.4
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD}
      ICECAST_HOSTNAME: ${ICECAST_HOSTNAME}
    volumes:
      - ./icecast.xml:/etc/icecast2/icecast.xml:ro

  broadcaster:
    image: savonet/liquidsoap:1.4.4
    restart: unless-stopped
    depends_on:
      - icecast
    volumes:
      - ./liquidsoap:/etc/liquidsoap:ro
      - ./media:/media:ro
