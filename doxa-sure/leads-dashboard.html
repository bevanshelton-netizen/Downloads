<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DOXA-SURE Lead Desk</title><link rel="stylesheet" href="./leads-dashboard.css"></head>
<body><main class="shell"><header><div><p class="eyebrow">Owner access only</p><h1>DOXA-SURE Lead Desk</h1><p>Website enquiries only. No personal messaging connection.</p></div><button id="signOut" class="secondary hidden">Sign out</button></header>
<section id="setup" class="card hidden"><h2>Activation required</h2><p>Add the browser-safe Supabase anon key to <code>config.js</code>, apply migration 002, and enrol your owner account.</p></section>
<section id="login" class="card"><h2>Secure sign in</h2><form id="loginForm"><label>Email<input name="email" type="email" autocomplete="email" required></label><button type="submit">Email me a sign-in link</button></form><p id="loginMessage" class="message" aria-live="polite"></p></section>
<section id="desk" class="hidden"><div class="metrics"><article><strong id="newCount">0</strong><span>New</span></article><article><strong id="urgentCount">0</strong><span>Urgent</span></article><article><strong id="totalCount">0</strong><span>Total</span></article></div><div class="toolbar"><label>Status<select id="statusFilter"><option value="">All</option><option>new</option><option>contacted</option><option>qualified</option><option>closed</option></select></label><button id="refresh" class="secondary">Refresh</button></div><p id="deskMessage" class="message" aria-live="polite"></p><div id="leadList" class="lead-list"></div></section>
</main><script src="./config.js"></script><script type="module" src="./leads-dashboard.js"></script></body></html>
