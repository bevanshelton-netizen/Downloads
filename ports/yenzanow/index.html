<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YENZANOW</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font:14px system-ui,-apple-system,sans-serif;color:#111827}#app{max-width:470px;margin:auto;min-height:100vh;background:#f8fafc;padding-bottom:72px}header{padding:14px 18px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:4}.logo{font-size:23px;font-weight:950}.logo b{color:#ff5a1f}.tag,.sub,.small{color:#667085}.tag{font-size:9px}.small{font-size:11px}.p{padding:18px}.hero{background:linear-gradient(135deg,#111827,#334155);color:white;padding:24px;border-radius:24px}.hero h1{font-size:31px;line-height:1;margin:8px 0}.hero p{color:#dbe3ef}.btn{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff5a1f,#ff9b28);color:#fff;font-weight:950;margin-top:10px}.ghost{background:#fff;color:#111827;border:1px solid #d0d5dd}.danger{background:#fff;color:#b42318;border:1px solid #fecaca}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:15px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.svc{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:12px;text-align:center}.svc span{display:block;font-size:24px}.svc b{font-size:11px}.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid #eee}.note,.ok,.info,.err{border-radius:14px;padding:12px;font-size:12px;line-height:1.45;margin-top:12px}.note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8}.err{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239}.field{margin-top:11px}.field label{font-size:11px;font-weight:850;color:#475467}input,textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:12px;margin-top:7px;font:inherit;background:#fff}.checks label{display:flex;align-items:center;gap:8px;padding:6px 0}.checks input{width:auto;margin:0}.back{border:0;background:none;padding:0;color:#475467;font-weight:850}h2{font-size:25px;margin:7px 0}.price{font-size:28px;font-weight:950}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:10px;font-weight:900}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(470px,100%);display:grid;grid-template-columns:1fr 1fr;background:#fff;border-top:1px solid #e5e7eb;z-index:6}nav button{border:0;background:white;padding:14px;color:#667085;font-weight:900}nav button.on{color:#ff5a1f}</style></head><body><div id=app><header><div class=logo>YENZA<b>NOW</b></div><div class=tag>Get it done. Now.</div></header><main id=main></main><nav><button id=ct class=on>⌂ Customer</button><button id=pt>⚒ PRO</button></nav></div><script>const SB='https://bsbmychzqipurpqxheuv.supabase.co',KEY='sb_publishable_GPWLSV1KeN5Nro5jMermCg_pfUBUU2T';const fallback=[['plumbing','Plumbing','🔧'],['electrical','Electrical','⚡'],['locksmith','Locksmith','🔐'],['geyser','Geyser','♨️'],['gate-motor','Gate motor','🚪'],['appliance','Appliance repair','🧊']].map(x=>({slug:x[0],name:x[1],icon:x[2],callout_fee_cents:34900,protection_fee_cents:4900}));let services=fallback,view='home',service=services[0],issue='',address='',authMode='signup',session=JSON.parse(localStorage.getItem('yn_session')||'null'),booking=null,proState=null,offers=[];const M=document.querySelector('#main'),money=c=>'R'+(c/100).toLocaleString('en-ZA',{maximumFractionDigits:0}),ranges={plumbing:[650,1400],electrical:[550,1500],locksmith:[450,1200],geyser:[750,2200],'gate-motor':[650,1800],appliance:[550,1600]};async function catalog(){try{let r=await fetch(SB+'/rest/v1/yenzanow_public_services?select=*',{headers:{apikey:KEY}}),d=await r.json();if(r.ok&&d.length){services=d;service=d[0];render()}}catch{}}function tabs(n){ct.classList.toggle('on',n===1);pt.classList.toggle('on',n===2)}function authFields(){return session?.access_token?'':`<div class=field><label>Email</label><input id=em type=email></div><div class=field><label>Password</label><input id=pw type=password minlength=8></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn ${authMode==='signup'?'':'ghost'}" onclick="authMode='signup';render()">New account</button><button class="btn ${authMode==='signin'?'':'ghost'}" onclick="authMode='signin';render()">Sign in</button></div>`}async function auth(path,body){let r=await fetch(SB+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.msg||d.message||'Authentication failed');return d}async function ensureSession(){if(session?.access_token)return session;let e=document.querySelector('#em')?.value.trim(),p=document.querySelector('#pw')?.value||'';if(!e||p.length<8)throw Error('Use a valid email and a password of at least 8 characters.');let d=authMode==='signup'?await auth('/auth/v1/signup',{email:e,password:p,data:{source:'yenzanow'}}):await auth('/auth/v1/token?grant_type=password',{email:e,password:p});if(!d.access_token)throw Error('Check your email to confirm the account, then return and sign in.');session=d;localStorage.setItem('yn_session',JSON.stringify(d));return d}function home(){let ret=new URLSearchParams(location.search).get('payment')==='returned'?'<div class=info><b>Payment verification in progress.</b><br>We will only dispatch after the payment provider confirms success.</div>':'';return `<div class=p>${ret}<div class=hero><small>JOHANNESBURG PILOT</small><h1>Something broken?</h1><p>Tell us what you see. We handle the rest.</p><button class=btn onclick="pick('plumbing')">🚨 I NEED HELP NOW</button></div><div class=grid>${services.map(s=>`<button class=svc onclick="pick('${s.slug}')"><span>${s.icon}</span><b>${s.name}</b></button>`).join('')}</div><p class=small>Real booking records. Professional diagnosis before repair. Digital approval before extra work.</p></div>`}function pick(slug){service=services.find(s=>s.slug===slug)||services[0];view='issue';render()}function issuePage(){return `<div class=p><button class=back onclick="view='home';render()">← Back</button><h2>Tell us what you see</h2><p class=sub>You do not need to diagnose the fault.</p><div class=card><b>${service.icon} ${service.name}</b><div class=field><label>What happened?</label><textarea id=issue rows=4 placeholder="Describe what you see, hear or smell"></textarea></div><div class=field><label>Service address</label><input id=addr placeholder="Street / suburb, Johannesburg"></div><button class=btn onclick="issue=document.querySelector('#issue').value.trim();address=document.querySelector('#addr').value.trim();if(issue.length<5)return alert('Please describe the problem');view='estimate';render()">Continue</button></div></div>`}function estimate(){let r=ranges[service.slug]||[600,1500],co=service.callout_fee_cents||34900,pf=service.protection_fee_cents||4900;return `<div class=p><button class=back onclick="view='issue';render()">← Description</button><h2>Before we dispatch</h2><div class=card><span class=small>INDICATIVE RANGE ONLY</span><div class=price>R${r[0].toLocaleString()}–R${r[1].toLocaleString()}</div><p class=sub>Not a repair quote. The PRO diagnoses on site.</p></div><div class=card><div class=row><span>Call-out</span><b>${money(co)}</b></div><div class=row><span>Protection</span><b>${money(pf)}</b></div><div class=row><b>Secure at booking</b><b>${money(co+pf)}</b></div><button class=btn onclick="view='identity';render()">CONTINUE SECURELY →</button></div><div class=note>Any different or larger fault requires a new quote and your approval before work starts.</div></div>`}function identity(){return `<div class=p><button class=back onclick="view='estimate';render()">← Booking</button><h2>Secure your booking</h2><div class=card><div class=field><label>Full name</label><input id=fn></div><div class=field><label>Mobile</label><input id=ph inputmode=tel></div>${authFields()}<div id=msg></div><button class=btn onclick=createBooking()>CREATE JOB & CONTINUE</button></div></div>`}async function createBooking(){let m=document.querySelector('#msg'),name=document.querySelector('#fn').value.trim(),phone=document.querySelector('#ph').value.trim();try{if(!name||!phone)throw Error('Enter your name and mobile.');m.className='info';m.textContent='Securing booking…';let s=await ensureSession(),r=await fetch(SB+'/rest/v1/rpc/yenzanow_create_booking',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({p_service_slug:service.slug,p_issue_description:issue,p_address_text:address,p_full_name:name,p_phone:phone,p_priority:'standard'})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Booking failed');booking=d;view='pay';render()}catch(e){m.className='err';m.textContent=e.message}}function payPage(){return `<div class=p><div class=ok><b>✓ Job record created</b><br>Reference: ${(booking?.job_id||'').slice(-8).toUpperCase()}</div><div class=card><div class=row><span>Amount to secure</span><b>${money(booking?.amount_cents||39800)}</b></div><div class=row><span>Settlement entity</span><b>IZAKHONO AFRICA</b></div><div class=row><span>Preferred processor</span><b>Peach Payments</b></div><div id=paymsg></div><button class=btn onclick=startPayment()>PAY R398 SECURELY</button></div><div class=note>No payment success = no dispatch. The browser return page cannot mark a booking paid; only the payment provider's signed webhook can do that.</div></div>`}async function startPayment(){let m=document.querySelector('#paymsg');try{m.className='info';m.textContent='Opening secure payment…';let r=await fetch(SB+'/functions/v1/yenzanow-peach-start-payment',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({job_id:booking.job_id})}),d=await r.json().catch(()=>({}));if(!r.ok){if(d.error==='payment_processor_not_configured'){m.className='note';m.innerHTML='<b>Merchant onboarding is the final switch.</b><br>The secure Peach integration is built, but live Peach credentials have not yet been issued.';return}throw Error(d.error||'Payment could not start')}if(d.payment_url)location.href=d.payment_url;else if(d.already_secured){m.className='ok';m.textContent='Payment is already secured. Matching can begin.'}}catch(e){m.className='err';m.textContent=e.message}}async function loadPro(){if(!session?.access_token){proState=null;offers=[];render();return}try{let r=await fetch(SB+'/rest/v1/rpc/yenzanow_get_my_pro_status',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:'{}'});if(r.ok)proState=await r.json();if(proState?.verified){let o=await fetch(SB+'/rest/v1/rpc/yenzanow_my_active_offers',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:'{}'});offers=o.ok?await o.json():[]}render()}catch{render()}}function pro(){if(proState){let checks=(proState.checks||[]).map(x=>`<div class=row><span>${x.type}</span><b>${x.status}</b></div>`).join('');let offerHtml=proState.verified?`<h2 style="margin-top:22px">Live offers</h2>${offers.length?offers.map(o=>`<div class=card><span class=pill>${o.service_name}</span><h3>${o.issue_description}</h3><p class=sub>${o.address_text||'Johannesburg'}${o.eta_minutes?' · '+o.eta_minutes+' min':''}</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class=btn onclick="offerAction('${o.offer_id}','accept')">ACCEPT</button><button class="btn danger" onclick="offerAction('${o.offer_id}','decline')">DECLINE</button></div></div>`).join(''):'<div class=card>No live offers right now.</div>'}`:'';return `<div class=p><h2>YENZANOW PRO</h2><div class=${proState.verified?'ok':'note'}><b>${proState.verified?'✓ Verified & eligible':'Verification in progress'}</b><br>${proState.verified?'Only secured jobs can reach this screen.':'You cannot receive real jobs until verification is complete.'}</div><div class=card><h3>${proState.display_name||'Application'}</h3><p class=sub>${proState.service_area||''}</p>${checks}</div>${offerHtml}</div>`}return `<div class=p><h2>Become a YENZANOW PRO</h2><p class=sub>Join the Johannesburg launch network. No signup fee.</p><div class=card><div class=field><label>Name shown to customers</label><input id=pdn></div><div class=field><label>Business name (optional)</label><input id=pbn></div><div class=field><label>Mobile</label><input id=pph></div><div class=field><label>Service area</label><input id=parea placeholder="e.g. Johannesburg West"></div><div class="checks field"><label><b>Your trades</b></label>${services.map(s=>`<label><input name=psvc type=checkbox value="${s.slug}"> ${s.icon} ${s.name}</label>`).join('')}</div>${authFields()}<div id=promsg></div><button class=btn onclick=registerPro()>SUBMIT FOR VERIFICATION</button></div><div class=note>Only YENZANOW can grant verification, ratings or dispatch eligibility.</div></div>`}async function registerPro(){let m=document.querySelector('#promsg');try{let name=document.querySelector('#pdn').value.trim(),business=document.querySelector('#pbn').value.trim(),phone=document.querySelector('#pph').value.trim(),area=document.querySelector('#parea').value.trim(),slugs=[...document.querySelectorAll('input[name=psvc]:checked')].map(x=>x.value);if(!name||!phone||!area||!slugs.length)throw Error('Complete your details and choose at least one trade.');m.className='info';m.textContent='Submitting…';let s=await ensureSession(),r=await fetch(SB+'/rest/v1/rpc/yenzanow_register_pro',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({p_display_name:name,p_business_name:business,p_phone:phone,p_service_area:area,p_service_slugs:slugs})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Application failed');await loadPro()}catch(e){m.className='err';m.textContent=e.message}}async function offerAction(id,action){try{let r=await fetch(SB+'/functions/v1/yenzanow-pro-offer-action',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({offer_id:id,action})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Action failed');alert(action==='accept'?'Job accepted. You are dispatched.':'Offer declined.');await loadPro()}catch(e){alert(e.message)}}function render(){M.innerHTML=view==='home'?home():view==='issue'?issuePage():view==='estimate'?estimate():view==='identity'?identity():view==='pay'?payPage():pro()}ct.onclick=()=>{view='home';tabs(1);render()};pt.onclick=()=>{view='pro';tabs(2);render();loadPro()};render();catalog();</script></body></html>
